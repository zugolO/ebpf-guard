config_version: "v0.1"

server:
  bind_address: "0.0.0.0:19090"  # Слушать на всех интерфейсах для Docker
  metrics_path: "/metrics"
  health_path: "/health"
  enable_debug: true  # нужен /debug/state, который используют attacks/run-all-attacks.sh и analyze-alerts.py

bpf:
  map_sizes:
    events: 32768
    processes: 8192
    connections: 16384
  sampling:
    enabled: true
    syscall_rate: 1
    network_rate: 1
    file_rate: 1
  # Волна 0.5 (P0-22 п.1–2): BPF-side фильтрация + самоисключение агента по TGID.
  # Дефолт и так true (config.go), но план (волна 1.5, «Готовность конфига»)
  # требует задать явно — чтобы намерение было видно в startup-логе прогона, а
  # не выводилось из умолчаний при разборе.
  kernel_filter:
    enabled: true
    # Волна 4.3 (P1-18b): LPM-денилист путей в ядре. Задан НЕПУСТЫМ сознательно —
    # при пустом списке фильтр неактивен, и приёмка 4.3 не состоится ни на одном
    # прогоне (пункт 2.Gc плана). Обе строки критерия должны стать измеримыми:
    # «детект по fim_*/canary_*/cred_* не изменился» и «счётчик дропов растёт».
    #
    # Отбор префиксов. Требование плана жёсткое: ни один не должен пересекаться с
    # путями fim_*/canary_*/cred_*. Каждый проверен grep'ом по всему каталогу
    # rules/ — ноль упоминаний, в том числе через более широкий префикс:
    #   - /proc/* НЕ годится целиком: cred_proc_maps_mass_read
    #     (credential-access.yaml) стоит на prefix "/proc/" — денилист любого
    #     /proc-пути ослепил бы credential-детект;
    #   - /var/log/ НЕ годится, хотя это пример из operations.md:
    #     sigma_log_deletion алертит на любое касание /var/log/ (найдено P1-17);
    #   - /sys/devices/ целиком НЕ годится: container_escape_* смотрит на
    #     /sys/devices/virtual/net/ — поэтому сужено до /sys/devices/system/.
    #
    # Что осталось — чистая телеметрия ядра и статические данные, читаемые
    # постоянно и не несущие сигнала атаки:
    path_denylist:
      - "/sys/devices/system/"   # cpu/node topology — опрашивается мониторингом
      - "/sys/block/"            # статистика блочных устройств
      - "/usr/share/zoneinfo/"   # tzdata, перечитывается каждым процессом при старте

rules:
  path: "/opt/ebpf-guard/rules/"
  hot_reload: true

profiler:
  enabled: true
  learning_period: 300
  min_learning_samples: 50
  anomaly_threshold: 0.7
  max_tracked_pids: 2048
  # Сохранять обученный EWMA-baseline на диск, чтобы рестарт агента не сбрасывал
  # learning в ноль (задача P0-3 в ISSUES-attack-run-2026-08-03.md).
  state_persistence:
    enabled: true
    path: /var/lib/ebpf-guard/profiler-state.json
    save_interval_seconds: 300

enforcement:
  enabled: true
  block_backend: log        # Начинаем с log (dry run)
  dry_run: true             # Сначала dry run для тестов
  enable_block: true
  enable_kill: true
  enable_throttle: true
  audit_log: "/var/log/ebpf-guard/audit.jsonl"

alerting:
  enabled: false
  alertmanager:
    url: ""

auth:
  enabled: true
  # No explicit tokens: the agent generates a random admin/viewer pair on
  # first run and persists it to /var/lib/ebpf-guard/token, reusing the same
  # pair across restarts (see main.go readTokenFile/writeTokenFile). This
  # keeps Prometheus scraping stable without hardcoding secrets into git.
  # Set viewer_token/admin_token explicitly here to pin known values instead.
  viewer_token: ""
  admin_token: ""

store:
  backend: sqlite
  # Волна 5.1a. Волна 5.1 понизила кластер из семи правил до info, ожидая
  # падения idle-темпа — он не изменился (4986/час против цели <1000): alerts_total
  # считает алерты независимо от severity, поэтому смена уровня переименовывает
  # объём, но не уменьшает его. Отсечение на входе — то, что превращает эти 4986
  # в измеренные 810/час не-daemon алертов.
  #
  # Правила при этом НЕ удалены и продолжают срабатывать: их объём виден в
  # ebpf_guard_alerts_filtered_total{rule_id,severity}. Приёмка на замере №2.1 —
  # idle-темп по alerts_total < 1000/час при непустом filtered_total.
  min_severity: warning
  sqlite:
    path: "/var/lib/ebpf-guard/test-events.db"

collectors:
  dns:
    enabled: true
  # Выключен сознательно (вопрос 4b, plan.md волна 1.5j): до конца волны 3
  # (шум/специфичность правил), чтобы не добавлять четвёртый источник шума
  # поверх ещё не решённых file/network/syscall проблем. Включить после
  # волны 3.
  tls:
    enabled: false
  # Включаем события записи: без них 35 правил (fim_*, rootkit_*_written и др.)
  # физически не могут сработать — агент помечает их inert при старте.
  file_ops:
    track_open: true
    # Включён на ЗАМЕР №1 (план, волна 1.5 «Готовность конфига»). Самоисключение
    # агента волны 0.5 добавлено в т.ч. в read-хук, а fileaccess.bpf.c:199
    # отмечает read() как самый объёмный источник (SQLite page reads,
    # audit.jsonl, перечитывание правил). При false этот хук не активен и гейт
    # волны 0.5 («file-поток падает с ~5800 до сотен соб./с») непроверяем.
    track_read: true
    track_write: true

watchdog:
  # Пороги — проценты ОДНОГО ядра (100 = одно ядро полностью занято), не доля
  # хоста; на этом 4-ядерном VPS доступно 400%.
  #
  # ДЕФОЛТЫ ВОССТАНОВЛЕНЫ 2026-08-06 (замер №2, пункт 2.Gb плана). История: при
  # 40/70/20 агент намертво сидел на level 1 (file sampling 10%); попытка
  # 150/250/100 дала флаппинг (P1-18a, 813 переходов за ночь); оверрайд 200/320/150
  # флаппинг убрал, но лишь потому, что порог задрали выше наблюдаемого пика — то
  # есть регулятор был отключён, а не починен.
  #
  # Обе причины оверрайда устранены правками, которые нужно проверить именно на
  # дефолтах:
  #   - волна 0.5 (kernel_filter + самоисключение агента по TGID) уронила
  #     file-поток на idle с ~5800 до 226 соб./с — замер №1;
  #   - волна 4.4 (extrapolateNormalPct в internal/watchdog/cpu.go) разорвала
  #     контур обратной связи: recovery смотрит на экстраполированный CPU%, а не
  #     на обрушенный собственным шеддингом.
  #
  # С оверрайдом строка «P1-18a: ноль переходов» проверяет ничто: при 200% порог
  # недостижим по построению. Ноль переходов на 40/70/20 — настоящая проверка.
  # Если флаппинг вернётся — это находка замера №2, а не повод снова задрать порог.
  cpu_pressure:
    enabled: true
    file_shed_threshold: 40.0    # дефолт config.go
    all_shed_threshold: 70.0     # дефолт config.go
    recovery_threshold: 20.0     # дефолт config.go, < file_shed_threshold (валидатор)

notifications:
  unix_socket:
    enabled: true
    path: /run/ebpf-guard/alerts.sock

kubernetes:
  enabled: false
