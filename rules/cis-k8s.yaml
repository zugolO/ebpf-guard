# CIS Kubernetes Benchmark Rules for ebpf-guard
# Based on CIS Kubernetes Benchmark v1.8.0 (5.x controls)

rules:
  # CIS 5.1.1: Ensure that the cluster-admin role is only used where required
  - id: cis_5_1_1_cluster_admin_usage
    name: "CIS 5.1.1: Cluster-admin role usage"
    description: "Detects processes using cluster-admin privileges"
    event_type: syscall
    condition:
      field: comm
      op: regex
      values: ["kubectl", "helm"]
    severity: warning
    action: alert

  # CIS 5.1.3: Minimize access to secrets
  # Wave 6.2.1, №220/№221: k3s bundles the kubelet inside the "k3s-server"
  # binary, which walks every pod's secret/token directory under
  # /var/lib/kubelet/pods/ on every sync (24/window on the 6.2 baseline) —
  # that alone saturated the rule's rate limiter and made a real attacker
  # reading the same prefix from the host invisible (№221). Excluding the
  # node's own kubelet-equivalent by comm, not by narrowing the path, keeps
  # the rule armed for anyone else reading the same prefix — including a
  # compromised host process, which is exactly what 6.2.1.2 exercises.
  - id: cis_5_1_3_secret_access
    name: "CIS 5.1.3: Direct secret access detected"
    description: "Process accessing Kubernetes secrets directly"
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: prefix
          values: ["/var/lib/kubelet/pods/", "/run/secrets/kubernetes.io/"]
    severity: warning
    action: alert
    exceptions:
      # Волна 6.2.1, продакшен-ужесточение (№220/№221). Фон ноды исключается
      # ТОЛЬКО в хостовом контексте: comm процесс назначает себе сам
      # (prctl(PR_SET_NAME), exec -a), а пустые container_id/pod_name приходят
      # из cgroup и означают «задача не в контейнере». Полезная нагрузка в
      # поде, назвавшая себя "k3s-server", под исключение не попадает и правило
      # её поднимает. Если обогащения нет вовсе (нет k8s/рантайма), поля пусты
      # у ВСЕХ событий и исключение работает как прежний список по comm —
      # ослабление возможно только там, где оси нет физически, и это видно
      # нулём приборности 6.2.1.0, а не молча.
      - name: node-host-daemon
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: in
              values: ["k3s-server", "kubelet"]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            # Волна 6.2.1, слой 2 (№220/№221): образ демона. Ось из cgroup выше
            # отвечает только «процесс НЕ в контейнере» и у всех хостовых процессов
            # пуста одинаково — она не отличает демона ноды от чего угодно,
            # запущенного на ней под root с тем же comm. /proc/<pid>/exe ставит ядро
            # в execve: prctl(PR_SET_NAME) и `exec -a` меняют comm и argv[0] и эту
            # ссылку не трогают. Условие СТОИТ ПОСЛЕДНИМ намеренно: группа "and"
            # вычисляется по порядку с коротким замыканием, поэтому readlink
            # случается только там, где имя демона уже совпало.
            #
            # Проверяется КАТАЛОГ образа, а не точный путь, потому что точный путь
            # k3s/containerd зависит от способа установки, а вписать сюда догадку —
            # значит рискнуть тем, что исключение молча перестанет применяться.
            # Ужесточение до точных путей — после того, как контроль 6.2.1.8
            # напечатает фактические exe_path демонов этого стенда. Уже в этой
            # редакции обход требует записи в системный каталог (root + срабатывание
            # evasion_system_binary_replace), а не `cp` в /tmp.
            #
            # Пустой exe_path (процесс умер, нет доступа к /proc) под prefix не
            # подходит — исключение не применяется, правило срабатывает: отказ
            # открытый, в сторону шума, который видно.
            - field: proc.exe_path
              op: prefix
              values: ["/usr/", "/bin/", "/sbin/", "/opt/", "/var/lib/rancher/"]

  # CIS 5.2.1: Minimize the admission of privileged containers
  - id: cis_5_2_1_privileged_container
    name: "CIS 5.2.1: Privileged container detected"
    description: "Container running with privileged security context"
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        # 5.9.3 review (#50): "160" is setrlimit(2), not unshare — and it is
        # not in the kernel allowlist, so this rule was mute by construction
        # (same class as the 241/298 mix-up fixed in config/config.yaml).
        - field: nr
          op: in
          values: ["272"]  # unshare syscall
        # 5.9.3c (#47) стоял здесь как `comm not_in ["runc", ...]` и снят
        # волной 6.2.3 (ОТКРЫТЫЙ ВОПРОС 7). Он ловил только ЛИТЕРАЛЬНОЕ имя,
        # и это был не сузивший, а ОБХОДИМЫЙ фильтр: под, назвавший свой
        # процесс буквально "runc", не поднимал это правило ВООБЩЕ — условие
        # не совпадало, до исключений дело не доходило, и обход не оставлял
        # следа ни в одной метрике. Немой обход хуже видимого шума.
        #
        # Вся идентичность рантайма перенесена в exceptions ниже
        # (container-runtime-lifecycle + container-runtime-lineage). Разница
        # принципиальная, а не стилистическая:
        #   * подавление теперь СЧИТАЕТСЯ поимённо в
        #     ebpf_guard_rule_exceptions_total{exception=...} — величина видна,
        #     а не исчезает (решение 1 волны 6.2.3: сужение не имеет права
        #     работать сокрытием);
        #   * спуфящему поду мало назвать себя "runc": исключение требует
        #     ЛИБО пустой cgroup-привязки (её у процесса внутри пода нет),
        #     ЛИБО родителя из того же списка рантаймов. Ни одно из двух
        #     изнутри пода не выполняется, и правило поднимается — то есть
        #     обход закрыт, а не перенесён.
        # Цена: базовое условие теперь совпадает на каждом вызове этого
        # syscall'а, а не только на не-рантаймовых, и исключения считаются
        # чаще. Синтетика: unshare/pivot_root/setns происходят на старте
        # контейнера, единицы в секунду на ноде, а исключение — два сравнения
        # строк по полям, уже лежащим в событии (никаких readlink/proc).
    severity: critical
    action: alert
    exceptions:
      # Волна 6.2.3, item 6 (№250, решение 5). comm not_in above catches only
      # the LITERAL "runc" and stayed silent on "runc:[1:CHILD]"/
      # "runc:[2:INIT]" — the comm the runtime's own namespace-setup child
      # actually reports (W623_NODE_ACTORS,
      # wave6.2.3-controls.sh). Штатный жизненный цикл контейнера уже сегодня
      # поднимал этот алерт, и инцидентный слой засчитывал его подтверждённой
      # атакой (finding №250, разбор пяти ложных incident_confirmed_attack на
      # обоих архивах 6.2.2). Перенесено сюда: объём виден в
      # ebpf_guard_rule_exceptions_total, а не тонет немым исключением внутри
      # условия; ключ — cgroup-идентичность (container.id/k8s.pod), без
      # exe_path-слоя (см. комментарий внутри блока: короткоживущие процессы).
      - name: container-runtime-lifecycle
        condition_group:
          operator: and
          conditions:
            - field: comm
              op: in
              values: ["runc", "runc:[0:PARENT]", "runc:[1:CHILD]",
                       "runc:[2:INIT]", "containerd-shim",
                       "containerd-shim-runc-v2", "containerd",
                       "dockerd", "conmon", "crun"]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            # Слой 2 (exe_path) НЕ добавлен здесь, в отличие от node-host-daemon
            # (command-and-control.yaml) — живая проверка на ebaka2 06.09.2026
            # показала, что "runc:[1:CHILD]"/"runc:[2:INIT]" — процессы,
            # которые уже успевают завершиться к моменту асинхронного
            # вычисления исключения: resolveExePath делает live readlink
            # "/proc/<pid>/exe", которого к этому моменту уже нет, получает ""
            # и по документированному fail-open (rules.go) НЕ применяет
            # исключение — то есть слой 2 в этом виде не подавлял НИ ОДНОГО
            # реального runc:[1:CHILD]/[2:INIT] на живом узле (0 из 5 таких
            # алертов ушли в exceptions, все — в alerts_total). Долгоживущие
            # демоны вроде k3s-server/coredns это условие переживают, их
            # короткоживущий namespace-setup child — нет. Защита от хостового
            # спуфа здесь остаётся только на comm+cgroup — тот же класс
            # обхода, что уже открыт для литерального comm-списка в главном
            # condition_group (открытый вопрос 7, plan.md) — а не новый,
            # добавленный этой веткой.
      # Волна 6.2.3, ОТКРЫТЫЙ ВОПРОС 2 (№250, живая проверка item 6 на ebaka2
      # 06.09.2026). container-runtime-lifecycle выше ключуется на ПУСТЫХ
      # container.id/k8s.pod — и эта ось живьём оказалась нестабильной ровно
      # в том окне, ради которого её брали: у runc:[1:CHILD]/[2:INIT]
      # cgroup-привязка пуста на РАННИХ syscall'ах установки контейнера
      # (unshare) и уже ЗАПОЛНЕНА целевым container_id к моменту поздних
      # (pivot_root — по построению ПОСЛЕДНИЙ шаг переключения rootfs, часть
      # setns — уже после привязки к cgroup). Живой под дал
      # container_escape_pivot_root 2 алерта / 0 подавлений (0%,
      # систематически) и privesc_setns_syscall 5 / 12 (частично). Процесс,
      # который САМ ПРЯМО СЕЙЧАС строит cgroup-принадлежность контейнера,
      # не опознаётся по её отсутствию — она у него меняется по ходу.
      #
      # Ось этого исключения — РОДИТЕЛЬ, а не cgroup. parent_comm читается в
      # ядре из task_struct->real_parent на каждом событии
      # (bpf/common.h, fill_common_fields): поле УЖЕ в событии, стоит ноль
      # дополнительных syscall'ов при вычислении исключения и не зависит от
      # того, жив ли ещё процесс к моменту асинхронной корреляции. Это и был
      # дефект отвергнутого слоя proc.exe_path — resolveExePath делает live
      # readlink("/proc/<pid>/exe"), на короткоживущем child'е получает
      # ENOENT и по fail-open не применяет исключение (0 из 5 живых случаев).
      # Namespace-setup child рантайма всегда форкнут своим же рантаймом:
      # runc:[2:INIT] ← runc:[1:CHILD] ← runc:[0:PARENT] ← containerd-shim.
      #
      # ОТДЕЛЬНЫМ ИМЕНЕМ, а не расширением container-runtime-lifecycle:
      # ebpf_guard_rule_exceptions_total разделяет их по label exception, и
      # прогон видит числом, сколько сняла каждая ось — ранняя фаза (cgroup)
      # против поздней (родитель). Порядок тоже часть контракта: lifecycle
      # стоит ПЕРВЫМ, поэтому счётчик lineage показывает ровно тот остаток,
      # который cgroup-ось не взяла, — величину, которой эта правка и
      # доказывается. Слияние в одно имя спрятало бы её.
      - name: container-runtime-lineage
        condition_group:
          operator: and
          conditions:
            - field: comm
              op: in
              values: ["runc", "runc:[0:PARENT]", "runc:[1:CHILD]",
                       "runc:[2:INIT]", "containerd-shim",
                       "containerd-shim-runc-v2", "containerd",
                       "dockerd", "conmon", "crun"]
            - field: parent_comm
              op: in
              values: ["runc", "runc:[0:PARENT]", "runc:[1:CHILD]",
                       "runc:[2:INIT]", "containerd-shim",
                       "containerd-shim-runc-v2", "containerd",
                       "dockerd", "conmon", "crun"]
      # 5.9.9.F.3c (№133): see systemd-sandbox-child on
      # container_escape_unshare_user (container-escape.yaml) — same
      # structural predicate, applied here.
      - name: systemd-sandbox-child
        condition_group:
          operator: and
          conditions:
            - field: ppid
              op: eq
              values: ["1"]
            - field: comm
              op: regex
              values: ["^\\(.*\\)$"]
      # 5.9.9.F.3c, ревизия по предпрогону №2.9.9.F.3 (2026-08-26): the child
      # shape above covers only half of a unit start. pid 1 ITSELF calls
      # mount()/umount2() while assembling and tearing down that unit's
      # sandbox, and `systemctl start man-db.service` on the stand raised
      # exactly one alert — container_escape_cap_sys_admin pid=1 comm=systemd —
      # which is precisely the Δ=0 the wave's own negative control requires.
      # The predicate is pid, not comm: pid 1 is host init by construction and
      # cannot be spoofed, whereas a comm list would break on the next init
      # (the №111 defect this point exists to avoid). An escape performed BY
      # host init is not an escape: that process already owns the host.
      - name: systemd-init-self
        condition:
          field: pid
          op: eq
          values: ["1"]

  # CIS 5.2.5: Minimize the admission of containers with allowPrivilegeEscalation
  - id: cis_5_2_5_privilege_escalation
    name: "CIS 5.2.5: Privilege escalation detected"
    description: "Process attempting privilege escalation"
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        # 5.9.3 review (#50): "82" is rename(2), not setuid — and rename is
        # in the kernel allowlist, so this rule alerted on every rename by
        # any process outside the privsep list below. setuid=105, setgid=106.
        - field: nr
          op: in
          values: ["105", "106"]  # setuid, setgid
        # 5.9.3b (#47): privsep daemons call setuid/setgid as part of normal
        # operation (dropping root after bind) — exclude them by comm rather
        # than by nr, same reasoning as sigma_setuid_syscall.
        - field: comm
          op: not_in
          values: ["sshd", "su", "sudo", "cron", "crond", "apache2", "nginx",
                    "php-fpm", "postgres", "mysqld", "dovecot", "vsftpd"]
    severity: critical
    action: alert
