# Container Escape Detection Rules for ebpf-guard
# Detects attempts to break out of container isolation

rules:
  # ============================================================================
  # Privilege Escalation via Mount
  # ============================================================================

  # Mount syscall from container (potential container escape)
  - id: container_escape_mount
    name: "Container Escape: Mount syscall from container"
    description: "Container process executed mount syscall (attempting to access host filesystem)"
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["165"]  # mount syscall
        # 5.9.3c (#47): container runtimes call mount() to set up the very
        # namespace this rule watches for escapes out of — exclude the
        # shim/runtime processes, not the syscall.
        - field: comm
          op: not_in
          values: ["runc", "containerd-shim", "containerd-shim-runc-v2",
                    "dockerd", "conmon", "crun"]
    severity: critical
    action: alert
    tags: [container-escape, privilege-escalation, mount, cis]
    exceptions:
      # 5.9.9.F.3c (№133): systemd sandboxing (PrivateTmp/PrivateDevices/
      # ProtectSystem) makes every unit's forked child mount() its own
      # namespace at startup — not a literal comm list (the next unit gives
      # the next name, same defect as №111), but the structural shape of a
      # systemd-spawned sandbox child: direct child of pid 1, whose comm the
      # kernel reports in the "(name)" parenthesized form (truncated/re-exec
      # display, e.g. "(mandb)").
      - name: systemd-sandbox-child
        condition_group:
          operator: and
          conditions:
            - field: ppid
              op: eq
              values: ["1"]
            - field: comm
              op: regex
              values: ["^\\(.*\\)$"]
      # 5.9.9.F.3c, ревизия по предпрогону №2.9.9.F.3 (2026-08-26): the child
      # shape above covers only half of a unit start. pid 1 ITSELF calls
      # mount()/umount2() while assembling and tearing down that unit's
      # sandbox, and `systemctl start man-db.service` on the stand raised
      # exactly one alert — container_escape_cap_sys_admin pid=1 comm=systemd —
      # which is precisely the Δ=0 the wave's own negative control requires.
      # The predicate is pid, not comm: pid 1 is host init by construction and
      # cannot be spoofed, whereas a comm list would break on the next init
      # (the №111 defect this point exists to avoid). An escape performed BY
      # host init is not an escape: that process already owns the host.
      - name: systemd-init-self
        condition:
          field: pid
          op: eq
          values: ["1"]

  # Mount of sensitive host paths
  - id: container_escape_host_mount
    name: "Container Escape: Mount of host filesystem path"
    description: "Container attempting to mount host root or sensitive directories"
    event_type: file
    condition:
      field: filename
      op: prefix
      values:
        - "/host/"
        - "/hostroot/"
        - "/proc/1/root/"
        - "/var/lib/docker/"
        - "/var/lib/containerd/"
        - "/var/lib/kubelet/"
        - "/run/containerd/"
    severity: critical
    action: alert
    tags: [container-escape, host-mount, docker-socket]

  # ============================================================================
  # Namespace Breakout
  # ============================================================================

  # nsenter syscall (enter another namespace)
  - id: container_escape_nsenter
    name: "Container Escape: Namespace enter attempt"
    description: "Process used nsenter to enter another namespace"
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["308"]  # setns syscall (nsenter uses this)
        # 5.9.3c (#47): container runtime shims call setns() to attach into
        # a namespace during normal `kubectl exec`/`docker exec` — exclude
        # them, not the syscall. nsenter(1) itself is NOT excluded: it is
        # the tool the escape technique this rule names is built on.
        - field: comm
          op: not_in
          values: ["runc", "containerd-shim", "containerd-shim-runc-v2",
                    "dockerd", "conmon", "crun"]
    severity: critical
    action: alert
    tags: [container-escape, namespace-breakout, nsenter]

  # unshare with CLONE_NEWUSER (attempting to create new user namespace)
  - id: container_escape_unshare_user
    name: "Container Escape: User namespace creation"
    description: "Process created new user namespace (potential privilege escalation)"
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["272"]  # unshare syscall
        # 5.9.3c (#47): container runtimes call unshare() to build the
        # container's namespaces at startup — exclude the runtime, not the
        # syscall.
        - field: comm
          op: not_in
          values: ["runc", "containerd-shim", "containerd-shim-runc-v2",
                    "dockerd", "conmon", "crun"]
    severity: warning
    action: alert
    tags: [container-escape, unshare, user-namespace]
    exceptions:
      # 5.9.9.F.3c (№133): see systemd-sandbox-child on container_escape_mount
      # above — same structural predicate, applied here.
      - name: systemd-sandbox-child
        condition_group:
          operator: and
          conditions:
            - field: ppid
              op: eq
              values: ["1"]
            - field: comm
              op: regex
              values: ["^\\(.*\\)$"]
      # 5.9.9.F.3c, ревизия по предпрогону №2.9.9.F.3 (2026-08-26): the child
      # shape above covers only half of a unit start. pid 1 ITSELF calls
      # mount()/umount2() while assembling and tearing down that unit's
      # sandbox, and `systemctl start man-db.service` on the stand raised
      # exactly one alert — container_escape_cap_sys_admin pid=1 comm=systemd —
      # which is precisely the Δ=0 the wave's own negative control requires.
      # The predicate is pid, not comm: pid 1 is host init by construction and
      # cannot be spoofed, whereas a comm list would break on the next init
      # (the №111 defect this point exists to avoid). An escape performed BY
      # host init is not an escape: that process already owns the host.
      - name: systemd-init-self
        condition:
          field: pid
          op: eq
          values: ["1"]

  # ============================================================================
  # Kernel Exploitation
  # ============================================================================

  # Write to /proc/sysrq-trigger (system request key)
  - id: container_escape_sysrq_trigger
    name: "Container Escape: SysRq trigger write"
    description: "Process wrote to /proc/sysrq-trigger (kernel debugging interface)"
    event_type: file
    condition:
      field: filename
      op: equals
      values: ["/proc/sysrq-trigger"]
    severity: critical
    action: alert
    tags: [container-escape, kernel-exploit, sysrq, privilege-escalation]

  # Access to kernel memory devices
  - id: container_escape_kmem_access
    name: "Container Escape: Kernel memory device access"
    description: "Process accessed /dev/mem or /dev/kmem (direct kernel memory access)"
    event_type: file
    condition:
      field: filename
      op: in
      values:
        - "/dev/mem"
        - "/dev/kmem"
        - "/dev/port"
        - "/dev/kmsg"
    severity: critical
    action: alert
    tags: [container-escape, kernel-memory, device-access]

  # Access to kernel modules
  - id: container_escape_module_access
    name: "Container Escape: Kernel module access"
    description: "Process accessing kernel module interface"
    event_type: file
    condition:
      field: filename
      op: prefix
      values:
        - "/sys/module/"
        - "/lib/modules/"
        - "/proc/kallsyms"
        - "/proc/modules"
    severity: warning
    action: alert
    tags: [container-escape, kernel-module, rootkit]

  # ============================================================================
  # Capabilities Abuse
  # ============================================================================

  # CAP_SYS_ADMIN operations (full system administration)
  - id: container_escape_cap_sys_admin
    name: "Container Escape: CAP_SYS_ADMIN operation"
    description: "Process performed operation requiring CAP_SYS_ADMIN"
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values:
            - "165"   # mount
            - "166"   # umount2
            - "272"   # unshare
            - "308"   # setns
            - "155"   # pivot_root (5.9.3 review, #50: "159" is adjtimex)
        # 5.9.3c (#47): every one of these syscalls is also how a container
        # runtime builds a container's namespaces at startup — exclude the
        # runtime, not the syscalls.
        - field: comm
          op: not_in
          values: ["runc", "containerd-shim", "containerd-shim-runc-v2",
                    "dockerd", "conmon", "crun"]
    severity: critical
    action: alert
    tags: [container-escape, capabilities, cap-sys-admin]
    exceptions:
      # 5.9.9.F.3c (№133): see systemd-sandbox-child on container_escape_mount
      # above — same structural predicate, applied here.
      - name: systemd-sandbox-child
        condition_group:
          operator: and
          conditions:
            - field: ppid
              op: eq
              values: ["1"]
            - field: comm
              op: regex
              values: ["^\\(.*\\)$"]
      # 5.9.9.F.3c, ревизия по предпрогону №2.9.9.F.3 (2026-08-26): the child
      # shape above covers only half of a unit start. pid 1 ITSELF calls
      # mount()/umount2() while assembling and tearing down that unit's
      # sandbox, and `systemctl start man-db.service` on the stand raised
      # exactly one alert — container_escape_cap_sys_admin pid=1 comm=systemd —
      # which is precisely the Δ=0 the wave's own negative control requires.
      # The predicate is pid, not comm: pid 1 is host init by construction and
      # cannot be spoofed, whereas a comm list would break on the next init
      # (the №111 defect this point exists to avoid). An escape performed BY
      # host init is not an escape: that process already owns the host.
      - name: systemd-init-self
        condition:
          field: pid
          op: eq
          values: ["1"]

  # pivot_root syscall (change root directory)
  - id: container_escape_pivot_root
    name: "Container Escape: pivot_root syscall"
    description: "Process changed root filesystem (pivot_root)"
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["155"]  # pivot_root syscall
        # 5.9.3c (#47): container runtimes call pivot_root() to switch into
        # the container rootfs at startup — exclude the runtime, not the
        # syscall.
        - field: comm
          op: not_in
          values: ["runc", "containerd-shim", "containerd-shim-runc-v2",
                    "dockerd", "conmon", "crun"]
    severity: critical
    action: alert
    tags: [container-escape, pivot-root, chroot]

  # chroot syscall (potential chroot escape)
  - id: container_escape_chroot
    name: "Container Escape: chroot syscall"
    description: "Process executed chroot (may indicate escape attempt)"
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["161"]  # chroot syscall
        # 5.9.3b (#47): sshd re-execs itself into a chroot for privilege
        # separation (ChrootDirectory / UsePrivilegeSeparation) on every
        # session — exclude it by comm, not by removing the syscall check.
        - field: comm
          op: not_in
          values: ["sshd"]
    severity: warning
    action: alert
    tags: [container-escape, chroot, filesystem]
    exceptions:
      # 5.9.9.F.3c (№133): see systemd-sandbox-child on container_escape_mount
      # above — same structural predicate, applied here.
      - name: systemd-sandbox-child
        condition_group:
          operator: and
          conditions:
            - field: ppid
              op: eq
              values: ["1"]
            - field: comm
              op: regex
              values: ["^\\(.*\\)$"]
      # 5.9.9.F.3c, ревизия по предпрогону №2.9.9.F.3 (2026-08-26): the child
      # shape above covers only half of a unit start. pid 1 ITSELF calls
      # mount()/umount2() while assembling and tearing down that unit's
      # sandbox, and `systemctl start man-db.service` on the stand raised
      # exactly one alert — container_escape_cap_sys_admin pid=1 comm=systemd —
      # which is precisely the Δ=0 the wave's own negative control requires.
      # The predicate is pid, not comm: pid 1 is host init by construction and
      # cannot be spoofed, whereas a comm list would break on the next init
      # (the №111 defect this point exists to avoid). An escape performed BY
      # host init is not an escape: that process already owns the host.
      - name: systemd-init-self
        condition:
          field: pid
          op: eq
          values: ["1"]

  # ============================================================================
  # cgroup Escape
  # ============================================================================

  # cgroup v1 release_agent escape
  - id: container_escape_cgroup_v1_release_agent
    name: "Container Escape: cgroup v1 release_agent modification"
    description: "Process modified cgroup release_agent (known escape vector)"
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/sys/fs/cgroup/.*release_agent"
        - "/sys/fs/cgroup/memory/release_agent"
        - "/sys/fs/cgroup/rdma/release_agent"
    severity: critical
    action: alert
    tags: [container-escape, cgroup, release-agent, cve]

  # cgroup v2 escape attempt
  - id: container_escape_cgroup_v2
    name: "Container Escape: cgroup v2 manipulation"
    description: "Process manipulating cgroup v2 filesystem"
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/sys/fs/cgroup/\\.\\./"
        - "/sys/fs/cgroup/unified/"
    severity: warning
    action: alert
    tags: [container-escape, cgroup, cgroup-v2]

  # ============================================================================
  # Docker/Podman Socket Abuse
  # ============================================================================

  # Access to Docker socket
  - id: container_escape_docker_socket
    name: "Container Escape: Docker socket access"
    description: "Process accessing Docker daemon socket (container breakout)"
    event_type: file
    condition:
      field: filename
      op: in
      values:
        - "/var/run/docker.sock"
        - "/run/docker.sock"
        - "/var/run/docker.socket"
    severity: critical
    action: alert
    tags: [container-escape, docker-socket, container-breakout]

  # Access to containerd socket
  - id: container_escape_containerd_socket
    name: "Container Escape: containerd socket access"
    description: "Process accessing containerd socket (container breakout)"
    event_type: file
    condition:
      field: filename
      op: in
      values:
        - "/run/containerd/containerd.sock"
        - "/run/containerd/snapshotter/"
        - "/var/run/containerd/containerd.sock"
    severity: critical
    action: alert
    tags: [container-escape, containerd-socket, container-breakout]

  # Access to CRI-O socket
  - id: container_escape_crio_socket
    name: "Container Escape: CRI-O socket access"
    description: "Process accessing CRI-O socket (container breakout)"
    event_type: file
    condition:
      field: filename
      op: in
      values:
        - "/var/run/crio/crio.sock"
        - "/run/crio/crio.sock"
    severity: critical
    action: alert
    tags: [container-escape, crio-socket, container-breakout]

  # ============================================================================
  # Host Network Abuse
  # ============================================================================

  # Access to host network namespace
  - id: container_escape_host_network
    name: "Container Escape: Host network interface access"
    description: "Container process accessing host network configuration"
    event_type: file
    condition:
      field: filename
      op: prefix
      values:
        - "/sys/class/net/"
        - "/proc/net/"
        - "/sys/devices/virtual/net/"
    severity: warning
    action: alert
    tags: [container-escape, host-network, network-namespace]

  # ============================================================================
  # Core Pattern / Crash Exploitation
  # ============================================================================

  # Core pattern modification (privilege escalation via core dump)
  - id: container_escape_core_pattern
    name: "Container Escape: Core pattern modification"
    description: "Process modifying kernel core dump pattern (privilege escalation vector)"
    event_type: file
    condition:
      field: filename
      op: equals
      values: ["/proc/sys/kernel/core_pattern"]
    severity: critical
    action: alert
    tags: [container-escape, core-pattern, privilege-escalation, cve]

  # ============================================================================
  # Device Abuse
  # ============================================================================

  # Access to host devices
  - id: container_escape_host_device
    name: "Container Escape: Host device access"
    description: >
      Container accessing raw host block devices. Wave 6.0f, №200: scoped to
      the container case only (container.id or pod_name non-empty) —
      dumpe2fs/parted/etc. run directly on the host against the same
      device paths for routine maintenance and is not itself an escape
      signal (see 6.0.13). The host case is a separate rule below,
      container_escape_host_device_from_host, at warning severity.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: regex
          values:
            - "/dev/sd[a-z][0-9]*"
            - "/dev/hd[a-z][0-9]*"
            - "/dev/nvme[0-9]n[0-9]*"
            - "/dev/vd[a-z][0-9]*"
            - "/dev/xvd[a-z][0-9]*"
            - "/dev/mapper/"
            - "/dev/dm-[0-9]+"
      subgroups:
        - operator: or
          conditions:
            - field: container.id
              op: neq
              values: [""]
            - field: k8s.pod
              op: neq
              values: [""]
    severity: critical
    action: alert
    tags: [container-escape, host-device, block-device]

  # Host case of the rule above (wave 6.0f, №200): same device-path match,
  # but no container/pod enrichment on the event at all — i.e. the process
  # runs directly on the node, outside any container. Split out rather than
  # widened in place because a host process reading a host device is
  # ordinary host administration far more often than it is an escape (a
  # real container escape onto the host is exactly what the container-case
  # rule above is for), so it stays a lower-severity, separately-tracked
  # signal instead of silently sharing the container rule's critical
  # severity and id (renaming the id would break replay-gate.sh — finding
  # №170).
  - id: container_escape_host_device_from_host
    name: "Host process accessed raw block device"
    description: >
      A process with no container/pod enrichment accessed a raw host block
      device (/dev/sd*, /dev/nvme*, /dev/vd*, /dev/xvd*, /dev/mapper,
      /dev/dm-*). Routine host maintenance (dumpe2fs, parted, lsblk, backup
      tooling) produces this constantly — see 6.0.13 for the negative
      control. Kept as a warning-level, separately-tracked signal rather
      than folded into container_escape_host_device (critical) above.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: regex
          values:
            - "/dev/sd[a-z][0-9]*"
            - "/dev/hd[a-z][0-9]*"
            - "/dev/nvme[0-9]n[0-9]*"
            - "/dev/vd[a-z][0-9]*"
            - "/dev/xvd[a-z][0-9]*"
            - "/dev/mapper/"
            - "/dev/dm-[0-9]+"
        - field: container.id
          op: eq
          values: [""]
        - field: k8s.pod
          op: eq
          values: [""]
    severity: warning
    action: alert
    tags: [container-escape, host-device, block-device, host]

  # ============================================================================
  # procfs and sysfs Abuse
  # ============================================================================

  # Writing to /proc (kernel parameters)
  - id: container_escape_proc_write
    name: "Container Escape: /proc write attempt"
    description: "Process writing to /proc filesystem (kernel parameter modification)"
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: op
          op: eq
          values: ["write"]
        - field: filename
          op: regex
          values:
            - "/proc/sys/.*"
            - "/proc/irq/.*"
            - "/proc/bus/.*"
    severity: warning
    action: alert
    class: drift
    # Wave 6.0d, finding №193(б): see drift_dangerous_syscall in
    # rules/drift-rules.yaml for the rationale.
    drift_novel_workload: alert
    tags: [container-escape, procfs, kernel-parameters]
    exceptions:
      - name: systemd-sysctl
        condition:
          field: proc.comm
          op: in
          values: [systemd, systemd-sysctl]
      # Scoped to comm AND path: irqbalance legitimately writes IRQ affinity
      # masks only. A write to /proc/sys/* (kernel parameters) or /proc/bus/*
      # from a process named "irqbalance" is still a container-escape signal.
      - name: irqbalance
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [irqbalance]
            - field: filename
              op: prefix
              values: ["/proc/irq/"]

  # Access to host's /proc/1
  # plan.md wave 5.1: this cluster is container init daemons legitimately
  # living at PID 1 of their own namespace (prometheus, grafana), not the
  # /etc/passwd cluster — the correct axis is container_id/cgroup, but
  # that needs k8s metadata (wave 6.1, not done yet). Interim: comm
  # not_in, matching how P1-6/5.1 handle every other daemon-noise cluster.
  # The narrower ebpf-guard-self exception below still catches a
  # compromised binary literally named "ebpf-guard".
  #
  # 5.6c (замер №2.2, idle-регресс, 86/ч): cron reads /proc/1/* as part of
  # routine job accounting (same PAM/session bookkeeping that already earns
  # cron the sensitive_file_read_daemon split below) — added to not_in here
  # and split off into container_escape_init_proc_daemon.
  # 5.7a (замер №2.3, находка №13): pgrep's per-PID scan hits /proc/1/* too
  # (204/h, top offender of the four-rule pgrep cluster) — same treatment.
  - id: container_escape_init_proc
    name: "Container Escape: Init process access"
    description: "Container accessing init process (PID 1) information"
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: prefix
          values:
            - "/proc/1/"
            - "/proc/self/root/proc/1/"
        - field: proc.comm
          op: not_in
          values: ["prometheus", "grafana", "cron", "pgrep"]
    severity: warning
    action: alert
    class: drift
    # Wave 6.0d, finding №193(б): see drift_dangerous_syscall in
    # rules/drift-rules.yaml for the rationale.
    drift_novel_workload: alert
    tags: [container-escape, init-process, pid-1, proc-recon-cluster]
    exceptions:
      # Scoped to comm AND path: the agent's own benign reads are
      # cgroup/stat/status metadata. /proc/1/environ, /proc/1/mem and the
      # /proc/self/root/ escape path still alert even for "ebpf-guard".
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: filename
              op: in
              values: ["/proc/1/cgroup", "/proc/1/stat", "/proc/1/status"]
      # 5.9.9.F.3c (№133), same defect and fix as №107 (cred_proc_maps_mass_read
      # excluding /proc/self/*): pid 1 reading its own /proc/1/cgroup is
      # self-introspection, not host-escape reconnaissance — structural
      # predicate is pid == 1, not a comm whitelist that the next daemon
      # would miss.
      - name: pid1-self
        condition_group:
          operator: and
          conditions:
            - field: pid
              op: eq
              values: ["1"]
            - field: filename
              op: eq
              values: ["/proc/1/cgroup"]

  # prometheus/grafana routinely read /proc/1/* metadata as PID 1 of their
  # own container namespace — legitimate self-introspection, not escape.
  # info, not warning: same reasoning as sigma_utmp_wtmp_modified_daemon,
  # this cluster is high-volume (435/71min in замер №2) so warning alone
  # wouldn't cut noise. Ax is comm, not container_id/cgroup, until wave 6.1
  # provides k8s metadata — recorded here per plan.md wave 5.1.
  - id: container_escape_init_proc_daemon
    name: "Init process access by container-native daemon"
    description: "prometheus, grafana, cron, or pgrep accessed /proc/1/* as PID 1 of their own container namespace, during routine job accounting, or as part of a per-PID process scan — usually self-introspection, but content is not inspected and the comm axis is a temporary substitute for container_id."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: prefix
          values:
            - "/proc/1/"
            - "/proc/self/root/proc/1/"
        - field: proc.comm
          op: in
          values: ["prometheus", "grafana", "cron", "pgrep"]
    severity: info
    action: alert
    class: drift
    tags: [container-escape, init-process, pid-1, needs-content-analysis]

  # ============================================================================
  # Cgroup Namespace Escape (Sprint 33.0)
  # ============================================================================

  # Process migrated to a cgroup outside its initial container cgroup hierarchy.
  # This is the classic cgroup escape technique: move the process into the root
  # cgroup before executing a command via cgroup v1 release_agent.
  - id: container_escape_cgroup_migrate
    name: "Container Escape: Process migrated to different cgroup"
    description: "A process moved to a cgroup outside its initial container cgroup hierarchy. This is a key indicator of cgroup-based container escape (CVE-2022-0492 class)."
    event_type: cgroup_esc
    condition:
      field: new_cgroup_id
      op: not_equals
      values: ["0"]  # any migration where new_cgroup_id != 0 was already filtered BPF-side
    severity: critical
    action: alert
    tags: [container-escape, cgroup, cgroup-escape, cve, mitre-t1611]

  # Process that was in a non-root cgroup migrated to cgroup ID 1 (root cgroup).
  # Moving to the root cgroup is almost always the precursor to a release_agent
  # escape and should be treated as critical with immediate blocking.
  - id: container_escape_cgroup_to_root
    name: "Container Escape: Process migrated to root cgroup"
    description: "A process was moved into cgroup ID 1 (root cgroup). This is the exact precursor step for the cgroup v1 release_agent escape technique."
    event_type: cgroup_esc
    condition:
      field: new_cgroup_id
      op: equals
      values: ["1"]
    severity: critical
    action: block
    tags: [container-escape, cgroup, cgroup-escape, cve, mitre-t1611]
