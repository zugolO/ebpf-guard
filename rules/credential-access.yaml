rules:
  # MITRE ATT&CK: T1552.001 — Credentials In Files: Cloud Credentials
  - id: cred_aws_credentials_read
    name: "AWS credentials file accessed"
    description: >
      An AWS credentials or config file was read by a process that is not the
      AWS CLI or a known cloud SDK. Attackers read these files to steal IAM
      access keys for lateral movement to the cloud control plane.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: suffix
          values:
            - "/.aws/credentials"
            - "/.aws/config"
        - field: file.op
          op: in
          values: ["read", "open"]
        - field: proc.comm
          op: not_in
          values: ["aws", "terraform", "packer", "ansible", "vault",
                   "python3", "python", "node", "java"]
    severity: warning
    action: alert
    tags: [mitre:T1552.001, credential-access, cloud]

  # MITRE ATT&CK: T1552.001
  - id: cred_gcp_service_account_read
    name: "GCP service account key file accessed"
    description: >
      A GCP service account JSON key file was accessed. These files grant
      full API access as the service account and are high-value targets.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: prefix
          values:
            - "/etc/gcp/"
            - "/etc/google/"
            - "/run/secrets/google"
        - field: file.path
          op: suffix
          values: [".json"]
        - field: file.op
          op: in
          values: ["read", "open"]
        - field: proc.comm
          op: not_in
          values: ["gcloud", "python3", "python", "node", "java", "terraform"]
    severity: warning
    action: alert
    tags: [mitre:T1552.001, credential-access, cloud, gcp]

  # MITRE ATT&CK: T1552.004 — Private Keys
  - id: cred_ssh_private_key_read
    name: "SSH private key file read by unexpected process"
    description: >
      An SSH private key file was read by a process other than ssh, scp, or
      an SSH agent. Attackers steal private keys for lateral movement.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: suffix
          values:
            - "/id_rsa"
            - "/id_ed25519"
            - "/id_ecdsa"
            - "/id_dsa"
            - "/identity"
        - field: file.op
          op: in
          values: ["read", "open"]
        - field: proc.comm
          op: not_in
          values: ["ssh", "scp", "sftp", "ssh-agent", "ssh-add", "git",
                   "ansible", "rsync", "terraform"]
    severity: warning
    action: alert
    tags: [mitre:T1552.004, credential-access, lateral-movement]

  # MITRE ATT&CK: T1003.008 — OS Credential Dumping: /etc/passwd and /etc/shadow
  - id: cred_shadow_read
    name: "/etc/shadow read by unexpected process"
    description: >
      /etc/shadow was read by a process that is not a standard PAM/auth binary.
      Shadow contains hashed passwords; reading it enables offline cracking.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: equals
          values: ["/etc/shadow", "/etc/shadow-"]
        - field: file.op
          op: in
          values: ["read", "open"]
        - field: proc.comm
          op: not_in
          values: ["passwd", "chpasswd", "chage", "login", "su", "sudo",
                   "sshd", "pam_unix", "shadow", "useradd", "usermod", "cron"]
    severity: critical
    action: alert
    tags: [mitre:T1003.008, credential-access]
    exceptions:
      # 5.9.9.F.4a (№141): systemd-sandbox-child, extended from the original
      # six 5.9.9.F.3c rules to the actual class raised by this actor.
      - name: systemd-sandbox-child
        condition_group:
          operator: and
          conditions:
            - field: proc.ppid
              op: eq
              values: ["1"]
            - field: proc.comm
              op: regex
              values: ["^\\(.*\\)$"]

  # MITRE ATT&CK: T1552.003 — Bash History
  - id: cred_bash_history_read
    name: "Shell history file read by unexpected process"
    description: >
      A shell history file was read by something other than a shell. History
      files often contain plaintext passwords entered on the command line.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: suffix
          values:
            - "/.bash_history"
            - "/.zsh_history"
            - "/.sh_history"
            - "/.history"
            - "/.python_history"
            - "/.mysql_history"
            - "/.psql_history"
        - field: file.op
          op: in
          values: ["read", "open"]
        - field: proc.comm
          op: not_in
          values: ["bash", "zsh", "sh", "fish", "history", "cat", "less",
                   "more", "grep", "vim", "nano"]
    severity: warning
    action: alert
    tags: [mitre:T1552.003, credential-access]

  # MITRE ATT&CK: T1552.001
  - id: cred_docker_auth_read
    name: "Docker registry auth config read"
    description: >
      The Docker auth configuration file was read, exposing registry credentials
      (base64-encoded username:password for container registries).
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: suffix
          values:
            - "/.docker/config.json"
            - "/.dockerconfigjson"
        - field: file.op
          op: in
          values: ["read", "open"]
        - field: proc.comm
          op: not_in
          values: ["docker", "podman", "containerd", "buildkit", "skopeo",
                   "crane", "ko", "ansible", "terraform"]
    severity: warning
    action: alert
    tags: [mitre:T1552.001, credential-access, supply-chain]

  # MITRE ATT&CK: T1555 — Credentials from Password Stores
  - id: cred_browser_store_read
    name: "Browser credential store accessed"
    description: >
      A browser's credential database (Chrome Login Data, Firefox logins.json,
      etc.) was accessed by a non-browser process. Credential-stealer malware
      reads these files to extract saved passwords.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: suffix
          values:
            - "/Login Data"
            - "/Login Data-journal"
            - "/logins.json"
            - "/key4.db"
            - "/signons.sqlite"
            - "/Cookies"
            - "/Web Data"
        - field: file.op
          op: in
          values: ["read", "open"]
        - field: proc.comm
          op: not_in
          values: ["chrome", "chromium", "firefox", "brave", "opera",
                   "google-chrome", "vivaldi", "microsoft-edge"]
    severity: warning
    action: alert
    tags: [mitre:T1555, credential-access]

  # MITRE ATT&CK: T1552.001
  - id: cred_vault_token_read
    name: "Vault / secret manager token file read"
    description: >
      A HashiCorp Vault token file or similar secret manager credential was
      accessed by an unexpected process.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: suffix
          values:
            - "/.vault-token"
            - "/.vault/token"
            - "/vault-token"
        - field: file.op
          op: in
          values: ["read", "open"]
        - field: proc.comm
          op: not_in
          values: ["vault", "consul", "nomad", "terraform", "ansible",
                   "python3", "python", "node", "java"]
    severity: critical
    action: alert
    tags: [mitre:T1552.001, credential-access, cloud]

  # MITRE ATT&CK: T1003.007 — Proc Filesystem credential dump
  #
  # 5.9.9.Fa (находка №107, замеры №2.9.7–2.9.9): prefix "/proc/" + suffix
  # "/maps|/mem|/environ" matches /proc/self/maps — 44 критикала за прогон,
  # ноль истинных. /proc/self/ никогда не чужая память, а правило про
  # credential scraping из чужого процесса. Заменено numeric-PID предикатом,
  # тем же приёмом, которым уже написаны proc_inject_maps_recon,
  # proc_inject_proc_mem_write и sigma_memory_proc_dump (0 алертов на том же
  # прогоне). Ветка task/[0-9]+/ — не запас на будущее: /proc/<pid>/task/<tid>/mem
  # та же примитива через поток потока.
  - id: cred_proc_maps_mass_read
    name: "Mass /proc/<pid>/mem or /maps read — credential scraping"
    description: >
      Multiple /proc/<pid>/maps or /proc/<pid>/mem files of another live
      process read in rapid succession. This pattern indicates in-memory
      credential scraping (similar to Mimikatz on Linux). /proc/self/ is
      never a match — it is the process reading its own memory, not
      scraping another's.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: regex
          values:
            - "^/proc/[0-9]+/(task/[0-9]+/)?(maps|mem|environ)$"
        - field: proc.comm
          op: not_in
          values: ["gdb", "strace", "ltrace", "ps", "top", "htop",
                   "lsof", "procmon", "perf", "grafana", "grafana-server"]
    threshold:
      count: 5
      window_seconds: 10
      # group_by: chain, не pid (5.9.9.Fa, по данным №2.9.9): 43 фоновых
      # чтения grep'ом — это 43 разных короткоживущих pid, порог по pid их
      # не собрал бы. Настоящий скрап — либо один долгоживущий процесс, либо
      # родитель, плодящий по ребёнку на цель; вторая форма шире и требует
      # chain. Порог — вторая линия: numeric-PID предикат обязан сам убрать
      # все 44 фоновых алерта на /proc/self/maps.
      group_by: chain
    severity: critical
    action: alert
    tags: [mitre:T1003.007, credential-access, discovery]
    exceptions:
      # Scoped to comm AND path: the uprobe attacher resolves library base
      # addresses via /proc/<pid>/maps only. Reading /proc/<pid>/mem or
      # /environ — the actual credential-scraping primitives — still alerts
      # even from a process named "ebpf-guard".
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: file.path
              op: suffix
              values: ["/maps"]

  # MITRE ATT&CK: T1003.008 — Credential access via sensitive system files
  #
  # 5.6c (замер №2.2, idle-регресс, 97/ч): cron reads /etc/passwd and
  # /etc/shadow on every job tick for PAM/NSS user resolution (whoami for the
  # job's configured user) — the same accounting activity already exempted
  # for sshd/login above, just never added here. Split to
  # sensitive_file_read_daemon (info) rather than silenced outright, matching
  # the container_escape_init_proc_daemon / sigma_*_daemon precedent from
  # wave 5.1: cron's read is not content-inspected, so a compromised cron job
  # dumping /etc/shadow still shows up, just at info severity.
  - id: sensitive_file_read
    name: "Sensitive credential file read by unexpected process"
    description: >
      A sensitive system credential file (/etc/shadow, /etc/passwd) was opened
      or read by a process that is not a standard authentication binary. Attackers
      read these files to extract password hashes for offline cracking.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: in
          values:
            - "/etc/shadow"
            - "/etc/shadow-"
            - "/etc/passwd"
            - "/etc/master.passwd"
            - "/etc/gshadow"
            - "/etc/gshadow-"
        - field: file.op
          op: in
          values: ["open", "read"]
        - field: proc.comm
          op: not_in
          values: ["passwd", "chpasswd", "chage", "login", "su", "sudo",
                   "sshd", "useradd", "usermod", "userdel", "groupadd",
                   "id", "groups", "getent", "nscd", "sssd", "ldap",
                   "newgrp", "sg", "gpasswd", "cron"]
    severity: warning
    action: alert
    tags: [mitre:T1003.008, credential-access]

  - id: sensitive_file_read_daemon
    name: "Credential file read by cron during job accounting"
    description: "cron opened /etc/passwd or /etc/shadow while resolving a job's configured user — routine PAM/NSS accounting, but content is not inspected."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: in
          values:
            - "/etc/shadow"
            - "/etc/shadow-"
            - "/etc/passwd"
            - "/etc/master.passwd"
            - "/etc/gshadow"
            - "/etc/gshadow-"
        - field: file.op
          op: in
          values: ["open", "read"]
        - field: proc.comm
          op: eq
          values: ["cron"]
    severity: info
    action: alert
    tags: [mitre:T1003.008, credential-access, needs-content-analysis]

  # MITRE ATT&CK: T1552 — /proc/keys kernel keyring access
  - id: proc_keys_read
    name: "/proc/keys accessed — kernel keyring credential access"
    description: >
      The /proc/keys or /proc/key-users virtual file was accessed. These expose
      kernel keyring contents which may include session keys, Kerberos tickets,
      and other credentials stored by PAM or kernel subsystems.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: in
          values: ["/proc/keys", "/proc/key-users"]
        - field: file.op
          op: in
          values: ["open", "read"]
        - field: proc.comm
          op: not_in
          values: ["keyctl", "keyutils", "systemd", "pam_keyinit"]
    severity: warning
    action: alert
    tags: [mitre:T1552, credential-access, proc-filesystem]
