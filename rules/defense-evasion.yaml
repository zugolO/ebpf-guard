rules:
  # MITRE ATT&CK: T1070.002 — Indicator Removal: Clear Linux or Mac System Logs
  - id: evasion_log_clear
    name: "System logs cleared"
    description: >
      A log file in /var/log was deleted, moved, or truncated to zero by a
      non-logging process. Attackers clear logs to remove evidence of intrusion.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: prefix
          values: ["/var/log/"]
        - field: file.op
          op: in
          values: ["unlink", "truncate", "rename"]
        - field: proc.comm
          op: not_in
          values: ["logrotate", "newsyslog", "journald", "rsyslog", "syslogd",
                   "systemd", "auditd", "fluentd", "filebeat", "vector",
                   "promtail", "loki", "telegraf"]
    exceptions:
      # Волна 8.1, item 7: у оси file.op появился продюсер (unlink/rename/
      # truncate/rmdir), и правило перестало быть немым. Собственные демоны
      # журналирования ноды делают ровно эти операции в /var/log штатно:
      # systemd-journald — ftruncate своих файлов (зонд Ц1 волны 7: 34 события/мин
      # на idle), logrotate — rename/unlink при ротации, rsyslogd — переоткрытие.
      # Исключение по образу (/proc/<pid>/exe ставит ядро в execve), а не по comm:
      # comm подделывается prctl/exec -a, и список comm в условии этого правила
      # (оставлен как был) у journald даже не совпадал — его comm
      # «systemd-journal», обрезанный до 15 байт. Пустой exe_path (процесс умер
      # до readlink) под исключение не подходит — отказ открытый, в шум.
      - name: log-daemon-image
        condition:
          field: proc.exe_path
          op: in
          values:
            - "/usr/lib/systemd/systemd-journald"
            - "/lib/systemd/systemd-journald"
            - "/usr/sbin/logrotate"
            - "/usr/sbin/rsyslogd"
      # Волна 8.1, №543 (ночь H, 07.10.2026 06:41–06:46): unattended-upgrades
      # ставил ядро, и dpkg сам делал rename/unlink/rmdir в /lib/modules, /boot
      # и /var/log — десятки тысяч срабатываний за пять минут. Исключение по
      # ОБРАЗУ, точный путь: копия /tmp/dpkg (comm=dpkg) не подходит и
      # срабатывает. Потомков dpkg (rm под maintainer-скриптами) оно намеренно
      # НЕ покрывает: proc.ancestor_exe_path разрешает только родителя, а ось
      # «любой предок — dpkg» отдала бы исключение `dpkg --pre-invoke='rm …'`,
      # то есть обход одной командой для root. Остаточный обход этой оси —
      # собрать .deb, в котором журнал числится файлом пакета, и снять его
      # dpkg --purge; он требует сборки и установки пакета и принят.
      - name: package-manager
        condition:
          field: proc.exe_path
          op: in
          values:
            - "/usr/bin/dpkg"
      # Волна 8.1, №543: libapt (unattended-upgrades, apt, apt-get —
      # любой фронтенд, поэтому не по образу) пересоздаёт свой дамп
      # планировщика при каждом вызове dpkg и удаляет прежний. Это не журнал
      # аудита: история установки остаётся в history.log, term.log и dpkg.log,
      # которые правило видит по-прежнему. Ключ — ОБЪЕКТ, точный путь; удаление
      # этого одного файла не прячет ничего.
      - name: apt-planner-dump
        condition:
          field: file.path
          op: in
          values:
            - "/var/log/apt/eipp.log.xz"
    severity: warning
    action: alert
    tags: [mitre:T1070.002, defense-evasion]

  # MITRE ATT&CK: T1070.006 — Timestomp
  - id: evasion_timestamp_modify
    name: "File timestamps modified (timestomping)"
    description: >
      utimes/utimensat syscall used to modify file timestamps. Attackers
      change mtime/atime to match surrounding files and hide that a file
      was recently dropped or modified.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: syscall.nr
          op: in
          values: ["132", "280", "235"]  # utime, utimensat, utimes
        - field: proc.comm
          op: not_in
          values: ["touch", "rsync", "git", "tar", "cp", "ansible",
                   "dpkg", "rpm", "find", "make", "cmake", "ninja"]
    severity: warning
    action: alert
    tags: [mitre:T1070.006, defense-evasion]
    exceptions:
      # man-db: см. drift_exec_from_system_bin (rules/drift-rules.yaml) — образ /usr/bin/mandb, хост, exe_path последним.
      # mandb выставляет mtime записей кэша /var/cache/man (utimensat; пути на syscall-оси нет — ось только образ).
      - name: mandb-self
        condition_group:
          operator: and
          conditions:
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            - field: proc.exe_path
              op: in
              values: [/usr/bin/mandb]

  # MITRE ATT&CK: T1222 — File and Directory Permissions Modification
  #
  # Волна 6.2.1, слой 3 (находка №220). Правило обещало «/bin, /sbin,
  # /usr/bin, /usr/sbin» с 2024 года, а условие проверяло ровно один факт —
  # «случился chmod», потому что на syscall-оси аргументы chmod это сырые
  # указатели, а не разрешённые строки. Ровно то же условие было ещё у двух
  # правил (sigma_chmod_executable_tmp, sigma_sensitive_file_chmod), поэтому
  # каждый chmod ЛЮБОГО файла давал три алерта: 144 из 1787 алертов окна
  # замера 6.2, крупнейший одиночный кластер, и ни один из трёх не отвечал на
  # вопрос «что именно изменили».
  #
  # Сузить их исключениями было нельзя: предикат пути на событии без пути даёт
  # «поле пусто → не совпало», то есть тихую смерть правила. Поэтому chmod
  # заведён там, где путь разрешается, — в файловом коллекторе
  # (bpf/fileaccess.bpf.c, FILE_OP_CHMOD), а правило переехало на file-ось и
  # впервые проверяет то, что написано в его имени. Объём падает не потому,
  # что кого-то заглушили, а потому, что три копии одного условия стали тремя
  # разными правилами.
  #
  # ЧЕГО ЭТО ПРАВИЛО НЕ ВИДИТ. fchmod(2) по дескриптору, открытому ДО старта
  # агента (или вытесненному из LRU fd→путь), приходит с пустым file.path и
  # под префикс не подходит. Такие события считаются отдельно
  # (ebpf_guard_file_chmod_unresolved_total): «ноль алертов» читается против
  # этого счётчика, а не вместо него.
  - id: evasion_chmod_sensitive
    name: "Permissions changed on a system binary"
    description: >
      chmod/fchmod/fchmodat changed the mode of a file under /bin, /sbin,
      /usr/bin, /usr/sbin or /usr/local/{bin,sbin}. Attackers make malicious
      binaries world-executable or restore permissions after replacing a
      system utility.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.op
          op: eq
          values: ["chmod"]
        - field: file.path
          op: prefix
          values: ["/bin/", "/sbin/", "/usr/bin/", "/usr/sbin/",
                   "/usr/local/bin/", "/usr/local/sbin/"]
        - field: proc.comm
          op: not_in
          values: ["dpkg", "rpm", "apt", "yum", "dnf", "zypper", "pacman",
                   "install", "make", "cmake", "cargo", "go"]
    severity: warning
    action: alert
    tags: [mitre:T1222, defense-evasion]

  # MITRE ATT&CK: T1036.003 — Masquerading: Rename System Utilities
  - id: evasion_system_binary_replace
    name: "System binary replaced or overwritten"
    description: >
      A binary in /bin, /sbin, /usr/bin, or /usr/sbin was overwritten.
      Attackers replace system utilities with trojaned versions to establish
      persistence and evade detection.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: prefix
          values: ["/bin/", "/sbin/", "/usr/bin/", "/usr/sbin/", "/usr/local/bin/"]
        - field: file.op
          op: in
          values: ["write", "create", "rename"]
        - field: proc.comm
          op: not_in
          values: ["dpkg", "rpm", "apt", "yum", "dnf", "zypper", "pacman",
                   "install", "cp", "mv", "make", "cmake", "cargo", "go",
                   "ansible", "puppet", "chef", "salt"]
    severity: critical
    action: alert
    tags: [mitre:T1036.003, defense-evasion, persistence]

  # MITRE ATT&CK: T1036.005 — Match Legitimate Name or Location
  - id: evasion_hidden_elf_in_tmp
    name: "ELF binary written to /tmp or /dev/shm"
    description: >
      An ELF binary was written to a temporary or shared-memory directory.
      Attackers stage executables in /tmp or /dev/shm to avoid writing to
      disk in monitored locations.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: prefix
          values: ["/tmp/", "/dev/shm/", "/var/tmp/", "/run/user/"]
        - field: file.path
          op: not_suffix
          values: [".txt", ".log", ".json", ".xml", ".yaml", ".yml",
                   ".conf", ".cfg", ".pid", ".lock", ".sock", ".tmp"]
        - field: file.op
          op: in
          values: ["create", "write"]
    severity: warning
    action: alert
    tags: [mitre:T1036.005, defense-evasion]
    exceptions:
      # Scoped to comm AND path: the canary manager writes its own lure file
      # at /tmp/.secret_key, which has no extension and so isn't caught by
      # the not_suffix allowlist above. Any other write under the watched
      # temp dirs still alerts.
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: filename
              op: eq
              values: ["/tmp/.secret_key"]
      # №549 (в), 09.10.2026: натуральный apt-daily (штамп сдвинут, смок
      # w549-smoke) — вся величина правила в окне (дедуп 5 247 + лимитер 5 145
      # + выпущено 8; в ночи H2 13 560 за час 00:30) — метод APT
      # /usr/lib/apt/methods/gpgv: mkstemp-файлы /tmp/apt.conf.XXXXXX (дамп
      # конфига для apt-key), /tmp/apt.sig.XXXXXX и /tmp/apt.data.XXXXXX
      # (разрезанный InRelease). comm у метода — «gpgv», как у /usr/bin/gpgv;
      # ось — ОБРАЗ метода (точный путь из пакета apt) И ОБЪЕКТ (точная форма
      # имени: шесть символов mkstemp), exe_path последним, пустой — правило
      # срабатывает. Запись apt-key/cp/touch в /tmp/apt-key-gpghome.*/ сюда НЕ
      # входит: образы родовые (dash, cp, touch), а ось «по имени каталога»
      # отдала бы обход одним mkdir (долг №549, записан в plan.md).
      - name: apt-gpgv-method-tmp
        condition_group:
          operator: and
          conditions:
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            - field: file.path
              op: regex
              values: ['^/tmp/apt\.(conf|sig|data)\.[A-Za-z0-9]{6}$']
            - field: proc.exe_path
              op: in
              values: [/usr/lib/apt/methods/gpgv]
      # Долги 8.3, п. 8.3.3 (10.10.2026): остаток объёма на натуральном тике
      # apt-daily (ночь H4, час 5 — 11 631 алерт, выпущено 10): gpgv с
      # НЕРАЗРЕШЁННЫМ exe (мс-процесс, readlink проигрывает гонку, образная ось
      # apt-gpgv-method-tmp выше не применяется) и apt-key/cp/touch под
      # /tmp/apt-key-gpghome.XXXXXXXXXX/ — образы родовые. Для них есть ось
      # юнита: proc.systemd_unit = каталог ПРЯМО под system.slice по cgroup_id
      # (cgroup_unit.go), его заводит systemd PID 1, а user.slice, контейнер и
      # чужой юнит дают пустое/другое значение. Раньше «ось по имени каталога»
      # отдавала обход одним mkdir — теперь обход требует положить процесс в
      # cgroup apt-daily под root. Юниты — те же пять, что у node-timer-detect-virt:
      # смок w83 (10.10.2026) на форсированном apt-daily и на прямом запуске
      # esm-cache/apt-news показал остаток apt-key/cp/gpgv под тем же
      # /tmp/apt-key-gpghome.* именно из apt-news/esm-cache (apt-get update их
      # хука). Объект — ТОЧНАЯ форма mkstemp/mkdtemp
      # (6 и 10 символов), comm — сужение до наблюдённого. Гарантия вердикта
      # не меняется: правило мягкое (defense-evasion), не твёрдая улика.
      - name: apt-gpgv-tmp-unit
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [gpgv]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            - field: file.path
              op: regex
              values: ['^/tmp/apt\.(conf|sig|data)\.[A-Za-z0-9]{6}$']
            - field: proc.systemd_unit
              op: in
              values:
                - apt-daily.service
                - apt-daily-upgrade.service
                - apt-news.service
                - esm-cache.service
                - unattended-upgrades.service
      - name: apt-key-gpghome-unit
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: in
              values: [apt-key, cp, touch, gpg, gpgv]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            - field: file.path
              op: regex
              values: ['^/tmp/apt-key-gpghome\.[A-Za-z0-9]{10}/[^/]+$']
            - field: proc.systemd_unit
              op: in
              values:
                - apt-daily.service
                - apt-daily-upgrade.service
                - apt-news.service
                - esm-cache.service
                - unattended-upgrades.service

  # MITRE ATT&CK: T1562.006 — Impair Defenses: Indicator Blocking
  - id: evasion_auditd_stop
    name: "auditd or security daemon stopped"
    description: >
      A security monitoring daemon (auditd, falco, osquery, sysdig) was killed
      or stopped. This is a defense evasion technique to disable security logging
      before carrying out the main attack.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: syscall.nr
          op: in
          # №519 (02.10.2026): было ["62", "37", "238"] — 37 это alarm, 238 —
          # set_mempolicy; настоящие tkill/tgkill — 200/234. Оба не в аллоулисте
          # (цена не мерена, tgkill горячий у Go-рантайма), правило открыто kill(62).
          values: ["62", "200", "234"]  # kill, tkill, tgkill
        - field: proc.comm
          op: in
          values: ["bash", "sh", "zsh", "python3", "python", "perl",
                   "systemctl", "service", "rc-service"]
    severity: critical
    action: alert
    tags: [mitre:T1562.006, defense-evasion]

  # MITRE ATT&CK: T1027 — Obfuscated Files or Information
  - id: evasion_base64_shell_decode
    name: "Base64-decoded payload executed via shell"
    description: >
      A shell is reading from a pipe that includes base64 decoding and direct
      execution. This is the classic `echo <b64> | base64 -d | bash` pattern
      used to obfuscate payload delivery.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: proc.comm
          op: in
          values: ["base64", "openssl", "xxd", "od", "hexdump"]
        - field: syscall.nr
          op: equals
          values: ["59"]
    severity: warning
    action: alert
    tags: [mitre:T1027, defense-evasion]

  # MITRE ATT&CK: T1070.004 — File Deletion
  - id: evasion_self_delete
    name: "Process deleting its own executable"
    description: >
      A process is deleting its own binary while running — a technique to
      remove forensic evidence of what was executed. Malware often unlinks
      itself after establishing persistence.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: syscall.nr
          op: in
          values: ["87", "263"]   # unlink, unlinkat
        - field: proc.comm
          op: not_in
          values: ["dpkg", "rpm", "apt", "yum", "dnf", "make", "cmake",
                   "go", "cargo", "rustc", "gcc", "clang", "install"]
    severity: warning
    action: alert
    tags: [mitre:T1070.004, defense-evasion]

  # MITRE ATT&CK: T1562.004 — Impair Defenses: Disable or Modify System Firewall
  # Wave 6.2.1, №220/№221: this condition never looked at the arguments, so
  # it fired on EVERY exec of iptables/ip6tables regardless of the subcommand
  # — including flannel's `iptables -C ... --wait` chain-membership checks
  # forked by k3s-server, which alone pinned the rule's rate limiter at its
  # ceiling (100/window on the 6.2 baseline). This is the condition bug
  # named directly in the finding, not a threshold: the rule name promises
  # "flushed" and the condition matched every invocation. Narrowed to the
  # actual flush/delete-chain flags — the same set sigma_iptables_flush uses.
  - id: evasion_iptables_flush
    name: "iptables/nftables rules flushed"
    description: >
      iptables or nftables flush commands were executed. Attackers disable
      firewall rules to allow reverse shell connections back to their C2.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: proc.comm
          op: in
          values: ["iptables", "ip6tables", "nft", "firewall-cmd", "ufw"]
        - field: syscall.nr
          op: equals
          values: ["59"]
        - field: proc.args
          op: regex
          values:
            - "(^|\\s)(-F|--flush|-X|--delete-chain)(\\s|$)"
            - "flush ruleset"
            - "--panic"
            - "disable"
    severity: warning
    action: alert
    tags: [mitre:T1562.004, defense-evasion]
