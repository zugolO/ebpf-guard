# DNS Threat Detection Rules
# These rules detect DNS-based threats including DGA domains, DNS tunneling,
# and suspicious query patterns.

rules:
  # DGA (Domain Generation Algorithm) Detection — Shannon entropy PER LABEL.
  # High entropy labels are characteristic of malware using DGAs.
  #
  # Finding №329 (wave 6.3, item 7): the field used here was qname_entropy,
  # which is computed over every label except the TLD *concatenated together*
  # (extractBaseDomain). That value grows with the number of levels in a name,
  # not with its randomness, so it put this rule the wrong way round against
  # its own threshold: ordinary k8s service names sat above it
  # (kubernetes.default.svc.cluster.local → 3.574,
  # prometheus.monitoring.svc.cluster.local → 3.781) while a genuinely random
  # 8-character DGA label sat at 3.000 and was never caught. Scored per label
  # the two populations separate the right way round: the same k8s names peak
  # at 3.12, kq3v9zw7mrl2.net at 3.585. Short random labels stay below any
  # Shannon threshold by construction (entropy ≤ log2(len)) — those are the
  # job of dns_dga_ngram below, not of this rule.
  - id: dns_dga_high_entropy
    name: "DGA Domain Detected (High Entropy)"
    description: "A single DNS label exhibits high entropy characteristics typical of DGA malware"
    event_type: dns
    condition_group:
      operator: and
      conditions:
        - field: qname_max_label_entropy
          op: gt
          values: ["3.5"]
        # Entropy alone separates nothing at any threshold (see above);
        # the bigram model is the half that does.
        - field: qname_dga_score
          op: gt
          values: ["0.5"]
    severity: critical
    action: alert
    tags: [dns, dga, malware]
    mitigation: |
      1. Isolate the affected host from the network
      2. Check for malware infections on the host
      3. Review DNS query logs for similar patterns
      4. Consider blocking the domain at the DNS resolver level

  # DGA Detection — N-gram character bigram model
  # Catches modern DGAs that deliberately produce normal Shannon entropy profiles
  # by scoring against a bigram language model trained on legitimate domain names.
  # Finding №329 (wave 6.3): this rule could not fire. Its threshold of 0.70 sat
  # above every measured DGA sample (0.56–0.63 over eight random names of 8 to
  # 48 characters), and the model scored only the SLD, so it never looked at the
  # labels where DGA subdomains and tunnel carriers actually live — every
  # "*.svc.cluster.local" scored 0.2703, the score of "cluster". Score() is now
  # per label, above a label-length floor (ngramMinLabelLen — short labels are
  # where the model's legitimate samples score highest, and the floor has to sit
  # in the scorer so that length and score are read off the SAME label), and the
  # threshold is set where the populations actually part: no legitimate label of
  # ten characters or more measured above 0.515, no random one below 0.558.
  # That margin is thin by construction — negative control 6.3.2 on the stand is
  # what keeps watching it.
  - id: dns_dga_ngram
    name: "DGA Domain Detected (N-gram Model)"
    description: "Domain name scores high on bigram DGA model — unusual character sequences typical of algorithm-generated names"
    event_type: dns
    condition:
      field: qname_dga_score
      op: gt
      values: ["0.55"]
    severity: critical
    action: alert
    tags: [dns, dga, malware, ngram]
    mitigation: |
      1. Isolate the affected host from the network
      2. Investigate the process making the DNS query
      3. Check for malware infections and DGA-family IOCs
      4. Block at DNS resolver and correlate with network traffic

  # DNS Tunneling Detection
  # Excessively long domain names may indicate data exfiltration via DNS
  # Finding №329 (wave 6.3): the condition was qname_length > 50, the length of
  # the WHOLE name. A tunnel's length is the length of its data CARRIER, and an
  # ordinary k8s FQDN passes 50 characters on service and namespace names plus
  # the fixed ".svc.cluster.local" suffix alone —
  # "ebpf-guard-alertmanager.monitoring.svc.cluster.local" is 52 characters of
  # nothing. Scored on the longest single label instead, which is what finding
  # №83 already established these rules reason about (it has been in the alert
  # Details map as dns.max_label_len since then, just not available as a rule
  # field). Threshold from the measured spread: legitimate labels topped out at
  # 34 ("ingress-nginx-controller-admission"), carriers pack toward the RFC 1035
  # cap of 63.
  - id: dns_tunneling_long_domain
    name: "DNS Tunneling Detected"
    description: "Unusually long DNS label suggesting DNS tunneling or data exfiltration"
    event_type: dns
    condition:
      field: qname_max_label_len
      op: gt
      values: ["40"]
    severity: critical
    action: alert
    tags: [dns, tunneling, exfiltration]
    mitigation: |
      1. Investigate the process making the query
      2. Check for unauthorized data transfer
      3. Review firewall logs for related traffic
      4. Implement DNS query length limits if not present

  # Suspicious TLD Detection
  # Known malicious TLDs used by malware
  - id: dns_suspicious_tld_onion
    name: "Tor Hidden Service DNS Query"
    description: "Query to .onion domain via regular DNS (possible misconfiguration or malicious activity)"
    event_type: dns
    condition:
      field: qname
      op: suffix
      values: [".onion"]
    severity: warning
    action: alert
    tags: [dns, tor, suspicious-tld]

  - id: dns_suspicious_tld_emercoin
    name: "Emercoin TLD Query"
    description: "Query to Emercoin blockchain TLD (often used by malware)"
    event_type: dns
    condition:
      field: qname
      op: suffix
      values: [".bit", ".bazar", ".coin", ".lib", ".emc"]
    severity: warning
    action: alert
    tags: [dns, emercoin, suspicious-tld]

  # TXT Record Abuse
  # TXT queries may indicate DNS tunneling
  - id: dns_txt_suspicious
    name: "Suspicious TXT DNS Query"
    description: "TXT record query detected (possible DNS tunneling)"
    event_type: dns
    condition:
      field: qtype
      op: equals
      values: ["16"]
    severity: warning
    action: alert
    tags: [dns, txt, tunneling]

  # ANY Query Detection
  # ANY queries are often used for amplification attacks or reconnaissance
  - id: dns_any_query
    name: "DNS ANY Query"
    description: "DNS ANY query detected (possible amplification attack or reconnaissance)"
    event_type: dns
    condition:
      field: qtype
      op: equals
      values: ["255"]
    severity: warning
    action: alert
    tags: [dns, any, amplification]

  # NXDOMAIN Flood Detection
  # Many NXDOMAIN responses may indicate DGA or scanning
  - id: dns_nxdomain_flood
    name: "NXDOMAIN Response Flood"
    description: "Multiple NXDOMAIN responses suggesting DGA or domain scanning"
    event_type: dns
    condition:
      field: rcode
      op: equals
      values: ["3"]
    severity: warning
    action: alert
    tags: [dns, nxdomain, dga, scanning]

  # PTR Query Detection
  # Reverse DNS queries may indicate reconnaissance
  - id: dns_ptr_recon
    name: "Reverse DNS Reconnaissance"
    description: "PTR queries detected (possible network reconnaissance)"
    event_type: dns
    condition:
      field: qtype
      op: equals
      values: ["12"]
    severity: info
    action: alert
    tags: [dns, ptr, reconnaissance]

  # Dynamic DNS Detection
  # Queries to dynamic DNS services may indicate C2 communication
  - id: dns_dynamic_dns
    name: "Dynamic DNS Query"
    description: "Query to known dynamic DNS service (possible C2 communication)"
    event_type: dns
    condition:
      field: qname
      op: suffix
      values:
        - ".ddns.net"
        - ".duckdns.org"
        - ".no-ip.com"
        - ".dynu.com"
        - ".changeip.com"
        - ".dnsdynamic.org"
        - ".hopto.org"
        - ".zapto.org"
        - ".synology.me"
        - ".myqnapcloud.com"
    severity: warning
    action: alert
    tags: [dns, dynamic-dns, c2]

  # DNS over HTTPS (DoH) Detection
  # DoH can be used to bypass DNS monitoring
  - id: dns_doh_detected
    name: "DNS over HTTPS Detected"
    description: "Connection to known DoH resolver (may bypass DNS monitoring)"
    event_type: dns
    condition:
      field: qname
      op: in
      values:
        - "cloudflare-dns.com"
        - "dns.google"
        - "dns.quad9.net"
        - "doh.opendns.com"
        - "dns.nextdns.io"
    severity: info
    action: alert
    tags: [dns, doh, bypass]

# Configuration for DNS threat detection
config:
  # Entropy threshold for DGA detection (bits per character)
  dga_entropy_threshold: 3.5

  # N-gram DGA score threshold [0,1]
  dga_ngram_threshold: 0.70

  # Minimum domain length for DGA detection
  dga_min_length: 10

  # Minimum domain length for tunneling detection
  tunneling_min_length: 50

  # Suspicious TLDs list
  suspicious_tlds:
    - ".onion"
    - ".bit"
    - ".bazar"
    - ".coin"
    - ".lib"
    - ".emc"
    - ".zip"
    - ".mov"
    - ".phd"

  # Dynamic DNS domains
  dynamic_dns_domains:
    - ".ddns.net"
    - ".duckdns.org"
    - ".no-ip.com"
    - ".dynu.com"
    - ".changeip.com"
    - ".dnsdynamic.org"
    - ".hopto.org"
    - ".zapto.org"
    - ".synology.me"
    - ".myqnapcloud.com"
