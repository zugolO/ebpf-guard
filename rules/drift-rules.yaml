# drift-rules.yaml — Container drift detection rules for ebpf-guard.
#
# Drift is detected at the correlator level by the internal/drift Detector,
# which maintains per-container baselines of normal behaviour. This rule set
# covers drift scenarios that persist beyond the baseline window and
# complements the real-time drift alert generation in main.go.
#
# In ImageManifest mode (config: drift.image_manifest=true), the ExecPaths
# baseline is pre-seeded from the container image layers via overlayfs walk.
# Any binary NOT present in the image triggers a critical alert instantly.
#
# References:
#   - MITRE T1204.002 — User Execution: Malicious File
#   - MITRE T1059 — Command and Scripting Interpreter
#   - MITRE T1505.003 — Server Software Component: Web Shell

rules:
  # ── New binary execution drift ─────────────────────────────────────────────
  - id: drift_exec_from_system_bin
    name: "Container drift — binary executed from system bin dir"
    description: >
      A binary under a system bin directory was executed (execve, matched on
      argv[0] — 5.9.9.F.4f/№146: an `op: open` on the same path range does
      NOT mean the file ran, e.g. `ldd`/`file`/`readelf`/a package manager
      inspecting it; this rule now requires the exec fact itself, the same
      technique 5.9.9.F.3b used for the /tmp-execution family). Renamed from
      `drift_new_exec_critical` and downgraded to `warning` by 5.9.9.F.5g/
      №154: profiler.drift_baseline.enabled defaults to false, so as shipped
      this rule cannot tell a novel binary from a routine one — it fires on
      EVERY matching exec. (Wave 6.0 turned it ON in the measurement stand's
      config; the shipped default is unchanged.) Under the default config the
      old name/severity was a false claim: on the idle-hour
      of measurement №2.9.9.F.4 it produced 576 of 607 alerts and 576 of 577
      criticals, and 499 of those were re-exec of `sshd` on each inbound TCP
      connection (~1 per 7.2s on this stand's public IP, 9 scanning sources,
      0 successful auths — see the "5.9.9.F.5g" block in plan.md for the
      measured numbers). That volume is a property of the stand's ssh
      exposure, not a drift signal, and it also pins the per-rule rate
      limiter (10/60s) for most of the idle hour, which is a second,
      independent reason not to keep it `critical` (see №164/5.9.9.F.5n,
      still open). `critical` stays reserved for a rule of this shape run
      WITH `drift_baseline` enabled and a learning window proven closed
      before the measurement window opens — option 1 of the 5g decision,
      taken by wave 6.0 (see the class-wide baseline note at the end of this
      file). Restoring `critical` needs a second clean run, as any change of
      baseline does, and is a separate decision. Until baselining is on,
      treat this as a broad "system-path binary executed" rule, not a
      novelty signal.
    event_type: syscall
    condition:
      field: proc.args
      op: prefix
      values:
        - "/bin/"
        - "/sbin/"
        - "/usr/bin/"
        - "/usr/sbin/"
        - "/usr/local/bin/"
    severity: warning
    action: alert
    class: drift
    tags:
      - "T1204.002"
      - "drift"
      - "payload-drop"

  # ── New library loaded drift ──────────────────────────────────────────────
  - id: drift_new_library_in_system_dir
    name: "Container drift — new shared library in system path"
    description: >
      A shared library was opened from a system library path. "not observed
      during baseline" is aspirational — see the class-wide baseline note at
      the end of this file; profiler.drift_baseline is off in this stand, so
      today this fires on every match. Could indicate an LD_PRELOAD rootkit
      or a malicious library injection.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: op
          op: equals
          values: ["open"]
        - field: filename
          op: prefix
          values:
            - "/lib/"
            - "/usr/lib/"
        - field: filename
          op: suffix
          values: [".so"]
        - field: proc.comm
          op: not_in
          values: ["sshd", "cron"]
    severity: warning
    action: alert
    class: drift
    tags:
      - "T1574.006"
      - "drift"
      - "library-injection"
    exceptions:
      # 5.9.9.F.4a (№141): systemd-sandbox-child, extended from the original
      # six 5.9.9.F.3c rules to the actual class raised by this actor.
      - name: systemd-sandbox-child
        condition_group:
          operator: and
          conditions:
            - field: proc.ppid
              op: eq
              values: ["1"]
            - field: proc.comm
              op: regex
              values: ["^\\(.*\\)$"]

  # sshd/cron dlopen PAM/NSS modules (pam_unix.so, libnss_*.so) on every
  # login/job run — legitimate dynamic loading, not injection. plan.md
  # wave 5.1: downgrade, don't suppress.
  - id: drift_new_library_in_system_dir_daemon
    name: "Shared library loaded in system path by login/cron daemon"
    description: >
      sshd or cron opened a .so file under /lib or /usr/lib — usually a
      PAM or NSS module loaded during login/job accounting, but content
      is not inspected.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: op
          op: equals
          values: ["open"]
        - field: filename
          op: prefix
          values:
            - "/lib/"
            - "/usr/lib/"
        - field: filename
          op: suffix
          values: [".so"]
        - field: proc.comm
          op: in
          values: ["sshd", "cron"]
    severity: info
    action: alert
    class: drift
    tags:
      - "T1574.006"
      - "drift"
      - "library-injection"
      - "needs-content-analysis"

  # ── New directory access drift ─────────────────────────────────────────────
  - id: drift_new_file_dir_sensitive
    name: "Container drift — access to new sensitive directory"
    description: >
      A file was accessed in a directory that is security-sensitive (/root,
      /home, /etc/cron, /var/spool/cron). "outside the container baseline"
      is aspirational — see the class-wide baseline note at the end of this
      file; profiler.drift_baseline is off in this stand, so today this
      fires on every access, not just ones outside a learned baseline. May
      indicate a process escaping its intended scope. 5.9.9.F.4c
      (observer-tree exclusion) closes the largest known non-attack source
      of this rule's volume (measurer-harness reads of /root/.curlrc,
      /root/.jq); any remainder outside that tree is unmeasured as of
      5.9.9.F.4f (no live stand access this session) and is an open
      question for the next live measurement, not a finding of this wave.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: op
          op: equals
          values: ["open"]
        - field: filename
          op: prefix
          values:
            - "/root/"
            - "/home/"
            - "/var/spool/cron/"
            - "/etc/cron.d/"
            - "/etc/systemd/system/"
    severity: warning
    action: alert
    class: drift
    tags:
      - "T1543.002"
      - "drift"
      - "privilege-escalation"
    exceptions:
      # Scoped to comm AND path: the agent creates canary traps under /root/.
      # Access to cron/systemd persistence directories still alerts even from
      # a process named "ebpf-guard".
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: filename
              op: suffix
              values: [".canary"]

  # ── New network peer drift ─────────────────────────────────────────────────
  - id: drift_new_network_common_c2_ports
    name: "Container drift — outbound connection to unusual port"
    description: >
      An outbound TCP connection was established to a port commonly used by
      C2 frameworks (4444, 8080, 8443, 31337). "not seen during baseline" is
      aspirational — see the class-wide baseline note at the end of this
      file; profiler.drift_baseline is off in this stand, so today this
      fires on every connection to a listed port, not just novel ones.
    event_type: network
    condition:
      field: dport
      op: in
      values: ["4444", "8080", "8443", "31337", "1337", "5555", "6666", "7777", "8888", "9999"]
    severity: warning
    action: alert
    class: drift
    tags:
      - "T1571"
      - "drift"
      - "C2"

  # ── Syscall drift for dangerous syscalls ──────────────────────────────────
  - id: drift_dangerous_syscall
    name: "Container drift — dangerous new syscall observed"
    description: >
      A system call commonly used for privilege escalation or container
      escape was made with an argument combination this workload was never
      seen using during the baseline window. Since 2026-08-30 the baseline
      signature includes the syscall's semantic scalar argument (ptrace
      request, mount flags, unshare/setns namespace flags, bpf command), so
      "new" means a new KIND of call, not merely the first call of its
      number — see internal/profiler/driftsyscallargs.go.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        # 2026-08-30: every syscall listed here must have an entry in
        # driftSyscallArgSpecs (internal/profiler/driftsyscallargs.go).
        # Without one the drift signature degenerates to the bare syscall
        # number, and the first call of that number during learning silences
        # the rule for that workload forever — which is what measurement
        # №6.0 measured: 416 suppressed matches, 0 alerts.
        #
        # Removed here on the same date, and NOT moved to the threat rule
        # below: kexec_load (246), add_key (248), request_key (249). None of
        # the three is in the kernel syscall allowlist
        # (internal/bpf/sampling.go, DefaultMonitoredSyscalls), so no event
        # for them ever reaches the rule engine — listing them promised a
        # detection that could not happen. Re-add them here (with arg specs)
        # once the allowlist covers them; kexec_load already has its spec.
        - field: nr
          op: in
          values:
            - "ptrace"
            - "mount"
            - "umount2"
            - "unshare"
            - "setns"
            - "perf_event_open"
            - "bpf"
        # 5.9.3c (#47): container runtimes legitimately call several of
        # these (mount/unshare/setns/pivot_root) while building a new
        # container's namespaces, which can land after the learning window
        # ends on a node that starts new pods continuously — exclude the
        # runtime, not the syscalls. The drift signal (post-baseline
        # novelty) still does the rest of the work.
        #
        # 5.9.3f (#50): the same exclusion is needed for systemd, and it was
        # not visible until #50 made this rule reachable at all — its nr
        # values were syscall NAMES, which never matched. Measured on the
        # stand (smoke run 2026-08-20, 120 s): 4 alerts, all comm=systemd,
        # pid 1 and transient (sd-executor) children — unit sandboxing
        # (PrivateTmp/ProtectSystem) calls mount/unshare on every unit
        # start, which is exactly the "new after the learning window"
        # shape this rule looks for.
        - field: comm
          op: not_in
          values: ["runc", "containerd-shim", "containerd-shim-runc-v2",
                    "dockerd", "conmon", "crun",
                    "systemd", "(sd-executor)", "systemd-udevd",
                    "mount", "umount"]
    severity: critical
    action: alert
    class: drift
    tags:
      - "T1611"
      - "drift"
      - "container-escape"
      - "privilege-escalation"

  # ── pivot_root: occurrence, not novelty ───────────────────────────────────
  #
  # pivot_root(new_root, put_old) takes two arguments and both are userspace
  # pointers, so unlike its former neighbours in drift_dangerous_syscall it has
  # no scalar the baseline can key on. Left in the drift class it would be
  # strictly worse than silent: the first pivot_root a workload makes during
  # learning becomes its baseline, and every later one — including a real
  # escape — is suppressed as "known".
  #
  # Novelty is also the wrong question for it. A container runtime calls
  # pivot_root while building a namespace and is excluded by comm below;
  # anything ELSE calling it is worth an alert the first time and every time,
  # so this is class: threat with no baseline at all.
  #
  # Making the baseline usable here instead would mean reading new_root/put_old
  # with bpf_probe_read_user_str on sys_enter — a BPF-side change plus a
  # `make generate` run. Deliberately not done as part of the 2026-08-30 fix.
  #
  # Expected to be silent on the measurement stand (registered in
  # attacks/silent-rules.txt, category b): no attack scenario in
  # run-all-attacks.sh calls pivot_root outside the excluded runtimes. That is
  # the correct behaviour for an occurrence rule, not a defect.
  - id: escape_pivot_root
    name: "Filesystem root pivoted outside a container runtime"
    description: >
      pivot_root(2) was called by a process that is not a known container
      runtime. Changing the filesystem root is how a container escape
      relocates its view of the host, and outside runtime namespace setup
      there is no routine reason for it. Reported on every occurrence: the
      call carries only userspace pointers, so no baseline signature can
      distinguish one pivot_root from another.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values:
            - "pivot_root"
        - field: comm
          op: not_in
          values: ["runc", "containerd-shim", "containerd-shim-runc-v2",
                    "dockerd", "conmon", "crun",
                    "systemd", "(sd-executor)", "systemd-udevd",
                    "mount", "umount"]
    severity: critical
    action: alert
    class: threat
    tags:
      - "T1611"
      - "container-escape"
      - "privilege-escalation"

# ── Class-wide baseline decision (5.9.9.F.4f, №146) ─────────────────────────
#
# All six `class: drift` rules above describe themselves as firing on events
# "not seen during baseline"/"new". That claim depends on
# profiler.drift_baseline.enabled (internal/profiler/driftbaseline.go,
# internal/config/config.go) — disabled by default. When it is off, every
# rule in this class alerts on EVERY matching event, not just novel ones —
# exactly the finding named by №146. (Since Wave 6.0 it is ON in the
# measurement stand's config; see the 2026-08-29/30 updates at the end.)
#
# Two ways to make the description true were on the table (plan.md
# 5.9.9.F.4f): (a) turn profiler.drift_baseline.enabled on in the stand
# config, so the six rules work as literally described, or (b) rename/rewrite
# them to stop promising baseline-relative behavior. This session chose (b)
# — description text only, IDs unchanged to avoid an ID-rename cascade into
# detection-baseline.txt/background-rules.txt/the pipeline scripts/tests
# this same session is already editing (5.9.9.F.4a-e) without live-stand
# access to verify none of those break.
#
# (a) was rejected for THIS session specifically because of the risk the
# plan named in advance: profiler.drift_baseline.learning_period defaults to
# 3600s — exactly the length of the idle-hour measurement window. Turning it
# on requires a preflight guard proving the learning phase has actually
# closed (e.g. via ebpf_guard_drift_baseline_learning_workloads reaching 0,
# or /debug/state) BEFORE the idle-hour/attack window opens; otherwise all
# six rules go silent for the whole measurement by construction, and the
# wave's mandatory values #3 and #11 (verdict=attack over idle-hour = 0;
# drift_new_exec_critical = 0 outside exec) turn falsely green. Building and
# proving that guard needs a live pipeline run to get real timings — not
# available this session (see [[gate-offline-replay-on-mac]]) — so (a)
# remains open for a session with stand access, not abandoned.
#
# ── Update 2026-08-29 (Wave 6, plan.md "6.0 Базовая линия дрейфа") ─────────
#
# (a) is now taken: deploy/docker-test-setup/config-test.yaml sets
# profiler.drift_baseline.enabled: true. Rule text/IDs in this file are
# unchanged — the baseline mechanism, not prose, is what makes "not seen
# during learning" true on the measurement stand.
#
# ── Update 2026-08-30 (after measurement №6.0) ─────────────────────────────
#
# Measurement №6.0 ran the guard demanded above and it did its job: the
# learning phase was proven closed before the idle hour, idle-hour volume for
# drift_exec_from_system_bin fell from 577/h to 0, and the run-gate's two
# FAILs plus the 6.0.3 positive control together named a real defect rather
# than blessing a false green.
#
# The defect was in the baseline's own signature, not in these rules.
# driftSignatureTarget truncated every path to its first two segments, so the
# signature was exactly as coarse as the prefix lists these rules match on —
# "/usr/bin", "/usr/sbin", "/usr/local", "/usr/lib", "/etc". Once a workload
# had exec'd or opened ANY path under such a directory during learning, every
# other path under it was "known" forever, and the positive control (a
# brand-new binary under /usr/local/bin, run by an already-enforcing
# workload) could not have alerted under any configuration. All five drift
# rules that had ever fired went silent for the whole measurement window.
#
# Fixed by removing the depth truncation (normalizeDriftPath keeps every
# segment, still mapping numeric segments to "*") and bounding signature
# cardinality directly instead, via
# profiler.drift_baseline.max_signatures_per_workload (default 256). At the
# cap a baseline freezes: later novel signatures alert rather than being
# silently trusted, and the affected profiles are visible in
# ebpf_guard_drift_baseline_saturated_profiles.
#
# Two things the measurement showed that are stand tuning, not rule or code
# defects, and are recorded here because they change how these rules behave
# in a short measurement window:
#
#   - learning_period 3600 == the idle hour, and enforce_deadline_periods 3
#     == 3h > the whole run. On №6.0 that left 13 of 21 workloads learning
#     (i.e. silent for every rule in this file) for the entire measured hour.
#     The stand config now uses 600 / 2 so the deadline expires inside the
#     prologue; the shipped product defaults are unchanged.
#   - Aggregate gauges cannot answer "is THIS workload enforcing".
#     /debug/state now carries drift_baseline.workloads with per-workload
#     state, which is what the 6.0.4 pipeline guard reads.
#
# ── Update 2026-08-30 (second pass: the two defects the first pass left) ───
#
# The depth-2 fix above lifted the four drift rules whose target is a PATH. It
# did not lift drift_dangerous_syscall, and it did nothing about alert volume.
# Both are now addressed.
#
# 1. Syscalls with no path. ptrace/mount/unshare/setns/bpf carry no proc.args,
#    so their signature was the decimal syscall number and nothing else — one
#    mount during learning made every later mount by that workload "known",
#    which is the same blindness in a different shape (416 suppressed, 0
#    alerts on №6.0). The register arguments were carried end-to-end the whole
#    time (bpf/syscall.bpf.c -> internal/bpf/events.go -> arg0..arg5) and are
#    now folded into the signature: internal/profiler/driftsyscallargs.go maps
#    each syscall to its semantic scalar and renders it by name, so
#    "165|mount=MS_BIND" and "165|mount=MS_RDONLY" are two signatures.
#    Only scalars are usable — pointer arguments are gone by the time
#    userspace dequeues the record. pivot_root, whose arguments are all
#    pointers, was therefore moved out of the class entirely (see
#    escape_pivot_root above), and kexec_load/add_key/request_key were dropped
#    as unreachable.
#
# 2. Alert volume. An anomaly used to be emitted on EVERY match of a novel
#    signature, so volume tracked how often the new binary happened to run —
#    a property of the workload's cron schedule, not of the drift. A drift
#    rule reports a change of state, and a state change is worth one alert, so
#    the profiler now reports each (workload, signature) once and counts the
#    repeats as suppressed_total{reason="already_reported"}. Raw volume stays
#    visible in anomalies_total, which still counts every match. Note the
#    consequence for measurement: a run's drift ALERT count is now bounded by
#    the number of distinct new signatures per hour, and the number of newly
#    reported signatures per workload is readable live in /debug/state
#    (drift_baseline.workloads[].reported).
#
# There is no re-arm TTL: a signature reported once stays reported for the
# life of the profile. An operator who misses the alert gets no repeat, and
# the alert store is the record.
