# eBPF Subversion Detection Rules for ebpf-guard
#
# Detects attempts to blind, disable, or manipulate eBPF monitoring programs
# via the bpf(2) syscall (x86-64 nr=321).
#
# BPF command constants (linux/bpf.h):
#   BPF_MAP_DELETE_ELEM = 3   — delete an element from a BPF map
#   BPF_OBJ_PIN         = 6   — pin an object to the BPF virtual filesystem
#   BPF_PROG_DETACH     = 9   — detach a BPF program from a cgroup/hook
#   BPF_LINK_DETACH     = 33  — detach a BPF link (modern equivalent of PROG_DETACH)
#
# MITRE ATT&CK: T1562 (Impair Defenses), T1055 (Process Injection)

rules:
  # ============================================================================
  # Rule 1 – Destructive BPF command from an unprivileged process
  #
  # A non-root process calling BPF_PROG_DETACH, BPF_MAP_DELETE_ELEM,
  # BPF_OBJ_PIN, or BPF_LINK_DETACH has no legitimate use-case on a
  # hardened node; root-level BPF management is handled exclusively by the
  # ebpf-guard agent.  Any non-root attempt is treated as an active attempt
  # to disable security monitoring.
  # ============================================================================

  - id: ebpf_subversion_detach_nonroot
    name: "eBPF Subversion: Destructive BPF command from unprivileged process"
    description: >-
      An unprivileged process (uid > 0) invoked bpf(2) with a destructive
      command: BPF_PROG_DETACH (9), BPF_MAP_DELETE_ELEM (3), BPF_OBJ_PIN (6),
      or BPF_LINK_DETACH (33). These commands can detach, delete, or re-pin
      eBPF programs and are a strong indicator of an attempt to disable
      security monitoring (eBPF guard blinding).
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["321"]               # bpf(2) on x86-64
        - field: arg0
          op: in
          values: ["3", "6", "9", "33"] # BPF_MAP_DELETE_ELEM, BPF_OBJ_PIN, BPF_PROG_DETACH, BPF_LINK_DETACH
        - field: uid
          op: gt
          values: ["0"]                 # non-root only; root agent operations are expected
    severity: critical
    action: kill
    tags: [ebpf-subversion, defense-evasion, monitor-tampering, mitre-t1562, mitre-t1055]

  # ============================================================================
  # Rule 2 – bpf() syscall from a process outside the allowed whitelist
  #
  # Only the ebpf-guard agent binary (comm="ebpf-guard") and the node's own
  # container/cgroup managers are expected to issue destructive BPF commands
  # on a monitored node — systemd, systemd-cgroups, containerd, dockerd, and
  # runc all manage cgroup-BPF programs as part of routine container
  # lifecycle operations (attach/detach on cgroup create/delete). Any other
  # caller — including root-owned tooling such as bpftool or a compromised
  # container — is considered hostile when it attempts to detach or delete
  # BPF objects.
  #
  # DEBT (wave 5.9.4b, finding №53): the whitelist-by-comm below is a
  # stopgap, not a fix. It cannot distinguish a legitimate daemon detaching
  # ITS OWN cgroup-BPF program from that same daemon (or a process spoofing
  # its comm) detaching ebpf-guard's monitoring program — the syscall
  # collector captures only nr/arg0-arg5/comm/uid, not which BPF object
  # (map_id/prog_id, or its owning cgroup) the command targets. A real fix
  # needs the collector to parse the bpf_attr union to recover the target
  # object and check its owner. Until that lands, this rule cannot safely
  # kill on comm alone — downgraded to alert (see
  # deploy/docker-test-setup/attacks/destructive-actions.txt and plan.md
  # 5.9.4b for the accounting).
  # ============================================================================

  - id: ebpf_subversion_unauthorized_caller
    name: "eBPF Subversion: Destructive bpf() syscall from unauthorized process"
    description: >-
      A process whose comm name is not in the trusted whitelist invoked bpf(2)
      with a destructive command (BPF_PROG_DETACH, BPF_MAP_DELETE_ELEM,
      BPF_OBJ_PIN, BPF_LINK_DETACH). Only the ebpf-guard agent binary and the
      node's container/cgroup managers are expected to manage BPF programs;
      any other caller should be treated as a potential defense-evasion
      attempt. action is alert, not kill, until the collector can identify
      the targeted BPF object and confirm the caller does not own it — see
      the DEBT note above.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["321"]               # bpf(2) on x86-64
        - field: arg0
          op: in
          values: ["3", "6", "9", "33"] # destructive BPF commands only
        - field: comm
          op: not_in
          values:                       # trusted: security agent + container/cgroup managers
            - "ebpf-guard"
            - "systemd"
            - "systemd-cgroups"
            - "containerd"
            - "dockerd"
            - "runc"
    severity: critical
    action: alert
    tags: [ebpf-subversion, defense-evasion, monitor-tampering, mitre-t1562]
