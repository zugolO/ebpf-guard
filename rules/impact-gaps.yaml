rules:
  # MITRE ATT&CK: T1489 — Service Stop
  # Adversaries stop or disable systemd services to disable security tools,
  # logging, or monitoring.
  - id: impact_systemd_service_disabled
    name: "systemd service stopped or disabled by unexpected process"
    description: >
      systemctl was used to stop, disable, or mask a systemd service from a
      process context that is not a known system administration tool or
      interactive user session. Attackers disable security services (auditd,
      falco, ebpf-guard) or logging (journald, rsyslog) to hide their
      activity. Also covers T1562.001 (Impair Defenses: Disable or Modify
      Tools).
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: proc.comm
          op: in
          values: ["systemctl", "service"]
        - field: syscall.nr
          op: equals
          values: ["59"]
        - field: uid
          op: equals
          values: ["0"]
    severity: critical
    action: alert
    tags: [mitre:T1489, impact, defense-evasion, service-stop, mitre:T1562.001]

  # MITRE ATT&CK: T1485 — Data Destruction (via file removal on Linux)
  # Covers rm -rf of critical directories, shred, dd overwrite.
  - id: impact_mass_file_deletion_critical
    name: "Mass deletion of files in critical system directories"
    description: >
      rm or shred was executed targeting critical system directories
      (/etc, /var/log, /boot, /lib). This is classic data destruction
      or anti-forensics: attackers delete logs, configuration, and system
      binaries to cover their tracks or to render the system inoperable
      (ransomware without encryption — "wiper" style).
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: prefix
          values:
            - "/etc/"
            - "/var/log/"
            - "/boot/"
            - "/lib/modules/"
            - "/usr/lib/systemd/"
        - field: file.op
          op: in
          values: ["unlink", "rmdir"]
    exceptions:
      # Волна 8.1, item 7: у оси file.op появился продюсер (unlink/rename/
      # truncate/rmdir), и правило перестало быть немым. Собственные демоны
      # журналирования ноды делают ровно эти операции в /var/log штатно:
      # systemd-journald — ftruncate своих файлов (зонд Ц1 волны 7: 34 события/мин
      # на idle), logrotate — rename/unlink при ротации, rsyslogd — переоткрытие.
      # Исключение по образу (/proc/<pid>/exe ставит ядро в execve), а не по comm:
      # comm подделывается prctl/exec -a, и список comm в условии этого правила
      # (оставлен как был) у journald даже не совпадал — его comm
      # «systemd-journal», обрезанный до 15 байт. Пустой exe_path (процесс умер
      # до readlink) под исключение не подходит — отказ открытый, в шум.
      - name: log-daemon-image
        condition:
          field: proc.exe_path
          op: in
          values:
            - "/usr/lib/systemd/systemd-journald"
            - "/lib/systemd/systemd-journald"
            - "/usr/sbin/logrotate"
            - "/usr/sbin/rsyslogd"
      # Волна 8.1, №543 (ночь H, 07.10.2026 06:41–06:46): unattended-upgrades
      # ставил ядро, и dpkg сам делал rename/unlink/rmdir в /lib/modules, /boot
      # и /var/log — десятки тысяч срабатываний за пять минут. Исключение по
      # ОБРАЗУ, точный путь: копия /tmp/dpkg (comm=dpkg) не подходит и
      # срабатывает. Потомков dpkg (rm под maintainer-скриптами) оно намеренно
      # НЕ покрывает: proc.ancestor_exe_path разрешает только родителя, а ось
      # «любой предок — dpkg» отдала бы исключение `dpkg --pre-invoke='rm …'`,
      # то есть обход одной командой для root. Остаточный обход этой оси —
      # собрать .deb, в котором журнал числится файлом пакета, и снять его
      # dpkg --purge; он требует сборки и установки пакета и принят.
      - name: package-manager
        condition:
          field: proc.exe_path
          op: in
          values:
            - "/usr/bin/dpkg"
      # Волна 8.1, №543: libapt (unattended-upgrades, apt, apt-get —
      # любой фронтенд, поэтому не по образу) пересоздаёт свой дамп
      # планировщика при каждом вызове dpkg и удаляет прежний. Это не журнал
      # аудита: история установки остаётся в history.log, term.log и dpkg.log,
      # которые правило видит по-прежнему. Ключ — ОБЪЕКТ, точный путь; удаление
      # этого одного файла не прячет ничего.
      - name: apt-planner-dump
        condition:
          field: file.path
          op: in
          values:
            - "/var/log/apt/eipp.log.xz"
      # Волна 8.1, №543: maintainer-скрипты ядра (rm под grub-mkconfig,
      # linux-image postinst, update-initramfs) убирают свои ВРЕМЕННЫЕ
      # артефакты. Ключ — ОБЪЕКТ без ценности для разрушения: временные копии
      # dpkg (*.dpkg-new/-tmp/-bak/-old/-dist), черновик grub.cfg.new до
      # переименования, маркер .fresh-install. Удаление initrd, vmlinuz,
      # grub.cfg и модулей под исключение не попадает и срабатывает.
      # №550 (ночь H2, 08.10.2026 06:39:22): sudo.preinst кладёт копию
      # conffile в /etc/sudoers.pre-conffile, postinst её удаляет — 1 critical
      # за ночь. Та же временная копия, что *.dpkg-old; якорь /etc (conffile
      # живут там), так что приманка /var/log/<журнал>.pre-conffile
      # исключения не получает. Сама /etc/sudoers срабатывает.
      - name: package-transient-artifact
        condition:
          field: file.path
          op: regex
          values:
            - "\\.dpkg-(new|tmp|bak|old|dist)$"
            - "^/boot/grub/grub\\.cfg\\.new$"
            - "^/lib/modules/[^/]+/\\.fresh-install$"
            - "^/etc/.+\\.pre-conffile$"
    severity: critical
    action: alert
    tags: [mitre:T1485, impact, data-destruction, anti-forensics]

  # MITRE ATT&CK: T1498 — Network Denial of Service (Linux fork bomb / resource exhaustion)
  - id: impact_fork_bomb_pattern
    name: "Rapid process spawn pattern consistent with fork bomb or resource exhaustion attack"
    description: >
      A process is spawning children at an abnormally high rate (> 50 new
      processes in a 10-second window). This matches fork-bomb patterns
      (:(){ :|:& };:), resource exhaustion attacks, or crypto-mining worms
      that self-replicate. Can also be triggered by misconfigured process
      supervisors, but the volume is typically much higher than normal
      application behaviour.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: syscall.nr
          op: in
          values: ["56", "57"]    # clone, fork
        - field: uid
          op: not_in
          values: ["0"]    # non-root fork bombs are rarer but more suspicious
    severity: warning
    action: alert
    tags: [mitre:T1498, impact, denial-of-service, fork-bomb]

  # MITRE ATT&CK: T1561.001 — Disk Wipe: Disk Structure Wipe
  # dd if=/dev/zero of=/dev/sda, mkfs on mounted devices, wipefs.
  - id: impact_raw_disk_write_from_container
    name: "Raw disk device write (dd, mkfs, wipefs) from an unexpected process"
    description: >
      dd, mkfs, or wipefs was executed targeting a block device (/dev/sd*,
      /dev/nvme*, /dev/xvd*, /dev/vd*). Raw disk writes destroy filesystems
      and partition tables — a classic disk-wipe attack. From inside a
      container this indicates either improper device mounting or successful
      container escape.
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: file.path
          op: prefix
          values:
            - "/dev/sd"
            - "/dev/nvme"
            - "/dev/xvd"
            - "/dev/vd"
        - field: file.op
          op: eq
          values: ["write"]
      subgroups:
        - operator: or
          conditions:
            - field: proc.comm
              op: in
              values: ["dd", "wipefs", "shred", "badblocks", "parted", "sfdisk", "fdisk"]
            - field: proc.comm
              op: prefix
              values: ["mkfs"]
    severity: critical
    action: alert
    tags: [mitre:T1561.001, impact, disk-wipe, container-escape]
