rules:
  # Long-lived connection to common C2 ports (>5 minutes).
  # HTTP/HTTPS sessions lasting minutes to hours are normal; these non-standard
  # ports lasting that long are not.
  - id: net_long_c2_connection
    name: "Long-lived connection to suspicious port"
    description: >
      A TCP connection to a known C2/exfiltration port remained open for more
      than 5 minutes. Legitimate short-request protocols (HTTP, gRPC, SMTP) do
      not sustain multi-minute connections on these ports. Indicates possible
      C2 beaconing or data exfiltration channel.
    event_type: net_close
    condition_group:
      operator: and
      conditions:
        - field: dport
          op: in
          values:
            - "4444"   # common reverse-shell port
            - "1337"   # common C2 port
            - "31337"  # Elite/common backdoor
            - "8888"   # common RAT
            - "9999"   # common RAT
            - "6666"   # common IRC/botnet
            - "6667"   # IRC botnet
        - field: duration_sec
          op: gt
          values: ["300"]   # > 5 minutes
    severity: critical
    action: alert
    tags: [mitre:T1071.001, c2, network-anomaly]

  # HTTP (port 80) or unencrypted connection lasting >5 minutes is unusual
  # for interactive HTTP but normal for some streaming. Flag as warning.
  - id: net_long_plaintext_http
    name: "Long-lived unencrypted HTTP connection"
    description: >
      An unencrypted HTTP connection (port 80) remained open for more than
      5 minutes. This may indicate data exfiltration over HTTP or a persistent
      C2 channel disguised as web traffic.
    event_type: net_close
    condition_group:
      operator: and
      conditions:
        - field: dport
          op: equals
          values: ["80"]
        - field: duration_sec
          op: gt
          values: ["300"]
    severity: warning
    action: alert
    tags: [mitre:T1071.001, network-anomaly, exfiltration]

  # HTTPS (port 443) connection lasting extremely long (>1h) may indicate
  # a tunneled C2 channel. Normal HTTPS requests complete in seconds.
  - id: net_long_https_connection
    name: "Extremely long-lived HTTPS connection (>1h)"
    description: >
      An HTTPS connection (port 443) remained open for more than 1 hour.
      While HTTPS keep-alives and streaming are valid, a >1h session from a
      non-browser process is anomalous and may indicate a C2 tunnel.
    event_type: net_close
    condition_group:
      operator: and
      conditions:
        - field: dport
          op: equals
          values: ["443"]
        - field: duration_sec
          op: gt
          values: ["3600"]
    severity: warning
    action: alert
    tags: [mitre:T1071.001, network-anomaly, c2]

  # Very short connections (<100ms) to many different ports are indicative of
  # port scanning. Captured as individual close events with tiny durations.
  # 5.8g (замер №2.4, находка №19 / curl- и crontab-кластеры): a single short
  # connection is common noise from monitoring/health-check tooling (curl,
  # crontab-triggered probes) — the rule's own description already asked for
  # "combine with count-based alerting". threshold requires 5 matches from the
  # same PID within a 10s window before this alerts, so one-off short
  # connections are counted but not alerted, while an actual scan (many ports
  # from one PID in a tight window) still fires.
  - id: net_portscan_indicator
    name: "Port scan indicator — very short connection"
    description: >
      A TCP connection closed within 100 ms on a non-standard port. A burst of
      such events from one PID indicates port scanning activity. Single events
      may be false positives; gated by a count-based threshold (5.8g).
    event_type: net_close
    condition_group:
      operator: and
      conditions:
        - field: duration_ms
          op: lt
          values: ["100"]
        - field: dport
          op: not_in
          values:
            - "22"    # SSH
            - "80"    # HTTP
            - "443"   # HTTPS
            - "53"    # DNS
            - "8080"  # alt HTTP
            - "8443"  # alt HTTPS
        - field: daddr
          op: not_in_cidr
          values: ["127.0.0.0/8", "::1/128"]
        # Wave 6.2.1 (№220): k3s-server's own short-lived control-plane
        # connections (health/readiness probes to kubelet, apiserver, etcd)
        # cleared even this rule's 5-in-10s threshold on the 6.2 baseline —
        # its connection volume alone is scan-shaped.
    threshold:
      count: 5
      window_seconds: 10
      # PID grouping: a port scan keeps one process alive across probes, so the
      # scanner's own PID is the right bucket. group_by: chain exists for the
      # opposite shape (a parent spawning a fresh child per probe) — if замер
      # №2.5 shows the crontab cluster surviving this rule, that is the knob to
      # turn, not the count.
      group_by: pid
    severity: warning
    action: alert
    tags: [mitre:T1046, network-anomaly, portscan]
    exceptions:
      # Волна 6.2.1, продакшен-ужесточение (№220/№221). Фон ноды исключается
      # ТОЛЬКО в хостовом контексте: comm процесс назначает себе сам
      # (prctl(PR_SET_NAME), exec -a), а пустые container_id/pod_name приходят
      # из cgroup и означают «задача не в контейнере». Полезная нагрузка в
      # поде, назвавшая себя "k3s-server", под исключение не попадает и правило
      # её поднимает. Если обогащения нет вовсе (нет k8s/рантайма), поля пусты
      # у ВСЕХ событий и исключение работает как прежний список по comm —
      # ослабление возможно только там, где оси нет физически, и это видно
      # нулём приборности 6.2.1.0, а не молча.
      - name: node-host-daemon
        condition_group:
          operator: and
          conditions:
            # net_close не знает алиаса proc.comm — поле называется comm.
            - field: comm
              op: in
              values: ["k3s-server"]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            # Волна 6.2.1, слой 2 (№220/№221): образ демона. Ось из cgroup выше
            # отвечает только «процесс НЕ в контейнере» и у всех хостовых процессов
            # пуста одинаково — она не отличает демона ноды от чего угодно,
            # запущенного на ней под root с тем же comm. /proc/<pid>/exe ставит ядро
            # в execve: prctl(PR_SET_NAME) и `exec -a` меняют comm и argv[0] и эту
            # ссылку не трогают. Условие СТОИТ ПОСЛЕДНИМ намеренно: группа "and"
            # вычисляется по порядку с коротким замыканием, поэтому readlink
            # случается только там, где имя демона уже совпало.
            #
            # Проверяется КАТАЛОГ образа, а не точный путь, потому что точный путь
            # k3s/containerd зависит от способа установки, а вписать сюда догадку —
            # значит рискнуть тем, что исключение молча перестанет применяться.
            # Ужесточение до точных путей — после того, как контроль 6.2.1.8
            # напечатает фактические exe_path демонов этого стенда. Уже в этой
            # редакции обход требует записи в системный каталог (root + срабатывание
            # evasion_system_binary_replace), а не `cp` в /tmp.
            #
            # Пустой exe_path (процесс умер, нет доступа к /proc) под prefix не
            # подходит — исключение не применяется, правило срабатывает: отказ
            # открытый, в сторону шума, который видно.
            - field: proc.exe_path
              op: prefix
              values: ["/usr/", "/bin/", "/sbin/", "/opt/", "/var/lib/rancher/"]

  # High-frequency connections to the same destination port from one process —
  # a behavioral signal for password spraying / credential-stuffing / brute-force
  # login attempts. These attacks are L7 (HTTP request bodies) and leave no
  # syscall/file trace; connection rate is the only kernel-visible signal.
  # See docs/detection-coverage-l7.md for the full coverage boundary.
  - id: net_high_frequency_connections
    name: "High-frequency connections to same port (possible brute-force)"
    description: >
      A process opened an unusually high number of TCP connections to the same
      destination port within 60 seconds. This is consistent with password
      spraying, credential stuffing, or brute-force login attempts against a
      web/auth endpoint — attacks whose actual payload (failed login attempts)
      is invisible at the syscall/network level without TLS-uprobe parsing.
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: conn_rate_1m
          op: gt
          values: ["30"]
        # Wave 6.2.1 (№220): coredns forwarding to upstream resolvers at
        # cluster query volume is high-frequency-to-same-port by design
        # (76/window on the 6.2 baseline) — not brute-force behavior.
        # k3s-server clears the same conn_rate_1m > 30 threshold on its own
        # control-plane traffic (22/window), found on the second pass over
        # the 6.2 window.
    severity: warning
    action: alert
    tags: [mitre:T1110, brute-force, network-anomaly, behavioral]
    exceptions:
      # Волна 6.2.1, продакшен-ужесточение (№220/№221). Фон ноды исключается
      # ТОЛЬКО в хостовом контексте: comm процесс назначает себе сам
      # (prctl(PR_SET_NAME), exec -a), а пустые container_id/pod_name приходят
      # из cgroup и означают «задача не в контейнере». Полезная нагрузка в
      # поде, назвавшая себя "k3s-server", под исключение не попадает и правило
      # её поднимает. Если обогащения нет вовсе (нет k8s/рантайма), поля пусты
      # у ВСЕХ событий и исключение работает как прежний список по comm —
      # ослабление возможно только там, где оси нет физически, и это видно
      # нулём приборности 6.2.1.0, а не молча.
      - name: node-host-daemon
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: in
              values: ["k3s-server"]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            # Волна 6.2.1, слой 2 (№220/№221): образ демона. Ось из cgroup выше
            # отвечает только «процесс НЕ в контейнере» и у всех хостовых процессов
            # пуста одинаково — она не отличает демона ноды от чего угодно,
            # запущенного на ней под root с тем же comm. /proc/<pid>/exe ставит ядро
            # в execve: prctl(PR_SET_NAME) и `exec -a` меняют comm и argv[0] и эту
            # ссылку не трогают. Условие СТОИТ ПОСЛЕДНИМ намеренно: группа "and"
            # вычисляется по порядку с коротким замыканием, поэтому readlink
            # случается только там, где имя демона уже совпало.
            #
            # Проверяется КАТАЛОГ образа, а не точный путь, потому что точный путь
            # k3s/containerd зависит от способа установки, а вписать сюда догадку —
            # значит рискнуть тем, что исключение молча перестанет применяться.
            # Ужесточение до точных путей — после того, как контроль 6.2.1.8
            # напечатает фактические exe_path демонов этого стенда. Уже в этой
            # редакции обход требует записи в системный каталог (root + срабатывание
            # evasion_system_binary_replace), а не `cp` в /tmp.
            #
            # Пустой exe_path (процесс умер, нет доступа к /proc) под prefix не
            # подходит — исключение не применяется, правило срабатывает: отказ
            # открытый, в сторону шума, который видно.
            - field: proc.exe_path
              op: prefix
              values: ["/usr/", "/bin/", "/sbin/", "/opt/", "/var/lib/rancher/"]
      # Волна 6.2.1, продакшен-ужесточение (№220/№221). Системный под ноды
      # исключается по СВОЕМУ namespace, а не по одному comm: namespace
      # приходит из cgroup→pod, процесс его себе не назначит, а имя
      # "coredns" — назначит. Под в чужом namespace с тем же именем
      # исключения не получает.
      - name: kube-system-pod
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: in
              values: ["coredns"]
            - field: k8s.namespace
              op: eq
              values: ["kube-system"]

  # SSH session lasting more than 72 hours is unusual even for admins.
  - id: net_long_ssh_session
    name: "SSH session lasting more than 72 hours"
    description: >
      An SSH connection (port 22) remained open for more than 72 hours.
      This may indicate a persistent backdoor or an attacker maintaining
      interactive access.
    event_type: net_close
    condition_group:
      operator: and
      conditions:
        - field: dport
          op: equals
          values: ["22"]
        - field: duration_sec
          op: gt
          values: ["259200"]   # 72 hours
    severity: warning
    action: alert
    tags: [mitre:T1021.004, network-anomaly]
