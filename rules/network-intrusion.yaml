# Network Intrusion Detection Rules for ebpf-guard
# Covers reverse shells, port scanning, C2 channels, and tunneling
# MITRE ATT&CK: T1095, T1090, T1048, T1572, T1046

rules:
  # ============================================================================
  # T1059.004 — Reverse Shell Patterns via Network
  # ============================================================================

  - id: netintr_reverse_shell_port_4444
    name: "Outbound connection on common reverse shell port 4444"
    description: "TCP connection to port 4444 — Metasploit default meterpreter/shell listener port."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["4444"]
    severity: critical
    action: alert
    tags: [mitre:T1059.004, reverse-shell, metasploit, c2]

  - id: netintr_reverse_shell_port_1234
    name: "Outbound connection on common reverse shell port 1234"
    description: "TCP connection to port 1234 — commonly used in netcat reverse shell tutorials and malware."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["1234", "5555", "6666", "7777", "8888", "9999"]
    severity: critical
    action: alert
    tags: [mitre:T1059.004, reverse-shell, netcat, c2]

  - id: netintr_reverse_shell_port_31337
    name: "Outbound connection on classic hacker port 31337"
    description: "Connection to port 31337 (elite/leet) — associated with Back Orifice and classic backdoors."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["31337", "12345", "54321"]
    severity: critical
    action: alert
    tags: [mitre:T1059.004, reverse-shell, backdoor, c2]

  - id: netintr_high_port_established
    name: "Non-service process connected on ephemeral high port"
    description: "Connection established to a port > 49152 (ephemeral range) from a non-browser process — suspicious C2 or reverse shell."
    event_type: network
    condition:
      field: dport
      op: gt
      values: ["49152"]
    severity: warning
    action: alert
    tags: [mitre:T1095, reverse-shell, c2, high-port]

  # ============================================================================
  # T1046 — Network Service Discovery (Port Scanning)
  # ============================================================================

  # plan.md wave 5.7 (замер №2.3, находка №12): matches any single connection
  # to a common port (53/80/443/…) with no rate/burst dimension despite the
  # name — grafana's routine DNS resolution and HTTPS notification traffic
  # trips it on ordinary operation. Scoped comm exception, not a port
  # carve-out: an attacker scanning these same ports from any other process
  # still alerts.
  - id: netintr_syn_scan_pattern
    name: "Rapid sequential TCP connections (port scan)"
    description: "Process opening many TCP connections rapidly to different ports — network port scanning."
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: dport
          op: in
          values: ["21", "22", "23", "25", "53", "80", "110", "143", "443", "445", "3389", "5985", "5986"]
        - field: proc.comm
          op: not_in
          values: ["grafana", "prometheus"]
    severity: warning
    action: alert
    tags: [mitre:T1046, network-scan, discovery, reconnaissance]

  - id: netintr_nmap_fingerprint_ports
    name: "Connection to nmap fingerprinting ports"
    description: "Connection to ports commonly targeted by nmap OS fingerprinting scripts — active network reconnaissance."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["7", "9", "13", "17", "19", "37", "111", "135", "139", "445", "1723", "3306", "3389"]
    severity: warning
    action: alert
    tags: [mitre:T1046, nmap, port-scan, reconnaissance]

  - id: netintr_outbound_smb
    name: "Outbound SMB connection (lateral movement indicator)"
    description: "Outbound connection to TCP 445 (SMB) — lateral movement via pass-the-hash, SMB exploitation, or ransomware spreading."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["445", "139"]
    severity: warning
    action: alert
    tags: [mitre:T1021.002, network-scan, smb, lateral-movement]

  # ============================================================================
  # T1090 — Proxy-based C2
  # ============================================================================

  # Wave 6.2.1, №220: 8080 in this list also catches coredns's health-check
  # endpoint (81/window on the 6.2 baseline) — same class as
  # cryptominer_pool_ports above. Excluded by comm, port list left alone.
  # k3s-server has its own slice of the same rule (17/window), added on the
  # second pass over the 6.2 window.
  - id: netintr_socks_proxy_port
    name: "SOCKS proxy connection (potential C2 tunneling)"
    description: "Connection to standard SOCKS proxy ports 1080/1081 — tunneling C2 traffic or internal pivoting."
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: dport
          op: in
          values: ["1080", "1081", "1082", "3128", "8080", "8118", "8888"]
    severity: warning
    action: alert
    tags: [mitre:T1090, socks-proxy, c2-tunneling]
    exceptions:
      # Волна 6.2.1, продакшен-ужесточение (№220/№221). Фон ноды исключается
      # ТОЛЬКО в хостовом контексте: comm процесс назначает себе сам
      # (prctl(PR_SET_NAME), exec -a), а пустые container_id/pod_name приходят
      # из cgroup и означают «задача не в контейнере». Полезная нагрузка в
      # поде, назвавшая себя "k3s-server", под исключение не попадает и правило
      # её поднимает. Если обогащения нет вовсе (нет k8s/рантайма), поля пусты
      # у ВСЕХ событий и исключение работает как прежний список по comm —
      # ослабление возможно только там, где оси нет физически, и это видно
      # нулём приборности 6.2.1.0, а не молча.
      - name: node-host-daemon
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: in
              values: ["k3s-server"]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            # Волна 6.2.1, слой 2 (№220/№221): образ демона. Ось из cgroup выше
            # отвечает только «процесс НЕ в контейнере» и у всех хостовых процессов
            # пуста одинаково — она не отличает демона ноды от чего угодно,
            # запущенного на ней под root с тем же comm. /proc/<pid>/exe ставит ядро
            # в execve: prctl(PR_SET_NAME) и `exec -a` меняют comm и argv[0] и эту
            # ссылку не трогают. Условие СТОИТ ПОСЛЕДНИМ намеренно: группа "and"
            # вычисляется по порядку с коротким замыканием, поэтому readlink
            # случается только там, где имя демона уже совпало.
            #
            # Проверяется КАТАЛОГ образа, а не точный путь, потому что точный путь
            # k3s/containerd зависит от способа установки, а вписать сюда догадку —
            # значит рискнуть тем, что исключение молча перестанет применяться.
            # Ужесточение до точных путей — после того, как контроль 6.2.1.8
            # напечатает фактические exe_path демонов этого стенда. Уже в этой
            # редакции обход требует записи в системный каталог (root + срабатывание
            # evasion_system_binary_replace), а не `cp` в /tmp.
            #
            # Пустой exe_path (процесс умер, нет доступа к /proc) под prefix не
            # подходит — исключение не применяется, правило срабатывает: отказ
            # открытый, в сторону шума, который видно.
            - field: proc.exe_path
              op: prefix
              values: ["/usr/", "/bin/", "/sbin/", "/opt/", "/var/lib/rancher/"]
      # Волна 6.2.1, продакшен-ужесточение (№220/№221). Системный под ноды
      # исключается по СВОЕМУ namespace, а не по одному comm: namespace
      # приходит из cgroup→pod, процесс его себе не назначит, а имя
      # "coredns" — назначит. Под в чужом namespace с тем же именем
      # исключения не получает.
      - name: kube-system-pod
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: in
              values: ["coredns"]
            - field: k8s.namespace
              op: eq
              values: ["kube-system"]

  - id: netintr_dns_over_nonstandard_port
    name: "DNS query on non-standard port (DNS tunneling)"
    description: "DNS-like traffic on a port other than 53 — DNS tunneling tools like iodine/dnscat use non-standard ports."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["5353", "5354", "8053", "4443", "2053"]
    severity: warning
    action: alert
    tags: [mitre:T1048.001, dns-tunnel, c2]

  # ============================================================================
  # T1572 — Protocol Tunneling
  # ============================================================================

  - id: netintr_icmp_outbound_large
    name: "Large ICMP packet (potential ICMP tunnel)"
    description: "ICMP traffic with large payload — ICMP tunneling tools encode data in ping/pong packets for covert C2."
    event_type: network
    condition:
      field: proto
      op: in
      values: ["1"]  # ICMP
    severity: warning
    action: alert
    tags: [mitre:T1572, icmp-tunnel, c2]

  - id: netintr_ssh_non_standard_port
    name: "SSH connection to non-standard port"
    description: >
      An ssh/sshd process established an outbound TCP connection on a port
      other than 22/2222 — SSH tunneling or C2 over a non-standard SSH port.
      Restricted to actual ssh/sshd processes; any other process connecting
      to a non-22 port is not an SSH indicator by itself.
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: proc.comm
          op: in
          values: ["ssh", "sshd"]
        - field: dport
          op: not_in
          values: ["22", "2222"]
        - field: daddr
          op: not_in_cidr
          values: ["127.0.0.0/8", "::1/128"]
    severity: warning
    action: alert
    tags: [mitre:T1572, ssh-tunnel, c2]

  # plan.md wave 5.7 (замер №2.3, находка №12): 9090 is Prometheus's own
  # default scrape port — grafana querying its data source trips this by
  # design. Scoped comm exception; any other process on these ports still
  # alerts.
  - id: netintr_http_on_non_web_port
    name: "HTTP connection on non-standard port"
    description: "Outbound HTTP/HTTPS on unusual port — HTTP C2 channel or reverse proxy for command execution."
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: dport
          op: in
          values: ["8443", "8888", "9090", "9443", "9999", "10443", "4433"]
        - field: proc.comm
          op: not_in
          values: ["grafana", "prometheus"]
    severity: warning
    action: alert
    tags: [mitre:T1572, http-c2, non-standard-port]

  # ============================================================================
  # T1048 — Exfiltration Over Alternative Protocol
  # ============================================================================

  - id: netintr_ftp_data_exfil
    name: "FTP connection for potential data exfiltration"
    description: "Outbound FTP connection (port 20/21) from non-FTP service — data exfiltration over FTP."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["20", "21"]
    severity: warning
    action: alert
    tags: [mitre:T1048.003, ftp, data-exfiltration]

  - id: netintr_smtp_exfil
    name: "SMTP connection for potential data exfiltration"
    description: "Outbound SMTP connection from a non-mail process — email-based data exfiltration."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["25", "465", "587"]
    severity: warning
    action: alert
    tags: [mitre:T1048.002, smtp, data-exfiltration]

  # plan.md wave 5.7 (замер №2.3, находка №12): matches on dport 443 alone,
  # so it fires on every plain HTTPS connection — grafana's own outbound
  # notification/alerting webhooks and metrics push were 89/71min in the
  # docs-audit sample (2026-08-06), the single largest contributor to the
  # idle-hour containerd-shim→grafana "attack" incident. Scoped comm
  # exception, not a blanket dport carve-out: an attacker process using 443
  # for actual exfil still alerts.
  - id: netintr_large_upload_port
    name: "Connection to common data exfiltration services"
    description: "Outbound connection to cloud storage ports used for bulk exfiltration (S3, GCS, Azure Blob)."
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: dport
          op: in
          values: ["443"]
        - field: proc.comm
          op: not_in
          values: ["grafana", "prometheus"]
    severity: warning
    action: alert
    tags: [mitre:T1048, data-exfiltration, cloud-storage]

  # ============================================================================
  # T1095 — Non-Application Layer Protocol (Raw Socket)
  # ============================================================================

  - id: netintr_raw_socket_connection
    name: "Raw socket protocol connection"
    description: "Connection using raw socket (proto=255 or UDP with custom data) — raw socket C2 or custom protocol tunnel."
    event_type: network
    condition:
      field: proto
      op: in
      values: ["255", "41", "43", "47", "50", "51"]  # HOPOPT, IPv6, IPv6-Route, GRE, ESP, AH
    severity: warning
    action: alert
    tags: [mitre:T1095, raw-socket, custom-protocol, c2]

  - id: netintr_gre_tunnel
    name: "GRE tunnel established"
    description: "GRE encapsulation detected — used for VPN tunneling or C2 traffic concealment."
    event_type: network
    condition:
      field: proto
      op: in
      values: ["47"]  # GRE
    severity: warning
    action: alert
    tags: [mitre:T1572, gre-tunnel, c2]

  # ============================================================================
  # Known malware infrastructure ports
  # ============================================================================

  - id: netintr_cobalt_strike_default_port
    name: "Outbound connection to Cobalt Strike default port"
    description: "Connection to TCP 50050 — Cobalt Strike team server default port. May indicate active C2 beacon."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["50050"]
    severity: critical
    action: alert
    tags: [mitre:T1071, cobalt-strike, c2, red-team]

  - id: netintr_covenant_default_port
    name: "Connection to Covenant C2 default port"
    description: "Connection to TCP 7443 — Covenant C2 framework default HTTPS listener port."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["7443"]
    severity: critical
    action: alert
    tags: [mitre:T1071, covenant-c2, c2]

  - id: netintr_brute_ratel_port
    name: "Connection to Brute Ratel C4 default port"
    description: "Connection to TCP 443 on Brute Ratel default listener — adversary simulation C2 framework."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["53311", "8443"]
    severity: critical
    action: alert
    tags: [mitre:T1071, brute-ratel, c2]

  # ============================================================================
  # DNS-based detection
  # ============================================================================

  - id: netintr_dga_domain_query
    name: "DGA (Domain Generation Algorithm) domain queried"
    description: "DNS query for a domain with high DGA score — botnet or malware checking in with generated C2 domain."
    event_type: dns
    condition:
      field: qname_is_dga
      op: equals
      values: ["true"]
    severity: critical
    action: alert
    tags: [mitre:T1568.002, dga, botnet, c2]

  - id: netintr_dns_high_entropy_query
    name: "DNS query with unusually high entropy subdomain"
    description: "High-entropy subdomain in DNS query — possible DNS tunneling or DGA-based C2 beacon."
    event_type: dns
    condition:
      field: qname_entropy
      op: gt
      values: ["4.0"]
    severity: critical
    action: alert
    tags: [mitre:T1048.001, mitre:T1568, dns-tunnel, high-entropy]

  - id: netintr_dns_many_subdomains
    name: "DNS query with excessive subdomain count"
    description: "DNS query with more than 4 subdomains — DNS tunneling packing data into multiple labels."
    event_type: dns
    condition:
      field: qname_subdomain_count
      op: gt
      values: ["4"]
    severity: warning
    action: alert
    tags: [mitre:T1048.001, dns-tunnel, subdomain-exfil]

  - id: netintr_dns_long_label
    name: "Extremely long DNS query name (tunneling)"
    description: "DNS query name exceeding 100 characters — data encoding in DNS label for covert exfiltration."
    event_type: dns
    condition:
      field: qname_length
      op: gt
      values: ["100"]
    severity: critical
    action: alert
    tags: [mitre:T1048.001, dns-tunnel, long-label]

  - id: netintr_dns_high_digit_ratio
    name: "DNS query with high digit ratio (tunneling indicator)"
    description: "DNS subdomain contains many digits — hex-encoded or base32-encoded data in DNS tunnel."
    event_type: dns
    condition:
      field: qname_digit_ratio
      op: gt
      values: ["0.4"]
    severity: warning
    action: alert
    tags: [mitre:T1048.001, dns-tunnel, encoded-data]

  # ============================================================================
  # Internal network C2 (east-west movement)
  # ============================================================================

  - id: netintr_connection_to_multicast
    name: "Outbound connection to multicast range"
    description: "Connection to 224.0.0.0/4 (multicast) — unusual for production workloads, possible C2 covert channel."
    event_type: network
    condition:
      field: daddr
      op: in_cidr
      values: ["224.0.0.0/4"]
    severity: warning
    action: alert
    tags: [mitre:T1095, multicast, covert-channel]

  # 5.6c (замер №2.2, idle-регресс): rule name/description promised "high
  # port" but the condition never checked dport — it fired on every loopback
  # connection, including a health-check's plain `curl http://127.0.0.1:PORT/`.
  # That single network event was enough to supply HasNetworkSignal and
  # corroborate an unrelated file-access cluster into a false
  # incident_confirmed_attack on idle (bash → curl, every 5 min). Added the
  # dport condition the rule always claimed to have; threshold matches the
  # ephemeral-port convention used elsewhere in this file
  # (netintr_high_port_established, > 49152).
  - id: netintr_loopback_high_port
    name: "Connection to loopback on high port (local proxy)"
    description: "Outbound connection to 127.0.0.1 on a high (ephemeral-range) port — local SOCKS proxy or C2 relay tool, not a well-known service port."
    event_type: network
    condition_group:
      operator: and
      conditions:
        - field: daddr
          op: in
          values: ["127.0.0.1", "::1"]
        - field: dport
          op: gt
          values: ["49152"]
    severity: warning
    action: alert
    tags: [mitre:T1090, loopback, proxy, local-relay]

  # ============================================================================
  # Long-lived connection detection
  # ============================================================================

  # plan.md wave 5.7 (замер №2.3, находка №12): grafana keeps a long-lived
  # resolver connection open for its own periodic upstream health checks
  # (128/71min in docs-audit 2026-08-06) — indistinguishable from tunneling
  # by duration alone. Scoped comm exception so an attacker's actual
  # DNS-over-TCP tunnel still alerts regardless of process name.
  - id: netintr_long_dns_session
    name: "Extremely long-lived DNS connection (tunneling)"
    description: "DNS TCP connection lasting more than 60 seconds — DNS-over-TCP tunnel for C2 or exfiltration."
    event_type: net_close
    condition_group:
      operator: and
      conditions:
        - field: duration_sec
          op: gt
          values: ["60"]
        - field: comm
          op: not_in
          values: ["grafana", "prometheus"]
    severity: warning
    action: alert
    tags: [mitre:T1048.001, dns-tunnel, long-connection]

  - id: netintr_persistent_c2_beacon
    name: "Very long-lived outbound connection (C2 beacon)"
    description: "Outbound TCP connection lasting over 1 hour — likely a persistent C2 beacon or data exfiltration session."
    event_type: net_close
    condition:
      field: duration_sec
      op: gt
      values: ["3600"]
    severity: critical
    action: alert
    tags: [mitre:T1571, c2-beacon, persistent-connection]

  - id: netintr_rdp_outbound
    name: "Outbound RDP connection (lateral movement)"
    description: "Outbound TCP 3389 (RDP) — lateral movement to Windows systems or jumping through compromised hosts."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["3389", "3388"]
    severity: warning
    action: alert
    tags: [mitre:T1021.001, rdp, lateral-movement]

  - id: netintr_vnc_outbound
    name: "Outbound VNC connection"
    description: "Outbound TCP 5900-5910 (VNC) — remote desktop lateral movement or attacker C2 tunnel."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["5900", "5901", "5902", "5903", "5904", "5905"]
    severity: warning
    action: alert
    tags: [mitre:T1021.005, vnc, lateral-movement]
