rules:
  # MITRE ATT&CK: T1548.001 — Abuse Elevation Control Mechanism: Setuid and Setgid
  # Fires when any process gains CAP_SYS_ADMIN at runtime after initialisation.
  - id: privesc_sys_admin_gained
    name: "CAP_SYS_ADMIN gained at runtime"
    description: >
      A process gained CAP_SYS_ADMIN after startup. This capability allows
      mounting filesystems, loading kernel modules, and bypassing many security
      controls. Gaining it at runtime is a strong indicator of privilege
      escalation or container escape.
    event_type: privesc
    condition:
      field: caps
      op: caps_gained
      values:
        - CAP_SYS_ADMIN
    severity: critical
    action: alert
    tags: [mitre:T1548.001, container-escape, privesc]

  # CAP_NET_RAW allows raw socket creation (packet sniffing, ARP spoofing).
  # Gaining it outside container init is suspicious.
  - id: privesc_net_raw_gained
    name: "CAP_NET_RAW gained outside container init"
    description: >
      A process gained CAP_NET_RAW at runtime. This capability enables raw
      socket creation and is commonly abused for network sniffing and ARP
      spoofing. Legitimate containers set this at startup, not at runtime.
    event_type: privesc
    condition:
      field: caps
      op: caps_gained
      values:
        - CAP_NET_RAW
    severity: warning
    action: alert
    tags: [mitre:T1548.001, privesc, network]

  # CAP_SYS_MODULE allows loading/unloading kernel modules (rootkit path).
  - id: privesc_sys_module_gained
    name: "CAP_SYS_MODULE gained at runtime"
    description: >
      A process gained CAP_SYS_MODULE, allowing it to load arbitrary kernel
      modules. This is the primary rootkit installation path on Linux.
    event_type: privesc
    condition:
      field: caps
      op: caps_gained
      values:
        - CAP_SYS_MODULE
    severity: critical
    action: alert
    tags: [mitre:T1547.006, privesc, rootkit]

  # CAP_SYS_PTRACE allows tracing other processes (credential theft).
  - id: privesc_sys_ptrace_gained
    name: "CAP_SYS_PTRACE gained at runtime"
    description: >
      A process gained CAP_SYS_PTRACE, enabling it to inspect and modify
      the memory of other processes. Often used for credential theft or
      injecting code into running services.
    event_type: privesc
    condition:
      field: caps
      op: caps_gained
      values:
        - CAP_SYS_PTRACE
    severity: critical
    action: alert
    tags: [mitre:T1548.001, mitre:T1055, privesc]

  # Drop-all then re-gain is an evasion pattern: process deliberately drops
  # all caps (to appear unprivileged to monitors) then re-acquires them.
  - id: privesc_caps_drop_all
    name: "Process dropped all capabilities (evasion pattern)"
    description: >
      A process dropped all capabilities simultaneously. Combined with a
      subsequent cap gain, this is a known evasion technique to temporarily
      appear unprivileged to security monitors while retaining the ability
      to re-acquire privileges.
    event_type: privesc
    condition:
      field: caps
      op: caps_dropped
      values:
        - CAP_SYS_ADMIN
        - CAP_NET_ADMIN
        - CAP_SYS_MODULE
        - CAP_SYS_PTRACE
        - CAP_NET_RAW
    severity: warning
    action: alert
    tags: [mitre:T1548.001, privesc, evasion]

  # Gaining SETUID/SETGID allows changing to any UID/GID.
  - id: privesc_setuid_gained
    name: "CAP_SETUID or CAP_SETGID gained at runtime"
    description: >
      A process gained CAP_SETUID or CAP_SETGID, enabling it to change its
      effective user or group identity to any value including root (UID 0).
    event_type: privesc
    condition:
      field: caps
      op: caps_gained
      values:
        - CAP_SETUID
        - CAP_SETGID
    severity: critical
    action: alert
    tags: [mitre:T1548.001, privesc]

  # ============================================================================
  # T1548.002 — Abuse Elevation Control Mechanism: Bypass User Account Control
  # Additional dangerous capability combinations
  # ============================================================================

  # CAP_NET_ADMIN allows full network stack manipulation: routing, iptables,
  # interface configuration. Gaining it at runtime enables traffic interception.
  - id: privesc_net_admin_gained
    name: "CAP_NET_ADMIN gained at runtime"
    description: >
      A process gained CAP_NET_ADMIN at runtime. This capability grants full
      control over network interfaces, routing tables, and packet filtering —
      enabling traffic interception, ARP poisoning, and network namespace
      manipulation (T1548.002). Legitimate containers configure this at init.
    event_type: privesc
    condition:
      field: caps
      op: caps_gained
      values:
        - CAP_NET_ADMIN
    severity: warning
    action: alert
    tags: [mitre:T1548.002, privesc, network, lateral-movement]

  # CAP_SYS_CHROOT allows chroot() to any directory — a container escape vector.
  - id: privesc_sys_chroot_gained
    name: "CAP_SYS_CHROOT gained at runtime"
    description: >
      A process gained CAP_SYS_CHROOT, allowing unrestricted chroot calls.
      Combined with a mount or pivot_root this is a container filesystem
      escape vector. Should never be gained at runtime in hardened deployments.
    event_type: privesc
    condition:
      field: caps
      op: caps_gained
      values:
        - CAP_SYS_CHROOT
    severity: warning
    action: alert
    tags: [mitre:T1548.002, mitre:T1611, privesc, chroot, container-escape]

  # ============================================================================
  # T1611 — Escape to Host: Namespace Escape via setns / unshare
  # ============================================================================

  # setns(2) enters an existing namespace (pid, net, mnt, uts, ipc, user).
  # Calling setns to join another process's namespaces (particularly the init
  # process's network/mnt namespace) is a container escape primitive.
  - id: privesc_setns_syscall
    name: "Privilege Escalation: setns syscall (namespace entry)"
    description: >
      A process called setns(2) to enter another namespace. In containerised
      environments, entering the host's mount or network namespace (by joining
      PID 1's namespaces) is the core step of a T1611 container escape attempt.
      Legitimate callers include nsenter and container runtime shims.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["308"]   # __NR_setns (x86-64)
        # 5.9.3c (#47): nsenter(1) is the tool this rule's own description
        # names as a legitimate caller during normal `kubectl exec`/`docker
        # exec` sessions (same predicate as container_escape_nsenter in
        # container-escape.yaml, which does NOT exclude nsenter — that rule
        # exists specifically to catch nsenter used as an escape technique;
        # this one is the setns() primitive itself). Left as a plain comm
        # exclusion, unrelated to item 6/№250 below.
        - field: comm
          op: not_in
          values: ["nsenter"]
    severity: critical
    action: alert
    tags: [mitre:T1611, mitre:T1548.002, privesc, setns, namespace-escape, container-escape]
    exceptions:
      # Волна 6.2.3, item 6 (№250, решение 5). comm not_in, ранее стоявший в
      # condition_group выше, ловил только ЛИТЕРАЛЬНОЕ "runc"/"containerd-shim"
      # и молчал на "runc:[1:CHILD]"/"runc:[2:INIT]" — comm, который реально
      # несёт namespace-setup child рантайма (W623_NODE_ACTORS,
      # wave6.2.3-controls.sh). Штатный жизненный цикл контейнера уже сегодня
      # поднимал этот алерт, и инцидентный слой засчитывал его подтверждённой
      # атакой (finding №250). Перенесено сюда: объём виден в
      # ebpf_guard_rule_exceptions_total, а не тонет немым исключением внутри
      # условия; ключ — cgroup-идентичность (container.id/k8s.pod), без
      # exe_path-слоя (см. комментарий внутри блока: короткоживущие процессы).
      - name: container-runtime-lifecycle
        condition_group:
          operator: and
          conditions:
            - field: comm
              op: in
              values: ["runc", "runc:[0:PARENT]", "runc:[1:CHILD]",
                       "runc:[2:INIT]", "containerd-shim",
                       "containerd-shim-runc-v2", "containerd",
                       "dockerd", "conmon", "crun"]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            # Слой 2 (exe_path) НЕ добавлен здесь, в отличие от node-host-daemon
            # (command-and-control.yaml) — живая проверка на ebaka2 06.09.2026
            # показала, что "runc:[1:CHILD]"/"runc:[2:INIT]" успевают
            # завершиться до асинхронного вычисления исключения: live
            # readlink "/proc/<pid>/exe" находит уже ничего, resolveExePath
            # возвращает "" и по документированному fail-open (rules.go)
            # исключение НЕ применяется — то есть слой 2 в этом виде не
            # подавлял НИ ОДНОГО реального runc:[1:CHILD]/[2:INIT] на живом
            # узле (0 из 5 таких алертов ушли в exceptions). Защита от
            # хостового спуфа здесь остаётся только на comm+cgroup — тот же
            # класс обхода, что уже открыт для литерального comm-списка в
            # главном condition_group (открытый вопрос 7, plan.md).
      # Волна 6.2.3, ОТКРЫТЫЙ ВОПРОС 2 (№250, живая проверка item 6 на ebaka2
      # 06.09.2026). container-runtime-lifecycle выше ключуется на ПУСТЫХ
      # container.id/k8s.pod — и эта ось живьём оказалась нестабильной ровно
      # в том окне, ради которого её брали: у runc:[1:CHILD]/[2:INIT]
      # cgroup-привязка пуста на РАННИХ syscall'ах установки контейнера
      # (unshare) и уже ЗАПОЛНЕНА целевым container_id к моменту поздних
      # (pivot_root — по построению ПОСЛЕДНИЙ шаг переключения rootfs, часть
      # setns — уже после привязки к cgroup). Живой под дал
      # container_escape_pivot_root 2 алерта / 0 подавлений (0%,
      # систематически) и privesc_setns_syscall 5 / 12 (частично). Процесс,
      # который САМ ПРЯМО СЕЙЧАС строит cgroup-принадлежность контейнера,
      # не опознаётся по её отсутствию — она у него меняется по ходу.
      #
      # Ось этого исключения — РОДИТЕЛЬ, а не cgroup. parent_comm читается в
      # ядре из task_struct->real_parent на каждом событии
      # (bpf/common.h, fill_common_fields): поле УЖЕ в событии, стоит ноль
      # дополнительных syscall'ов при вычислении исключения и не зависит от
      # того, жив ли ещё процесс к моменту асинхронной корреляции. Это и был
      # дефект отвергнутого слоя proc.exe_path — resolveExePath делает live
      # readlink("/proc/<pid>/exe"), на короткоживущем child'е получает
      # ENOENT и по fail-open не применяет исключение (0 из 5 живых случаев).
      # Namespace-setup child рантайма всегда форкнут своим же рантаймом:
      # runc:[2:INIT] ← runc:[1:CHILD] ← runc:[0:PARENT] ← containerd-shim.
      #
      # ОТДЕЛЬНЫМ ИМЕНЕМ, а не расширением container-runtime-lifecycle:
      # ebpf_guard_rule_exceptions_total разделяет их по label exception, и
      # прогон видит числом, сколько сняла каждая ось — ранняя фаза (cgroup)
      # против поздней (родитель). Порядок тоже часть контракта: lifecycle
      # стоит ПЕРВЫМ, поэтому счётчик lineage показывает ровно тот остаток,
      # который cgroup-ось не взяла, — величину, которой эта правка и
      # доказывается. Слияние в одно имя спрятало бы её.
      - name: container-runtime-lineage
        condition_group:
          operator: and
          conditions:
            - field: comm
              op: in
              values: ["runc", "runc:[0:PARENT]", "runc:[1:CHILD]",
                       "runc:[2:INIT]", "containerd-shim",
                       "containerd-shim-runc-v2", "containerd",
                       "dockerd", "conmon", "crun"]
            - field: parent_comm
              op: in
              values: ["runc", "runc:[0:PARENT]", "runc:[1:CHILD]",
                       "runc:[2:INIT]", "containerd-shim",
                       "containerd-shim-runc-v2", "containerd",
                       "dockerd", "conmon", "crun"]
      # Волна 6.2.3, ОТКРЫТЫЙ ВОПРОС 2(б) — побочный источник, вскрытый живой
      # проверкой item 6 и НЕ входивший в пять правил решения 5.
      #
      # Тот же пятисекундный отрезок создания пода, что дал runc-шум, дал
      # ещё 4 алерта этого правила с comm=bridge и comm=loopback — CNI-плагины
      # flannel. setns(2) — их штатный механизм: kubelet/containerd вызывает
      # плагин, тот входит в сетевой namespace пода, чтобы подключить туда
      # veth-конец, и выходит. Класс шума ровно тот же, что решение 5 закрывает
      # для runc/containerd-shim — легитимный жизненный цикл пода, — но
      # плагины в список решения 5 не входили и находкой №250 не именовались,
      # поэтому оно их не сняло бы никогда.
      #
      # Решено внести их в scope волны ОТДЕЛЬНЫМ ИМЕНЕМ, а не расширять
      # container-runtime-lifecycle: источники разные (сеть пода против его
      # rootfs/namespace'ов), и разбивка 6.2.3.2 обязана показывать их
      # раздельно — иначе снижение по одной оси спрячет рост по другой.
      #
      # Три слоя, все три — поля, уже лежащие в событии (ноль syscall'ов на
      # вычисление, в отличие от отвергнутого proc.exe_path):
      #   1. comm — имя плагина по спецификации CNI (это имя бинаря в
      #      /opt/cni/bin, а не произвольная строка);
      #   2. parent_comm — плагин ВСЕГДА форкнут своим вызывающим
      #      (containerd/flanneld/kubelet), сам себя не запускает;
      #   3. container.id пуст — плагин работает В ХОСТОВОЙ cgroup вызывающего,
      #      а не в cgroup пода. Здесь эта ось СТАБИЛЬНА, в отличие от
      #      runc:[1:CHILD] (открытый вопрос 2): плагин не строит
      #      cgroup-привязку контейнера, он только входит в его сетевой
      #      namespace, поэтому его собственная cgroup за время вызова не
      #      меняется. Именно поэтому cgroup-слой оставлен здесь и убран там.
      - name: cni-plugin-lifecycle
        condition_group:
          operator: and
          conditions:
            - field: comm
              op: in
              values: ["bridge", "loopback", "host-local", "portmap",
                       "bandwidth", "firewall", "tuning", "ptp", "vlan",
                       "macvlan", "ipvlan", "flannel", "host-device",
                       "static", "dhcp", "sbr", "vrf"]
            - field: parent_comm
              op: in
              values: ["containerd", "containerd-shim", "containerd-shim-runc-v2",
                       "flanneld", "flannel", "kubelet", "k3s-server", "k3s-agent",
                       "dockerd", "crio", "multus", "calico-node"]
            - field: container.id
              op: eq
              values: [""]

  # unshare(2) creates new namespaces for the calling process.  Creating a new
  # user namespace (CLONE_NEWUSER) gives the process root inside it — enabling
  # privilege escalation via nested user namespaces.
  - id: privesc_unshare_user_ns
    name: "Privilege Escalation: unshare syscall (new user namespace)"
    description: >
      A process called unshare(2) to create new namespaces. Creating a user
      namespace (CLONE_NEWUSER) with CLONE_NEWNS allows mounting arbitrary
      filesystems inside the new namespace and is the basis of several CVE-
      class container escapes (CVE-2019-5736, CVE-2022-0492). Legitimate
      use is restricted to container runtime setup only.
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["272"]   # __NR_unshare (x86-64)
        # 5.9.3c (#47) стоял здесь как `comm not_in ["runc", ...]` и снят
        # волной 6.2.3 (ОТКРЫТЫЙ ВОПРОС 7). Он ловил только ЛИТЕРАЛЬНОЕ имя,
        # и это был не сузивший, а ОБХОДИМЫЙ фильтр: под, назвавший свой
        # процесс буквально "runc", не поднимал это правило ВООБЩЕ — условие
        # не совпадало, до исключений дело не доходило, и обход не оставлял
        # следа ни в одной метрике. Немой обход хуже видимого шума.
        #
        # Вся идентичность рантайма перенесена в exceptions ниже
        # (container-runtime-lifecycle + container-runtime-lineage). Разница
        # принципиальная, а не стилистическая:
        #   * подавление теперь СЧИТАЕТСЯ поимённо в
        #     ebpf_guard_rule_exceptions_total{exception=...} — величина видна,
        #     а не исчезает (решение 1 волны 6.2.3: сужение не имеет права
        #     работать сокрытием);
        #   * спуфящему поду мало назвать себя "runc": исключение требует
        #     ЛИБО пустой cgroup-привязки (её у процесса внутри пода нет),
        #     ЛИБО родителя из того же списка рантаймов. Ни одно из двух
        #     изнутри пода не выполняется, и правило поднимается — то есть
        #     обход закрыт, а не перенесён.
        # Цена: базовое условие теперь совпадает на каждом вызове этого
        # syscall'а, а не только на не-рантаймовых, и исключения считаются
        # чаще. Синтетика: unshare/pivot_root/setns происходят на старте
        # контейнера, единицы в секунду на ноде, а исключение — два сравнения
        # строк по полям, уже лежащим в событии (никаких readlink/proc).
    severity: warning
    action: alert
    tags: [mitre:T1611, mitre:T1548.002, privesc, unshare, user-namespace, container-escape]
    exceptions:
      # Волна 6.2.3, item 6 (№250, решение 5). comm not_in above catches only
      # the LITERAL "runc" and stayed silent on "runc:[1:CHILD]"/
      # "runc:[2:INIT]" — the comm the runtime's own namespace-setup child
      # actually reports (W623_NODE_ACTORS, wave6.2.3-controls.sh). Штатный
      # жизненный цикл контейнера уже сегодня поднимал этот алерт, и
      # инцидентный слой засчитывал его подтверждённой атакой (finding №250).
      # Перенесено сюда: объём виден в ebpf_guard_rule_exceptions_total, а не
      # тонет немым исключением внутри условия; ключ — cgroup-идентичность
      # (container.id/k8s.pod), без exe_path-слоя (см. комментарий внутри блока).
      - name: container-runtime-lifecycle
        condition_group:
          operator: and
          conditions:
            - field: comm
              op: in
              values: ["runc", "runc:[0:PARENT]", "runc:[1:CHILD]",
                       "runc:[2:INIT]", "containerd-shim",
                       "containerd-shim-runc-v2", "containerd",
                       "dockerd", "conmon", "crun"]
            - field: container.id
              op: eq
              values: [""]
            - field: k8s.pod
              op: eq
              values: [""]
            # Слой 2 (exe_path) НЕ добавлен здесь, в отличие от node-host-daemon
            # (command-and-control.yaml) — живая проверка на ebaka2 06.09.2026
            # показала, что "runc:[1:CHILD]"/"runc:[2:INIT]" успевают
            # завершиться до асинхронного вычисления исключения: live
            # readlink "/proc/<pid>/exe" находит уже ничего, resolveExePath
            # возвращает "" и по документированному fail-open (rules.go)
            # исключение НЕ применяется — то есть слой 2 в этом виде не
            # подавлял НИ ОДНОГО реального runc:[1:CHILD]/[2:INIT] на живом
            # узле (0 из 5 таких алертов ушли в exceptions). Защита от
            # хостового спуфа здесь остаётся только на comm+cgroup — тот же
            # класс обхода, что уже открыт для литерального comm-списка в
            # главном condition_group (открытый вопрос 7, plan.md).
      # Волна 6.2.3, ОТКРЫТЫЙ ВОПРОС 2 (№250, живая проверка item 6 на ebaka2
      # 06.09.2026). container-runtime-lifecycle выше ключуется на ПУСТЫХ
      # container.id/k8s.pod — и эта ось живьём оказалась нестабильной ровно
      # в том окне, ради которого её брали: у runc:[1:CHILD]/[2:INIT]
      # cgroup-привязка пуста на РАННИХ syscall'ах установки контейнера
      # (unshare) и уже ЗАПОЛНЕНА целевым container_id к моменту поздних
      # (pivot_root — по построению ПОСЛЕДНИЙ шаг переключения rootfs, часть
      # setns — уже после привязки к cgroup). Живой под дал
      # container_escape_pivot_root 2 алерта / 0 подавлений (0%,
      # систематически) и privesc_setns_syscall 5 / 12 (частично). Процесс,
      # который САМ ПРЯМО СЕЙЧАС строит cgroup-принадлежность контейнера,
      # не опознаётся по её отсутствию — она у него меняется по ходу.
      #
      # Ось этого исключения — РОДИТЕЛЬ, а не cgroup. parent_comm читается в
      # ядре из task_struct->real_parent на каждом событии
      # (bpf/common.h, fill_common_fields): поле УЖЕ в событии, стоит ноль
      # дополнительных syscall'ов при вычислении исключения и не зависит от
      # того, жив ли ещё процесс к моменту асинхронной корреляции. Это и был
      # дефект отвергнутого слоя proc.exe_path — resolveExePath делает live
      # readlink("/proc/<pid>/exe"), на короткоживущем child'е получает
      # ENOENT и по fail-open не применяет исключение (0 из 5 живых случаев).
      # Namespace-setup child рантайма всегда форкнут своим же рантаймом:
      # runc:[2:INIT] ← runc:[1:CHILD] ← runc:[0:PARENT] ← containerd-shim.
      #
      # ОТДЕЛЬНЫМ ИМЕНЕМ, а не расширением container-runtime-lifecycle:
      # ebpf_guard_rule_exceptions_total разделяет их по label exception, и
      # прогон видит числом, сколько сняла каждая ось — ранняя фаза (cgroup)
      # против поздней (родитель). Порядок тоже часть контракта: lifecycle
      # стоит ПЕРВЫМ, поэтому счётчик lineage показывает ровно тот остаток,
      # который cgroup-ось не взяла, — величину, которой эта правка и
      # доказывается. Слияние в одно имя спрятало бы её.
      - name: container-runtime-lineage
        condition_group:
          operator: and
          conditions:
            - field: comm
              op: in
              values: ["runc", "runc:[0:PARENT]", "runc:[1:CHILD]",
                       "runc:[2:INIT]", "containerd-shim",
                       "containerd-shim-runc-v2", "containerd",
                       "dockerd", "conmon", "crun"]
            - field: parent_comm
              op: in
              values: ["runc", "runc:[0:PARENT]", "runc:[1:CHILD]",
                       "runc:[2:INIT]", "containerd-shim",
                       "containerd-shim-runc-v2", "containerd",
                       "dockerd", "conmon", "crun"]
      # 5.9.9.F.3c (№133): systemd sandboxing (PrivateTmp/PrivateDevices/
      # ProtectSystem) makes every unit's forked child call unshare() to
      # build its own namespace at startup — same structural predicate as
      # container_escape_unshare_user in container-escape.yaml (direct child
      # of pid 1, comm reported in kernel's parenthesized "(name)" form),
      # not a literal comm list, which would be the №111 defect again.
      - name: systemd-sandbox-child
        condition_group:
          operator: and
          conditions:
            - field: ppid
              op: eq
              values: ["1"]
            - field: comm
              op: regex
              values: ["^\\(.*\\)$"]
      # 5.9.9.F.3c, ревизия по предпрогону №2.9.9.F.3 (2026-08-26): the child
      # shape above covers only half of a unit start. pid 1 ITSELF calls
      # mount()/umount2() while assembling and tearing down that unit's
      # sandbox, and `systemctl start man-db.service` on the stand raised
      # exactly one alert — container_escape_cap_sys_admin pid=1 comm=systemd —
      # which is precisely the Δ=0 the wave's own negative control requires.
      # The predicate is pid, not comm: pid 1 is host init by construction and
      # cannot be spoofed, whereas a comm list would break on the next init
      # (the №111 defect this point exists to avoid). An escape performed BY
      # host init is not an escape: that process already owns the host.
      - name: systemd-init-self
        condition:
          field: pid
          op: eq
          values: ["1"]

  # ============================================================================
  # T1548.001 — SUID Binary Abuse
  # ============================================================================

  # SUID binaries execute as their owner (often root) regardless of the caller's
  # UID. Executing SUID binaries not in the known-good list from suspicious
  # parent processes is a T1548.001 escalation pattern.
  # 5.9.9.F.3b (#132): named "SUID binary executed" and scored critical, but
  # neither half was checked. The collector has no chmod/fchmod hook and the
  # FileEvent.Mode field is open(2)'s requested creation mode, not a stat of
  # the file's actual permission bits — the SUID bit (04000, set by a later
  # chmod in the real attack path) is not observable at all, so the SUID half
  # cannot be restored.
  # 5.9.9.F.3 audit (2026-08-26): the first pass kept the rule on file events
  # as a path-only heuristic with an honest name. That satisfied neither its
  # own acceptance criterion nor the point of the finding: every one of the 37
  # false criticals was an ordinary open/read of an ordinary file under /tmp,
  # and a rename leaves all 37 in place as warnings — the negative control of
  # the wave (create and read a plain text file under /tmp -> Δ must be 0)
  # fails by construction on any file-typed path rule. The exec half, unlike
  # the SUID half, IS observable: proc.args is populated for execve/execveat
  # syscall events (internal/collector/syscall.go, readProcCmdline) and is
  # what the exec_from_tmp companion rule already runs on live. The rule is
  # therefore an exec rule now: argv[0] under a world-writable path. It is
  # deliberately wider than exec_from_tmp (home directories and /run/user/*),
  # and stays "warning" because the SUID bit is still unverified.
  - id: privesc_suid_suspicious_path
    name: "Binary executed from a world-writable path"
    description: >
      A process was executed whose own argv[0] lies under /tmp, /var/tmp,
      /dev/shm, a user home directory, or /run/user/* — the planting half of
      T1548.001 (a SUID root helper dropped into a writable directory and run
      from there). The SUID bit itself is NOT verified: the collector observes
      neither chmod/fchmod nor a file's actual mode bits, so this is
      "executed from a writable path", not "executed a SUID binary".
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "^/tmp/[^/]+"
        - "^/var/tmp/[^/]+"
        - "^/dev/shm/[^/]+"
        - "^/home/[^/]+/[^/]+"
        - "^/run/user/[0-9]+/[^/]+"
    severity: warning
    action: alert
    tags: [mitre:T1548.001, privesc, suid, filesystem-escape]
    exceptions:
      # Scoped to comm AND path: anything the measurer itself execs out of its
      # own /tmp/ebpf-guard-* fixture tree is self-noise, not a finding. The
      # predecessor of this exception was scoped to the single literal
      # /tmp/.secret_key on the file-typed version of the rule (canary lure);
      # both paths are kept so the exception still covers a lure re-exec.
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: proc.args
              op: prefix
              values: ["/tmp/ebpf-guard-", "/tmp/.secret_key"]

  # ============================================================================
  # cgroup v2 escape — writing notify_on_release (T1611)
  # ============================================================================

  # The cgroup notify_on_release file executes the release_agent script when
  # a cgroup becomes empty. Writing to this file from inside a container (or
  # writing to release_agent) is the root-level cgroup escape technique
  # (CVE-2022-0492 class).
  - id: privesc_cgroup_notify_on_release
    name: "Privilege Escalation: cgroup notify_on_release write (T1611)"
    description: >
      A process wrote to a cgroup notify_on_release or release_agent file.
      This is the core mechanism of the cgroup v1/v2 container escape: a
      process migrates to a cgroup, enables notification, triggers an empty
      cgroup, and the release_agent runs on the host with root privileges.
      Corresponds to CVE-2022-0492 and related cgroup escape CVEs.
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/sys/fs/cgroup/.*/notify_on_release"
        - "/sys/fs/cgroup/.*/release_agent"
    severity: critical
    action: block
    tags: [mitre:T1611, privesc, cgroup, cgroup-escape, container-escape, cve]
