# Sigma-derived Linux detection rules for ebpf-guard
# Based on SigmaHQ linux/ rule categories — converted and validated
# MITRE ATT&CK coverage: T1059, T1053, T1543, T1105, T1036, T1070, T1218, T1222

rules:
  # ============================================================================
  # T1059.004 — Command and Scripting Interpreter: Unix Shell
  # ============================================================================

  - id: sigma_shell_from_unexpected_parent
    name: "Shell spawned from unexpected parent process"
    description: "A shell (bash/sh/zsh/dash) was executed by a process that does not normally spawn shells. Common indicator of exploitation or RCE."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["59"]  # execve
        - field: comm
          op: regex
          values: ["^sh$", "^bash$", "^dash$", "^zsh$", "^ksh$"]
        # 5.9.3b (#47): the "unexpected parent" half of the rule was never
        # enforced — bare nr matched every execve on the box.
        #
        # 5.9.3f (#50): list verified against live values on the stand
        # (clean 120 s window, 2026-08-20) — this rule and
        # c2_ingress_piped_to_shell produced 28 of 31 idle alerts, all of
        # them a shell whose parent is another shell: the incident chains
        # were `cron -> cron -> sh -> sh` and
        # `sshd -> sshd -> sh -> run-parts -> 97-overlayroot -> egrep`.
        # A shell IS a process that normally spawns shells — every script
        # does it — so the shells belong in this list. The first hop of a
        # real exploitation chain (nginx -> sh, php-fpm -> bash) is
        # unaffected: its parent is the web server, not a shell.
        - field: parent_comm
          op: not_in
          values: ["sshd", "cron", "systemd", "run-parts", "login", "su", "sudo",
                    "sh", "bash", "dash", "zsh", "ksh"]
    severity: warning
    action: alert
    tags: [mitre:T1059.004, sigma, shell-spawn, execution]

  - id: sigma_reverse_shell_named_pipe
    name: "Named pipe used for reverse shell"
    description: "Process created a named pipe under /tmp or /dev/shm — common reverse shell technique using mkfifo."
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/tmp/[a-zA-Z0-9_-]{1,20}$"
        - "/dev/shm/[a-zA-Z0-9_-]{1,20}$"
        - "/var/tmp/[a-zA-Z0-9_-]{1,20}$"
    severity: warning
    action: alert
    tags: [mitre:T1059.004, sigma, reverse-shell, named-pipe]

  - id: sigma_base64_execution_shell
    name: "Base64-encoded command in shell argument"
    description: "Shell invoked with base64-encoded payload — common obfuscation technique for initial execution payloads."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "base64 -d"
        - "base64 --decode"
        - "\\|\\s*base64"
        - "echo .* \\| bash"
    severity: critical
    action: alert
    tags: [mitre:T1059.004, mitre:T1027, sigma, obfuscation, base64]

  - id: sigma_script_dropper_via_curl
    name: "Script downloaded and executed via curl pipe"
    description: "curl or wget output piped directly into sh/bash — common dropper pattern used in initial access."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "curl.*\\|.*sh"
        - "curl.*\\|.*bash"
        - "wget.*\\|.*sh"
        - "wget.*\\|.*bash"
        - "curl.*\\|.*python"
        - "curl.*\\|.*perl"
    severity: critical
    action: alert
    tags: [mitre:T1059.004, mitre:T1105, sigma, dropper, initial-access]

  - id: sigma_python_exec_shell
    name: "Python used to execute shell commands"
    description: "Python interpreter invoked with os.system, subprocess.call, or pty.spawn — common in post-exploit enumeration."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "python.*os\\.system"
        - "python.*subprocess"
        - "python.*pty\\.spawn"
        - "python.*import os.*exec"
    severity: warning
    action: alert
    tags: [mitre:T1059.006, sigma, python, shell-execution]

  - id: sigma_perl_shell_execution
    name: "Perl used to execute shell commands"
    description: "Perl interpreter used for command execution via system() or exec() — GTFOBin technique."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "perl.*system\\("
        - "perl.*exec\\("
        - "perl -e.*\\$_"
        - "perl.*\\|.*sh"
    severity: warning
    action: alert
    tags: [mitre:T1059, sigma, perl, gtfobins]

  - id: sigma_ruby_shell_execution
    name: "Ruby used to execute shell commands"
    description: "Ruby interpreter used for shell command execution — common GTFOBin and post-exploit technique."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "ruby.*exec\\("
        - "ruby.*system\\("
        - "ruby -e.*Kernel\\.exec"
        - "ruby.*IO\\.popen"
    severity: warning
    action: alert
    tags: [mitre:T1059, sigma, ruby, gtfobins]

  # ============================================================================
  # T1053.003 — Scheduled Task/Job: Cron
  # ============================================================================

  - id: sigma_cron_job_created
    name: "New cron job created in system directory"
    description: "A file was written to /etc/cron.d/, /etc/cron.daily/, /etc/cron.hourly/, or similar — persistence mechanism."
    event_type: file
    condition:
      field: filename
      op: prefix
      values:
        - "/etc/cron.d/"
        - "/etc/cron.daily/"
        - "/etc/cron.hourly/"
        - "/etc/cron.weekly/"
        - "/etc/cron.monthly/"
        - "/var/spool/cron/"
    severity: critical
    action: alert
    tags: [mitre:T1053.003, sigma, cron, persistence]

  - id: sigma_crontab_modification
    name: "crontab file directly modified"
    description: "The system crontab file /etc/crontab was written — direct persistence without cron.d."
    event_type: file
    condition:
      field: filename
      op: in
      values:
        - "/etc/crontab"
        - "/etc/cron.allow"
        - "/etc/cron.deny"
    severity: critical
    action: alert
    tags: [mitre:T1053.003, sigma, crontab, persistence]

  # ============================================================================
  # T1543.002 — Create or Modify System Process: Systemd Service
  # ============================================================================

  - id: sigma_systemd_service_created
    name: "New systemd service unit created"
    description: "A .service unit file was created in a systemd directory — persistence or lateral movement."
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/etc/systemd/system/[^/]+\\.service"
        - "/usr/lib/systemd/system/[^/]+\\.service"
        - "/lib/systemd/system/[^/]+\\.service"
        - "/etc/systemd/user/[^/]+\\.service"
    severity: critical
    action: alert
    tags: [mitre:T1543.002, sigma, systemd, persistence]

  - id: sigma_systemd_timer_created
    name: "New systemd timer unit created"
    description: "A .timer unit file was created — persistence mechanism equivalent to cron."
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/etc/systemd/system/[^/]+\\.timer"
        - "/usr/lib/systemd/system/[^/]+\\.timer"
    severity: warning
    action: alert
    tags: [mitre:T1543.002, sigma, systemd, timer, persistence]

  # ============================================================================
  # T1105 — Ingress Tool Transfer
  # ============================================================================

  - id: sigma_tool_download_to_tmp
    name: "Download tool written to /tmp or /dev/shm"
    description: "curl, wget, or fetch wrote a file to a world-writable temporary directory — tool staging."
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/tmp/[^/]+\\.(sh|py|pl|rb|elf|bin|exe|so)"
        - "/dev/shm/[^/]+\\.(sh|py|pl|rb|elf|bin|exe|so)"
        - "/var/tmp/[^/]+\\.(sh|py|pl|rb|elf|bin|exe|so)"
    severity: warning
    action: alert
    tags: [mitre:T1105, sigma, tool-transfer, staging]

  # 5.9d (сплошная ревизия, plan.md): reverse asymmetry — the name/description
  # claim "/tmp or /dev/shm" scoping, but the condition only checks the
  # syscall number. This was never a missing-predicate bug to fix by adding
  # a path filter: chmod/fchmod/fchmodat syscall args are raw pointers, not
  # resolved strings (see RulesRequiringFileOp, sigma_sensitive_file_chmod
  # above for the same limitation), so no rule on event_type: syscall can
  # check a path today. Name/description corrected to state what is actually
  # detected — any chmod +x, not specifically in /tmp or /dev/shm — rather
  # than leaving a claim the condition cannot back up.
  - id: sigma_chmod_executable_tmp
    name: "chmod syscall observed (path not resolved)"
    description: "A chmod/fchmod/fchmodat syscall was made. The collector cannot resolve the target path at the syscall layer, so this cannot be scoped to /tmp or /dev/shm despite the id name (kept for continuity) — treat as a broad staging signal, not location-specific."
    event_type: syscall
    condition:
      field: nr
      op: in
      values: ["90", "91", "268"]  # chmod, fchmod, fchmodat
    severity: warning
    action: alert
    tags: [mitre:T1105, mitre:T1222, sigma, chmod, staging]

  # ============================================================================
  # T1036 — Masquerading
  # ============================================================================

  - id: sigma_masquerade_kernel_thread
    name: "Process masquerading as kernel thread"
    description: "User-space process using square-bracket notation like kernel threads (e.g. [kworker]) — process name masquerading."
    event_type: syscall
    condition:
      field: comm
      op: regex
      values:
        - "^\\[.*\\]$"
    severity: warning
    action: alert
    tags: [mitre:T1036, sigma, masquerade, process-hiding]

  - id: sigma_masquerade_sshd
    name: "Process masquerading as sshd"
    description: "A non-standard process is using the name 'sshd' or 'ssh' to hide — process masquerade."
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/tmp/sshd"
        - "/dev/shm/sshd"
        - "/var/tmp/sshd"
        - "/tmp/ssh"
    severity: critical
    action: alert
    tags: [mitre:T1036.005, sigma, masquerade, sshd]

  - id: sigma_binary_in_tmp_executed
    name: "ELF binary executed from /tmp or /dev/shm"
    description: "A compiled binary was executed from a temporary directory — unusual and indicator of dropper execution."
    event_type: file
    condition:
      field: filename
      op: prefix
      values:
        - "/tmp/"
        - "/dev/shm/"
        - "/var/tmp/"
        - "/run/user/"
    severity: warning
    action: alert
    tags: [mitre:T1036, mitre:T1059, sigma, temp-execution]
    exceptions:
      # Scoped to comm AND path: the canary manager opens its own lure file
      # at /tmp/.secret_key on a verification loop — it never executes it.
      # Any other file under the watched temp dirs still alerts.
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: filename
              op: eq
              values: ["/tmp/.secret_key"]

  # Syscall-based companion: detects processes whose argv[0] starts with /tmp/,
  # catching execution even when no subsequent file opens happen in /tmp.
  - id: exec_from_tmp
    name: "Process executed from /tmp or /dev/shm"
    description: >
      A process is running whose argv[0] (executable path) begins with /tmp/,
      /dev/shm/, or /var/tmp/. This catches dropper execution even for static
      binaries that open no files after exec.
    event_type: syscall
    condition:
      field: proc.args
      op: prefix
      values:
        - "/tmp/"
        - "/dev/shm/"
        - "/var/tmp/"
    severity: warning
    action: alert
    tags: [mitre:T1036, mitre:T1059, sigma, temp-execution]

  # ============================================================================
  # T1070 — Indicator Removal
  # ============================================================================

  - id: sigma_log_deletion
    name: "System log files deleted"
    description: "Files in /var/log/ were deleted or truncated — log tampering to remove attack evidence."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: prefix
          values:
            - "/var/log/"
        - field: proc.comm
          op: not_in
          # 5.8h (замер №2.4, находка №21/№22): rsyslogd ("rs:main Q:Reg",
          # its main queue-regulator thread name, truncated by COMM_LEN) and
          # systemd-journald ("systemd-journal", same truncation) route
          # through here on every write, same class as sshd/cron below.
          values: ["sshd", "cron", "rsyslogd", "rs:main Q:Reg", "systemd-journal", "systemd-journald"]
    severity: critical
    action: alert
    tags: [mitre:T1070.002, sigma, log-deletion, defense-evasion]
    exceptions:
      # Scoped to comm AND path: the agent writes and rotates its own
      # rule-audit log under /var/log/ebpf-guard/. Touching any other file
      # under /var/log/ — including a real log-tampering delete/truncate —
      # still alerts.
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: filename
              op: prefix
              values: ["/var/log/ebpf-guard/"]

  # sshd/cron routinely touch /var/log/ (log rotation hooks, cron job
  # output redirection) without deleting anything malicious. plan.md wave
  # 5.1: this rule has no op filter (findings note it fires on any touch,
  # including rotation) — daemon split only strips volume, doesn't narrow
  # the base rule's op coverage.
  - id: sigma_log_deletion_daemon
    name: "System log files touched by login/cron/syslog daemon"
    description: "sshd, cron, rsyslogd, or systemd-journald touched a file under /var/log/ — usually routine logging or rotation, but content is not inspected."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: prefix
          values:
            - "/var/log/"
        - field: proc.comm
          op: in
          values: ["sshd", "cron", "rsyslogd", "rs:main Q:Reg", "systemd-journal", "systemd-journald"]
    severity: info
    action: alert
    tags: [mitre:T1070.002, sigma, log-deletion, defense-evasion, needs-content-analysis]

  - id: sigma_history_file_cleared
    name: "Shell history file cleared or deleted"
    description: "Bash/zsh history file was deleted or truncated — attacker covering tracks."
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - ".*\\.bash_history$"
        - ".*\\.zsh_history$"
        - ".*\\.history$"
        - ".*\\.sh_history$"
    severity: warning
    action: alert
    tags: [mitre:T1070.003, sigma, history, defense-evasion]

  - id: sigma_utmp_wtmp_modified
    name: "Login record files modified (utmp/wtmp)"
    description: "The system login tracking files (utmp, wtmp, lastlog) were modified — attacker hiding active sessions."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: op
          op: eq
          values: ["write"]
        - field: filename
          op: in
          values:
            - "/var/run/utmp"
            - "/var/log/wtmp"
            - "/var/log/btmp"
            - "/var/log/lastlog"
        - field: proc.comm
          op: not_in
          values: ["sshd", "cron"]
    severity: warning
    action: alert
    tags: [mitre:T1070, sigma, utmp, session-hiding]

  # sshd/cron routinely update utmp/wtmp/lastlog on every login/job run.
  # plan.md wave 5.1 correction: замер №2 showed this rule at warning still
  # gave 656 alerts/71min — downgrading severity without downgrading volume
  # doesn't solve the noise problem for a cluster this size. Now info,
  # matching the other six daemon splits from this wave.
  - id: sigma_utmp_wtmp_modified_daemon
    name: "Login record files modified by login/cron daemon"
    description: "sshd or cron updated utmp/wtmp/lastlog — usually routine session accounting, but content is not inspected."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: op
          op: eq
          values: ["write"]
        - field: filename
          op: in
          values:
            - "/var/run/utmp"
            - "/var/log/wtmp"
            - "/var/log/btmp"
            - "/var/log/lastlog"
        - field: proc.comm
          op: in
          values: ["sshd", "cron"]
    severity: info
    action: alert
    tags: [mitre:T1070, sigma, utmp, session-hiding, needs-content-analysis]

  # ============================================================================
  # T1218 — System Binary Proxy Execution
  # ============================================================================

  - id: sigma_lolbin_python_download
    name: "Python used to download remote file"
    description: "Python urllib or requests used to download files — Python LOLBin for ingress tool transfer."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "python.*urllib.*urlretrieve"
        - "python.*urllib.*urlopen"
        - "python.*requests\\.get"
        - "python.*http\\.client"
    severity: warning
    action: alert
    tags: [mitre:T1218, mitre:T1105, sigma, lolbin, python]

  - id: sigma_lolbin_openssl_connect
    name: "OpenSSL used as network tunnel"
    description: "openssl s_client invoked with -connect for reverse shell or C2 tunneling."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "openssl.*s_client.*-connect"
        - "openssl.*s_server"
    severity: critical
    action: alert
    tags: [mitre:T1218, mitre:T1059, sigma, openssl, reverse-shell]

  - id: sigma_lolbin_awk_shell
    name: "awk used to execute shell commands"
    description: "awk BEGIN{system()} pattern used for shell execution — GTFOBin technique."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "awk.*system\\("
        - "awk.*BEGIN.*system"
        - "gawk.*system\\("
    severity: warning
    action: alert
    tags: [mitre:T1218, sigma, awk, gtfobins]

  - id: sigma_lolbin_find_exec
    name: "find -exec used for shell execution"
    description: "find command using -exec to run a shell — GTFOBin technique for command execution."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "find.*-exec.*sh.*"
        - "find.*-exec.*bash.*"
        - "find.*-exec.*python.*"
        - "find.*-exec.*perl.*"
    severity: warning
    action: alert
    tags: [mitre:T1218, sigma, find, gtfobins]

  - id: sigma_lolbin_env_execution
    name: "env used to bypass shell restrictions"
    description: "env command used to execute a shell or interpreter — GTFOBin for restricted shell bypass."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "^env .*(sh|bash|python|perl|ruby|node)"
        - "env\\s+-i\\s+"
    severity: warning
    action: alert
    tags: [mitre:T1218, sigma, env, gtfobins, restricted-shell-bypass]

  - id: sigma_lolbin_dd_write
    name: "dd used to read from or write to block device"
    description: "dd targeting a raw block device for input or output — disk imaging, data exfiltration, or malware installation."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "dd.*of=/dev/[sh]d"
        - "dd.*of=/dev/nvme"
        - "dd.*if=/dev/urandom.*of="
        - "dd.*conv=notrunc"
        - "dd.*if=/dev/[sh]d"
        - "dd.*if=/dev/nvme"
        - "dd.*if=/dev/[sh]d.*of="
    severity: warning
    action: alert
    tags: [mitre:T1218, mitre:T1005, sigma, dd, disk-read, disk-write]

  # ============================================================================
  # T1222 — File and Directory Permissions Modification
  # ============================================================================

  - id: sigma_world_writable_dir_created
    name: "World-writable directory created"
    description: "mkdir called with world-writable permissions (chmod 777 or mode 0777) — staging ground for privilege escalation."
    event_type: syscall
    condition_group:
      # 5.9.3c (#47): the description promises mode 0777 specifically, but
      # the condition never checked it — bare mkdir/mkdirat matched every
      # directory creation on the box. The mode argument sits at a
      # different offset per syscall: mkdir(path, mode) has mode at arg1;
      # mkdirat(dirfd, path, mode) has mode at arg2. 511 = 0777.
      operator: or
      subgroups:
        - operator: and
          conditions:
            - field: nr
              op: eq
              values: ["83"]  # mkdir
            - field: arg1
              op: eq
              values: ["511"]
        - operator: and
          conditions:
            - field: nr
              op: eq
              values: ["258"]  # mkdirat
            - field: arg2
              op: eq
              values: ["511"]
    severity: warning
    action: alert
    tags: [mitre:T1222, sigma, world-writable, filesystem]

  # 5.9d (находка №27, plan.md): условие раньше проверяло только префикс пути
  # + comm — ни chmod, ни fchmod не проверялись вовсе, поэтому правило
  # срабатывало на ЛЮБОЕ обращение к этим путям (open/read/write), включая
  # обычное чтение (sigma_passwd_shadow_read и sensitive_file_read уже это
  # покрывают, отдельно). Настоящий предикат операции здесь физически
  # невозможен на event_type: file: файловый коллектор (bpf/fileaccess.bpf.c)
  # не хукает chmod/fchmod/fchmodat вовсе — FileEvent.Op знает только
  # open/read/write (FILE_OP_* в bpf/common.h). Единственное место, где
  # настоящий chmod виден — трассировка syscall по номеру (см.
  # sigma_chmod_executable_tmp выше), но там args — сырые указатели, а не
  # разрешённые строки, так что путь проверить нельзя (см.
  # RulesRequiringFileOp). Перевод на syscall-ось — единственный способ
  # сохранить срабатывание на НАСТОЯЩЕМ chmod, ценой потери привязки к
  # конкретному пути; это ограничение вынесено в description, а не спрятано.
  # Severity понижена до warning вместе с потерей "sensitive file" адресности
  # (было critical, когда правило ошибочно претендовало на привязку к пути).
  - id: sigma_sensitive_file_chmod
    name: "chmod/fchmod syscall by non-daemon process (path not resolved)"
    description: >
      A chmod/fchmod/fchmodat syscall was made by a process other than sshd or
      cron. The collector cannot resolve which file was the target — syscall
      arguments are raw pointers, not paths — so this is a broader signal than
      "sensitive system file" despite the id name (kept for continuity with
      prior alerts/dashboards). True path-scoped chmod detection needs a new
      BPF probe that resolves the path argument; tracked as follow-up, not
      done here (plan.md находка №27, 5.9d).
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["90", "91", "268"]  # chmod, fchmod, fchmodat
        - field: comm
          op: not_in
          values: ["sshd", "cron"]
    severity: warning
    action: alert
    tags: [mitre:T1222, sigma, chmod]

  # sshd/cron routinely chmod PAM/SSH config or credential files during
  # login/job accounting. plan.md wave 5.1: downgrade, don't suppress —
  # info severity (not warning — warning-level daemon splits from P1-6
  # kept full volume, see sigma_utmp_wtmp_modified_daemon precedent).
  # 5.9d: moved to the same syscall axis as sigma_sensitive_file_chmod above,
  # for the same reason (chmod is not observable via event_type: file).
  - id: sigma_sensitive_file_chmod_daemon
    name: "chmod/fchmod syscall by login/cron daemon (path not resolved)"
    description: "sshd or cron made a chmod/fchmod/fchmodat syscall — usually routine accounting, but neither content nor target path is inspected (see sigma_sensitive_file_chmod for the path-resolution limitation)."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["90", "91", "268"]  # chmod, fchmod, fchmodat
        - field: comm
          op: in
          values: ["sshd", "cron"]
    severity: info
    action: alert
    tags: [mitre:T1222, sigma, chmod, sensitive-file, needs-content-analysis]

  # ============================================================================
  # T1082 — System Information Discovery
  # ============================================================================

  - id: sigma_cpu_info_access
    name: "CPU/hardware info enumeration"
    description: "Access to /proc/cpuinfo, /proc/meminfo, or hardware info files — system reconnaissance."
    event_type: file
    condition:
      field: filename
      op: in
      values:
        - "/proc/cpuinfo"
        - "/proc/meminfo"
        - "/proc/version"
        - "/proc/sys/kernel/hostname"
        - "/proc/sys/kernel/osrelease"
        - "/proc/sys/kernel/version"
    severity: warning
    action: alert
    tags: [mitre:T1082, sigma, discovery, system-info, proc-recon-cluster]
    exceptions:
      # Scoped to comm AND path: the hardware profiler / CPU watchdog reads
      # only these three files. Enumeration of the /proc/sys/kernel/* entries
      # by a process named "ebpf-guard" still alerts.
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: filename
              op: in
              values: ["/proc/cpuinfo", "/proc/meminfo", "/proc/version"]
      # plan.md wave 5.7a (замер №2.3, находка №13): pgrep reads /proc/cpuinfo
      # as part of its libc/procps startup (189/h, part of the four-rule
      # pgrep cluster). Scoped to comm AND path — enumeration of
      # /proc/sys/kernel/* by pgrep would be out of character and still alerts.
      - name: pgrep-cpuinfo-scan
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [pgrep]
            - field: filename
              op: in
              values: ["/proc/cpuinfo", "/proc/meminfo", "/proc/version"]

  - id: sigma_kernel_version_read
    name: "Kernel version file read"
    description: "Process read /proc/version or /etc/os-release — OS fingerprinting for exploit selection."
    event_type: file
    condition:
      field: filename
      op: in
      values:
        - "/proc/version"
        - "/etc/os-release"
        - "/etc/lsb-release"
        - "/etc/debian_version"
        - "/etc/redhat-release"
        - "/etc/centos-release"
        - "/etc/fedora-release"
    severity: warning
    action: alert
    tags: [mitre:T1082, sigma, discovery, os-fingerprinting]
    exceptions:
      # Scoped to comm AND path: the kernel BTF/version detector reads
      # /proc/version at startup. Reading the distro release files — the
      # actual fingerprinting-for-exploit-selection primitive — still alerts.
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: filename
              op: eq
              values: ["/proc/version"]

  # ============================================================================
  # T1083 — File and Directory Discovery
  # ============================================================================

  - id: sigma_sensitive_dir_listing
    name: "Listing of sensitive credential directories"
    description: "Directory listing of /root, /home, /etc/ssh, or /root/.ssh — credential discovery."
    event_type: file
    condition:
      field: filename
      op: prefix
      values:
        - "/root/.ssh/"
        - "/root/.aws/"
        - "/root/.gcp/"
        - "/root/.kube/"
        - "/home/"
    severity: warning
    action: alert
    tags: [mitre:T1083, mitre:T1552, sigma, discovery, credential-files]
    exceptions:
      # Scoped to comm AND path: the agent's only access under these
      # directories is verifying its own canary trap
      # (/root/.ssh/id_rsa.canary). Reading a real key still alerts.
      - name: ebpf-guard-self
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [ebpf-guard]
            - field: filename
              op: suffix
              values: [".canary"]

  # ============================================================================
  # T1087 — Account Discovery
  # ============================================================================

  # 5.9d (сплошная ревизия, находка №27): name/description say "read" but the
  # condition never checked op — fired on any file event to these paths
  # (open/read/write alike). Added op in [open, read] to match what the name
  # claims: a bare open() without a following read() still counts (same
  # convention as sensitive_file_read in credential-access.yaml), a write()
  # no longer does.
  #
  # 5.9.1e (остаток 5.9d, находка "дубли"): это правило и sensitive_file_read
  # (credential-access.yaml) буквально дублировали друг друга на /etc/passwd
  # и /etc/shadow — оба warning, оба срабатывают на одном open(). Выбрана
  # вторая из двух опций постановки 5.9.1e («оставить оба, развести по осям,
  # понизить один до info»), не слияние в одно правило: sensitive_file_read
  # остаётся единственным warning-сигналом на этот класс события (шире список
  # исключённых auth-бинарей, точнее соответствует своему тегу T1003.008 —
  # credential access), это правило понижено до info и оставлено как более
  # широкий T1087.001 (account discovery) сигнал — единственная причина не
  # удалять его: оно покрывает /etc/group, которого нет в sensitive_file_read.
  # daemon-двойник (sigma_passwd_shadow_read_daemon, ниже) был info и до этой
  # правки — теперь совпадает по severity с базовым правилом; различие
  # daemon/non-daemon для этого id больше не несёт priority-смысла, только
  # тег "кто читал".
  - id: sigma_passwd_shadow_read
    name: "Credential files read (/etc/passwd or /etc/shadow) — account discovery"
    description: "Reads to /etc/passwd (user enumeration), /etc/shadow, /etc/gshadow, or /etc/group. Broader companion to sensitive_file_read (credential-access.yaml), which is the warning-severity signal for the same /etc/passwd, /etc/shadow reads — downgraded to info in 5.9.1e to remove the literal duplicate at warning severity; kept at info because it also covers /etc/group, which sensitive_file_read does not."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: in
          values:
            - "/etc/passwd"
            - "/etc/shadow"
            - "/etc/gshadow"
            - "/etc/group"
        - field: op
          op: in
          values: ["open", "read"]
        - field: proc.comm
          op: not_in
          values: ["sshd", "cron"]
    severity: info
    action: alert
    tags: [mitre:T1087.001, sigma, credential-access, account-discovery]

  # sshd/cron routinely read passwd/shadow/group on every login/job run
  # (PAM account lookup). plan.md wave 5.1, closed question 10: this rule
  # promises nothing about the process — sigma_passwd_shadow_read_daemon
  # exists purely to strip the idle volume, not to re-scope detection.
  - id: sigma_passwd_shadow_read_daemon
    name: "Credential files read by login/cron daemon"
    description: "sshd or cron read /etc/passwd, /etc/shadow, /etc/gshadow, or /etc/group — usually routine PAM account lookup, but content is not inspected."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: in
          values:
            - "/etc/passwd"
            - "/etc/shadow"
            - "/etc/gshadow"
            - "/etc/group"
        - field: op
          op: in
          values: ["open", "read"]
        - field: proc.comm
          op: in
          values: ["sshd", "cron"]
    severity: info
    action: alert
    tags: [mitre:T1087.001, sigma, credential-access, account-discovery, needs-content-analysis]

  - id: sigma_sudo_config_read
    name: "Sudoers configuration read"
    description: "Process read /etc/sudoers or /etc/sudoers.d — enumerating privileged accounts."
    event_type: file
    condition:
      field: filename
      op: prefix
      values:
        - "/etc/sudoers"
        - "/etc/sudoers.d/"
    severity: warning
    action: alert
    tags: [mitre:T1087, sigma, sudo, privilege-discovery]

  # ============================================================================
  # T1548 — Abuse Elevation Control Mechanism
  # ============================================================================

  - id: sigma_setuid_syscall
    name: "setuid/setgid syscall called"
    description: "Process called setuid(0) or setgid(0) — attempting to switch to root identity."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["105", "106", "113", "114", "117", "119"]  # setuid, setgid, setreuid, setregid, setresuid, setresgid
        # 5.9.3b (#47): privsep daemons call setuid/setgid as part of normal
        # operation (dropping root after bind, forked worker privsep) — the
        # signal is an *unexpected* caller, not the syscall itself.
        - field: comm
          op: not_in
          values: ["sshd", "su", "sudo", "cron", "crond", "apache2", "nginx",
                    "php-fpm", "postgres", "mysqld", "dovecot", "vsftpd"]
    severity: warning
    action: alert
    tags: [mitre:T1548.001, sigma, setuid, privilege-escalation]

  - id: sigma_prctl_dumpable
    name: "Process set itself non-dumpable via prctl"
    description: "prctl(PR_SET_DUMPABLE, 0) called — process hiding from /proc inspection and core dumps."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["157"]  # prctl
        # 5.9.3c (#47): the rule name promises PR_SET_DUMPABLE specifically,
        # but the condition matched every prctl option (PR_SET_NAME,
        # PR_SET_SECCOMP, PR_SET_NO_NEW_PRIVS, thread naming, …), which
        # nearly every process calls at startup. prctl(option, …): arg0 is
        # option. PR_SET_DUMPABLE=4.
        - field: arg0
          op: in
          values: ["4"]
        # arg1 is the dumpable value; 0 = non-dumpable (the hiding case
        # this rule is named for), 1 just restores the default.
        - field: arg1
          op: eq
          values: ["0"]
    severity: warning
    action: alert
    tags: [mitre:T1548, sigma, prctl, process-hiding]

  # ============================================================================
  # T1003 — OS Credential Dumping
  # ============================================================================

  - id: sigma_memory_proc_dump
    name: "Process memory read via /proc/*/mem"
    description: "Process reading another process's memory via /proc/[pid]/mem — credential extraction or code injection."
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/proc/[0-9]+/mem"
        - "/proc/[0-9]+/maps"
        - "/proc/[0-9]+/environ"
        - "/proc/[0-9]+/cmdline"
    severity: critical
    action: alert
    tags: [mitre:T1003, sigma, memory-dump, credential-access]
    # systemd-journal reads /proc/[pid]/{maps,environ,cmdline} routinely when
    # attributing log lines to a process (_COMM/_CMDLINE journal fields), and
    # ebpf-guard reads its own /proc/self equivalents for self-monitoring —
    # neither is credential access. Observed as ~97% of this rule's alerts on
    # an idle host (see ISSUES-attack-run-2026-08-03.md P1-6).
    #
    # plan.md wave 5.7a (замер №2.3, находка №13): pgrep's per-PID matching
    # pass reads only /proc/<pid>/cmdline (193/h) — never /mem or /maps, the
    # actual credential-scraping primitives. Scoped to comm AND path so the
    # real dump surface stays alerting even from pgrep (control criterion:
    # attack-window /proc/*/mem dumps must keep firing, see cred_proc_maps_mass_read).
    exceptions:
      - name: systemd-journal
        condition:
          field: proc.comm
          op: eq
          values: [systemd-journal]
      - name: ebpf-guard-self
        condition:
          field: proc.comm
          op: eq
          values: [ebpf-guard]
      - name: pgrep-cmdline-scan
        condition_group:
          operator: and
          conditions:
            - field: proc.comm
              op: eq
              values: [pgrep]
            - field: filename
              op: regex
              values:
                - "/proc/[0-9]+/cmdline"

  - id: sigma_ptrace_attach
    name: "ptrace PTRACE_ATTACH to another process"
    description: "ptrace(PTRACE_ATTACH) used to attach to another process — credential theft or code injection."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["101"]  # ptrace
        # 5.9.3c (#47): the rule name promises PTRACE_ATTACH specifically,
        # but the condition matched every ptrace request (PEEKDATA, CONT,
        # …) — the overwhelming majority of legitimate debugger traffic.
        # ptrace(request, pid, addr, data): arg0 is request.
        # PTRACE_ATTACH=16, PTRACE_SEIZE=16902(0x4206).
        - field: arg0
          op: in
          values: ["16", "16902"]
    severity: critical
    action: alert
    tags: [mitre:T1003, mitre:T1055, sigma, ptrace, credential-access]

  # ============================================================================
  # T1055 — Process Injection
  # ============================================================================

  - id: sigma_memfd_create_anonymous
    name: "Anonymous file created via memfd_create"
    description: "memfd_create syscall — creates an anonymous file in memory. Used for fileless malware and process injection."
    event_type: syscall
    condition:
      field: nr
      op: in
      values: ["319"]  # memfd_create
    severity: critical
    action: alert
    tags: [mitre:T1055, mitre:T1620, sigma, memfd, fileless]

  - id: sigma_mprotect_exec_heap
    name: "Memory region marked executable (mprotect)"
    description: "mprotect PROT_EXEC applied — marking heap/stack as executable. Used in shellcode injection."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["10"]  # mprotect
        # 5.9.3c (#47): the rule name promises PROT_EXEC specifically, but
        # the condition matched every mprotect call — glibc's malloc arena
        # management alone makes this one of the noisiest syscalls on the
        # box. mprotect(addr, len, prot): arg2 is prot.
        # 4=EXEC, 5=EXEC|READ, 6=EXEC|WRITE, 7=EXEC|WRITE|READ.
        - field: arg2
          op: in
          values: ["4", "5", "6", "7"]
    severity: warning
    action: alert
    tags: [mitre:T1055, sigma, mprotect, shellcode]

  - id: sigma_process_vm_readv
    name: "process_vm_readv cross-process memory read"
    description: "process_vm_readv syscall used to read another process's address space — credential theft or memory scraping."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["310"]  # process_vm_readv
        # 5.9.3c (#47): legitimate callers are debuggers/core-dump and
        # checkpoint tooling — exclude them, not the syscall.
        - field: comm
          op: not_in
          values: ["gdb", "gcore", "criu"]
    severity: critical
    action: alert
    tags: [mitre:T1055, sigma, process-vm, memory-scraping]

  - id: sigma_process_vm_writev
    name: "process_vm_writev cross-process memory write"
    description: "process_vm_writev used to write to another process — code injection without ptrace."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["311"]  # process_vm_writev
        - field: comm
          op: not_in
          values: ["gdb", "criu"]
    severity: critical
    action: alert
    tags: [mitre:T1055, sigma, process-vm, code-injection]

  # ============================================================================
  # T1562 — Impair Defenses
  # ============================================================================

  - id: sigma_seccomp_filter_install
    name: "seccomp BPF filter installed by non-container-runtime"
    description: "seccomp(SECCOMP_SET_MODE_FILTER) called — installing syscall filter. Legitimate for sandboxing, suspicious from unknown processes."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: in
          values: ["317"]  # seccomp
        # 5.9.3c (#47): the id says "by non-container-runtime" but the
        # condition never excluded the container runtime — or the other
        # major legitimate seccomp installer, browser renderer sandboxes.
        - field: comm
          op: not_in
          values: ["runc", "containerd-shim", "containerd-shim-runc-v2",
                    "dockerd", "conmon", "crun", "chrome", "chromium",
                    "docker-init"]
    severity: warning
    action: alert
    tags: [mitre:T1562, sigma, seccomp, defense-evasion]

  - id: sigma_iptables_flush
    name: "iptables flush or chain delete"
    description: "iptables -F or iptables --flush executed — removing firewall rules to enable C2 communication."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "iptables.*-F"
        - "iptables.*--flush"
        - "iptables.*-X"
        - "iptables.*--delete-chain"
        - "ip6tables.*-F"
        - "ufw disable"
        - "systemctl stop firewalld"
        - "systemctl disable firewalld"
    severity: critical
    action: alert
    tags: [mitre:T1562.004, sigma, iptables, firewall-disable]

  - id: sigma_auditd_stopped
    name: "auditd security daemon stopped"
    description: "auditd (Linux audit daemon) stopped or disabled — removing security monitoring."
    event_type: syscall
    condition:
      field: proc.args
      op: regex
      values:
        - "systemctl.*stop.*auditd"
        - "systemctl.*disable.*auditd"
        - "service.*auditd.*stop"
        - "auditctl.*-e 0"
    severity: critical
    action: alert
    tags: [mitre:T1562.001, sigma, auditd, defense-evasion]

  # ============================================================================
  # T1014 — Rootkit
  # ============================================================================

  - id: sigma_dev_mem_access
    name: "Direct memory device access (/dev/mem or /dev/kmem)"
    description: "Process opened /dev/mem or /dev/kmem for direct physical memory access — rootkit or advanced privilege escalation."
    event_type: file
    condition:
      field: filename
      op: in
      values:
        - "/dev/mem"
        - "/dev/kmem"
        - "/dev/port"
    severity: critical
    action: alert
    tags: [mitre:T1014, sigma, rootkit, memory-access]

  - id: sigma_proc_sysrq_write
    name: "Write to /proc/sysrq-trigger"
    description: "Process wrote to /proc/sysrq-trigger — can crash/reboot system or sync/unmount filesystems to destroy evidence."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: op
          op: eq
          values: ["write"]
        - field: filename
          op: in
          values:
            - "/proc/sysrq-trigger"
    severity: critical
    action: alert
    tags: [mitre:T1014, sigma, sysrq, system-manipulation]

  # ============================================================================
  # T1110 — Brute Force
  # ============================================================================

  - id: sigma_ssh_many_failed_auth
    name: "Suspicious high rate of authentication attempts"
    description: "Many rapid authentication calls detected — brute force or credential stuffing attack in progress."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["22", "2222", "22222"]  # SSH ports
    severity: warning
    action: alert
    tags: [mitre:T1110, sigma, brute-force, ssh]

  - id: sigma_failed_login_syscall
    name: "Authentication failure via PAM"
    description: "Login failure recorded — tracks repeated authentication failures for brute force detection."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: prefix
          values:
            - "/etc/pam.d/"
            - "/etc/security/"
        - field: proc.comm
          op: not_in
          values: ["sshd", "cron"]
    severity: warning
    action: alert
    tags: [mitre:T1110, sigma, pam, auth-failure]

  # sshd/cron read PAM config on every login/job run regardless of outcome —
  # this rule only ever proxies "PAM config touched", not an actual failed
  # login (that distinction needs content analysis eBPF doesn't have).
  # plan.md wave 5.1: downgrade, don't suppress.
  - id: sigma_failed_login_syscall_daemon
    name: "PAM config accessed by login/cron daemon"
    description: "sshd or cron accessed PAM configuration — usually routine login/job accounting, but content is not inspected."
    event_type: file
    condition_group:
      operator: and
      conditions:
        - field: filename
          op: prefix
          values:
            - "/etc/pam.d/"
            - "/etc/security/"
        - field: proc.comm
          op: in
          values: ["sshd", "cron"]
    severity: info
    action: alert
    tags: [mitre:T1110, sigma, pam, auth-failure, needs-content-analysis]

  # ============================================================================
  # T1190 — Exploit Public-Facing Application
  # ============================================================================

  - id: sigma_web_server_shell_spawn
    name: "Shell spawned from web server process"
    description: "A shell was launched with a web server (apache2, nginx, httpd) as its ancestor — RCE via web application."
    event_type: syscall
    condition_group:
      operator: and
      conditions:
        - field: comm
          op: regex
          values:
            - "^sh$"
            - "^bash$"
            - "^dash$"
            - "^zsh$"
            - "^ksh$"
        # 5.9.3b (#47): the rule name promises a web-server ancestor but the
        # condition never checked it — any shell on the box matched.
        - field: parent_comm
          op: in
          values: ["nginx", "apache2", "httpd", "php-fpm", "gunicorn", "uwsgi", "node", "java"]
    severity: critical
    action: alert
    tags: [mitre:T1190, sigma, rce, webshell, web-server]

  - id: sigma_java_child_shell
    name: "Shell child process of Java runtime"
    description: "Java spawned a shell — Log4Shell, Spring4Shell, or Java deserialization RCE pattern."
    event_type: file
    condition:
      field: filename
      op: regex
      values:
        - "/bin/sh"
        - "/bin/bash"
        - "/bin/dash"
        - "/usr/bin/sh"
        - "/usr/bin/bash"
    severity: critical
    action: alert
    tags: [mitre:T1190, mitre:T1059.004, sigma, log4shell, java-rce]

  # ============================================================================
  # Network outbound on unusual ports
  # ============================================================================

  - id: sigma_outbound_tor_ports
    name: "Outbound connection to Tor network ports"
    description: "Connection to TCP 9001/9030/9050/9051 — Tor relay or hidden service used for C2 anonymization."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["9001", "9030", "9050", "9051"]
    severity: critical
    action: alert
    tags: [mitre:T1090.003, sigma, tor, c2, anonymization]

  - id: sigma_irc_c2_ports
    name: "Outbound IRC connection on standard ports"
    description: "Connection to TCP 6667/6668/6669/6697 (IRC ports) — legacy botnet C2 protocol."
    event_type: network
    condition:
      field: dport
      op: in
      values: ["6667", "6668", "6669", "6697"]
    severity: critical
    action: alert
    tags: [mitre:T1095, sigma, irc, botnet, c2]
