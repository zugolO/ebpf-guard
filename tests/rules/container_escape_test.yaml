suite: container_escape
rules_path: ../../rules/container-escape.yaml
tests:
  - name: "mount syscall (nr=165) from non-runtime comm fires container_escape_mount"
    rule_id: container_escape_mount
    event:
      type: syscall
      pid: 4242 # 5.9.9.F.5o (#165): the harness defaults an unset pid to 1,
      # which collides with the systemd-init-self exception (pid==1) added
      # by 5.9.9.F.3c — an attacking process never legitimately has pid 1.
      comm: "app"
      syscall:
        nr: 165
    expect: alert
    expect_severity: critical

  - name: "mount syscall (nr=165) from runc does not fire container_escape_mount"
    event:
      type: syscall
      comm: "runc"
      syscall:
        nr: 165
    expect: no_alert

  - name: "setns syscall (nr=308) from non-runtime comm fires container_escape_nsenter"
    rule_id: container_escape_nsenter
    event:
      type: syscall
      comm: "app"
      syscall:
        nr: 308
    expect: alert
    expect_severity: critical

  - name: "unshare syscall (nr=272) from non-runtime comm fires container_escape_unshare_user"
    rule_id: container_escape_unshare_user
    event:
      type: syscall
      pid: 4242 # 5.9.9.F.5o (#165): see the pid=4242 note on container_escape_mount above.
      comm: "app"
      syscall:
        nr: 272
    expect: alert
    expect_severity: warning

  - name: "access to /host/ prefix from a container fires container_escape_host_mount"
    rule_id: container_escape_host_mount
    # 6.2.1 (#220): the rule was split along the identity axis — the container
    # half now requires container.id/k8s.pod to be non-empty, and a fixture
    # without identity falls to container_escape_host_mount_from_host instead.
    # An escape is asserted from inside a container, so the identity is set.
    event:
      type: file
      comm: "app"
      container_id: "3f1c9a0b2d4e"
      file:
        filename: "/host/etc/passwd"
        op: open
    expect: alert

  - name: "access to /host/ prefix from the host fires container_escape_host_mount_from_host"
    rule_id: container_escape_host_mount_from_host
    # The host half of the same split (6.2.1, #220): no container identity, and
    # a comm that is not one of the runtime daemons the rule excludes by name.
    event:
      type: file
      comm: "app"
      file:
        filename: "/host/etc/passwd"
        op: open
    expect: alert

  - name: "runtime daemon reading /var/lib/containerd does not fire container_escape_host_mount_from_host"
    # The exclusion that makes the host half affordable on a k8s node: the
    # runtime's own daemons do this as ordinary work.
    event:
      type: file
      comm: "containerd"
      file:
        filename: "/var/lib/containerd/io.containerd.runtime/state"
        op: open
    expect: no_alert

  - name: "write to /proc/sysrq-trigger fires container_escape_sysrq_trigger"
    rule_id: container_escape_sysrq_trigger
    event:
      type: file
      file:
        filename: "/proc/sysrq-trigger"
        op: write
    expect: alert
    expect_severity: critical

  - name: "access to /dev/mem fires container_escape_kmem_access"
    rule_id: container_escape_kmem_access
    event:
      type: file
      file:
        filename: "/dev/mem"
        op: open
    expect: alert
    expect_severity: critical

  - name: "ordinary getpid syscall (nr=39) does not fire any escape rule"
    event:
      type: syscall
      syscall:
        nr: 39
    expect: no_alert

  - name: "reading /etc/hostname does not trigger any escape rule"
    event:
      type: file
      file:
        filename: "/etc/hostname"
        op: read
    expect: no_alert
