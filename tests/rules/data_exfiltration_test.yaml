suite: data_exfiltration
rules_path: ../../rules/data-exfiltration.yaml
tests:
  # Волна 6.3.L.1, item 3 (№424). Фикстура была написана под ПРЕЖНЮЮ редакцию
  # правила (`qname_length > 60`, то есть длина ВСЕГО имени) и после №329
  # ловила собственную устарелость: правило считает самый длинный ОДИН ЛЕЙБЛ
  # (`qname_max_label_len > 45`) — именно потому, что обычный FQDN k8s берёт
  # 66 символов целиком и порог по всему имени срабатывал на штатном трафике
  # кластера. Прежний qname давал 62 символа всего и 35 в самом длинном
  # лейбле, то есть был НИЖЕ порога правила; срабатывал на нём сосед по файлу
  # (exfil_dns_high_entropy_txt), и красный тест держался на верном продукте.
  # Лейбл ниже — 51 символ, ровно то, что правило и описывает.
  - name: "DNS query with oversized label (>45 chars) fires exfil_dns_txt_long_label"
    rule_id: exfil_dns_txt_long_label
    event:
      type: dns
      dns:
        qname: "aHR0cHM6Ly9leGFtcGxlLmNvbS9zZWNyZXQvdG9rZW4vZXhmaWw.exfil.attacker.example.com"
        qtype: 16
    expect: alert
    expect_severity: critical

  - name: "short DNS query qname does not fire exfil_dns_txt_long_label"
    event:
      type: dns
      dns:
        qname: "example.com"
        qtype: 16
    expect: no_alert

  - name: "high-entropy TXT query fires exfil_dns_high_entropy_txt"
    rule_id: exfil_dns_high_entropy_txt
    event:
      type: dns
      dns:
        qname: "xJ4qW9mZpR8vKlTnFsYbUcAeHwDgOiXuNyBjPkQm.exfil.attacker.example.com"
        qtype: 16
    expect: alert
    expect_severity: critical

  - name: "normal A record query for google.com does not fire exfiltration rule"
    event:
      type: dns
      dns:
        qname: "google.com"
        qtype: 1
    expect: no_alert

  - name: "normal MX record query does not fire exfiltration rule"
    event:
      type: dns
      dns:
        qname: "mail.example.com"
        qtype: 15
    expect: no_alert
