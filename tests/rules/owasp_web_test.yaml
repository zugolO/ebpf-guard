suite: owasp_web
rules_path: ../../rules/owasp-web.yaml
tests:
  - name: "path traversal pattern ../../ in filename fires owasp_path_traversal"
    rule_id: owasp_path_traversal
    event:
      type: file
      # 5.9.9.F.5o (#165): 5.9.9.F.4d narrowed this rule to require a web-worker
      # comm (finding №144 — it used to fire on grep/ld reading any ../ path);
      # the fixture predates that narrowing and never got a comm.
      comm: "nginx"
      file:
        filename: "/var/www/html/../../etc/passwd"
        op: open
    expect: alert
    expect_severity: critical

  - name: "URL-encoded path traversal %2e%2e%2f fires owasp_path_traversal"
    rule_id: owasp_path_traversal
    event:
      type: file
      comm: "nginx" # 5.9.9.F.5o (#165): see note above.
      file:
        filename: "/app/%2e%2e%2fetc/shadow"
        op: open
    expect: alert
    expect_severity: critical

  - name: "regular file open of non-web path does not fire any OWASP rule"
    event:
      type: file
      file:
        filename: "/opt/app/index.html"
        op: open
    expect: no_alert

  - name: "access to /etc/shadow fires owasp_web_sensitive_file_read"
    rule_id: owasp_web_sensitive_file_read
    event:
      type: file
      # 5.9.3g: the rule was narrowed to web-server comms back in wave 3 (Q9);
      # the test still sent a comm-less event and had been red ever since.
      comm: "nginx"
      file:
        filename: "/etc/shadow"
        op: read
    expect: alert
    expect_severity: critical

  - name: "access to /root/.ssh/id_rsa fires owasp_web_sensitive_file_read"
    rule_id: owasp_web_sensitive_file_read
    event:
      type: file
      # 5.9.3g: the rule was narrowed to web-server comms back in wave 3 (Q9);
      # the test still sent a comm-less event and had been red ever since.
      comm: "nginx"
      file:
        filename: "/root/.ssh/id_rsa"
        op: read
    expect: alert

  - name: "execve syscall (nr=59) from nginx fires owasp_web_shell_spawn"
    rule_id: owasp_web_shell_spawn
    event:
      type: syscall
      parent_comm: "nginx"
      syscall:
        nr: 59
    expect: alert
    expect_severity: critical

  - name: "outbound connection to cloud metadata IP fires owasp_web_metadata_access"
    rule_id: owasp_web_metadata_access
    event:
      type: network
      network:
        dst_ip: "169.254.169.254"
        dport: 80
    expect: alert
    expect_severity: critical

  - name: "write to /var/www/ fires owasp_web_suspicious_write"
    rule_id: owasp_web_suspicious_write
    event:
      type: file
      file:
        filename: "/var/www/html/shell.php"
        op: write
    expect: alert

  - name: "connection to standard HTTPS port 443 does not fire SSRF rule"
    event:
      type: network
      network:
        dst_ip: "93.184.216.34"
        dport: 443
    expect: no_alert

  - name: "PHP file written to /uploads/ fires owasp_php_in_upload"
    rule_id: owasp_php_in_upload
    event:
      type: file
      file:
        filename: "/uploads/backdoor.php"
        op: write
    expect: alert
    expect_severity: critical

  - name: "write to log file fires owasp_log_tampering"
    rule_id: owasp_log_tampering
    event:
      type: file
      file:
        filename: "/var/log/nginx/access.log"
        op: write
    expect: alert

  - name: "read of /tmp/app.conf does not fire any OWASP rule"
    event:
      type: file
      file:
        filename: "/tmp/app.conf"
        op: read
    expect: no_alert

  # ==========================================================================
  # Wave 6.1 — container.id axis (finding №219). These lock in the behaviour
  # verified live on the stand: a containerized web workload whose worker
  # threads carry a comm OUTSIDE the web-list (Go binaries, Tomcat http-nio-*)
  # is caught via container.id; the same binary on the host is not; and
  # container-runtime init (runc/containerd-shim), which reads the new
  # container's /etc/passwd during setup while transiently tagged with its
  # cgroup, is excluded so the rule does not fire on every pod start.
  # ==========================================================================
  - name: "containerized web app, out-of-list comm, reads /etc/passwd → fires via container.id"
    rule_id: owasp_web_sensitive_file_read
    event:
      type: file
      comm: "vulnweb"          # a Go web binary — not in the web comm-list
      container_id: "aa957db9bd4d"
      file:
        filename: "/etc/passwd"
        op: read
    expect: alert
    expect_severity: critical

  - name: "same out-of-list comm on the HOST (no container.id) → silent"
    event:
      type: file
      comm: "vulnweb"
      file:
        filename: "/etc/passwd"
        op: read
    expect: no_alert

  - name: "runc container-init reading /etc/passwd during setup → excluded, no alert"
    event:
      type: file
      comm: "runc:[2:INIT]"
      container_id: "aa957db9bd4d"
      file:
        filename: "/etc/passwd"
        op: read
    expect: no_alert

  - name: "containerd-shim reading /etc/passwd during setup → excluded, no alert"
    event:
      type: file
      comm: "containerd-shim"
      container_id: "aa957db9bd4d"
      file:
        filename: "/etc/passwd"
        op: read
    expect: no_alert

  - name: "path traversal from containerized out-of-list comm → fires owasp_path_traversal via container.id"
    rule_id: owasp_path_traversal
    event:
      type: file
      comm: "vulnweb"
      container_id: "aa957db9bd4d"
      file:
        filename: "/app/../../etc/passwd"
        op: open
    expect: alert
    expect_severity: critical

  - name: "containerized node keeps comm 'node' (in-list) and still fires without needing the axis"
    rule_id: owasp_web_sensitive_file_read
    event:
      type: file
      comm: "node"
      container_id: "f32bdc4a519b"
      file:
        filename: "/etc/passwd"
        op: read
    expect: alert
    expect_severity: critical
